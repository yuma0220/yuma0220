<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>二次関数：プロフェッショナル解析 Master</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #050507; --card: #111116; --accent: #8b5cf6; --sub-text: #94a3b8; --text: #f9fafb; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* シックなヴァイオレットUI */
        aside { width: 330px; background: var(--card); border-right: 1px solid #222; padding: 25px; overflow-y: auto; }
        h1 { color: #fff; font-size: 1.4rem; font-weight: 900; letter-spacing: -1px; margin-top: 0; margin-bottom: 30px; }
        .lvl-h { color: var(--accent); font-size: 0.75rem; letter-spacing: 1px; margin: 25px 0 10px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .q-btn { width: 100%; text-align: left; padding: 12px; background: transparent; border: none; color: var(--sub-text); cursor: pointer; border-radius: 6px; font-size: 0.85rem; margin-bottom: 2px; }
        .q-btn:hover { background: #1a1a1f; color: white; }
        .q-btn.active { color: white; background: #2e1065; border-left: 3px solid var(--accent); }

        /* メインエリア */
        main { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .p-card { background: var(--card); border-radius: 12px; padding: 35px; border: 1px solid #222; }
        .math-box { font-size: 2.2rem; text-align: center; margin: 25px 0; padding: 25px; background: #000; border-radius: 10px; border: 1px solid #333; min-height: 1.2em; }
        .instr { font-size: 1.2rem; line-height: 1.6; color: #d1d5db; margin-bottom: 25px; }
        
        .ai-expl { background: #0c0c10; border: 1px solid var(--accent); border-radius: 8px; padding: 25px; display: none; line-height: 1.9; }
        .step { color: var(--accent); font-weight: bold; margin-top: 20px; display: block; border-bottom: 1px solid #222; }

        .chart-box { flex: 1; min-height: 400px; background: #000; border-radius: 12px; border: 1px solid #222; }
        .ctrl { display: flex; gap: 15px; }
        button.primary { flex: 1; background: var(--accent); color: white; border: none; padding: 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
    </style>
</head>
<body>

<aside>
    <h1>二次関数 Pro</h1>
    
    <div class="lvl-h">LEVEL 1：基礎解析</div>
    <button class="q-btn active" id="btn-v" onclick="app.select('v')">決定：3条件と基本形</button>
    <button class="q-btn" id="btn-m" onclick="app.select('m')">移動：平行と対称</button>
    
    <div class="lvl-h">LEVEL 2：値の範囲と接線</div>
    <button class="q-btn" id="btn-r" onclick="app.select('r')">最大・最小：動く軸と定義域</button>
    <button class="q-btn" id="btn-tangent" onclick="app.select('tangent')">共通接線：接触条件 D=0</button>
    
    <div class="lvl-h">LEVEL 3：高度な解析</div>
    <button class="q-btn" id="btn-sep" onclick="app.select('sep')">解の分離：条件と分離</button>
    <button class="q-btn" id="btn-p" onclick="app.select('p')">Focus Gold 78：主役交代</button>
    
    <div class="lvl-h">LEVEL 4：複合と通過領域</div>
    <button class="q-btn" id="btn-area" onclick="app.select('area')">通過領域：逆像解析</button>
    <button class="q-btn" id="btn-v2" onclick="app.select('v2')">2変数：拘束条件下最大最小</button>
</aside>

<main>
    <div class="p-card">
        <div id="q-instr" class="instr"></div>
        <div id="q-formula" class="math-box"></div>
        <div class="ctrl">
            <button class="primary" onclick="app.showExpl()">詳細な解法を表示</button>
            <button class="primary" style="background:#222;" onclick="app.reload()">類題を生成</button>
        </div>
    </div>
    <div id="expl" class="ai-expl"></div>
    <div class="chart-box"><canvas id="mainChart"></canvas></div>
</main>

<script>
const app = {
    mode: 'v',
    chart: null,
    current: {},

    // 数式クリーナー (1x, 0x 排除)
    fmt(a, b, c, x="x") {
        let s = "";
        const term = (v, p) => {
            if (v === 0) return "";
            let res = v > 0 ? (s ? "+" : "") : "-";
            let av = Math.abs(v);
            if (av !== 1 || p === 0) res += av;
            if (p > 0) res += x;
            if (p > 1) res += "^" + p;
            return res;
        };
        s += term(a, 2); s += term(b, 1); s += term(c, 0);
        return s || "0";
    },

    select(m) {
        this.mode = m;
        document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + m).classList.add('active');
        this.reload();
    },

    async reload() {
        document.getElementById('expl').style.display = 'none';
        let f="", i="", e="", g={a:1, b:0, c:0, type:'normal'};
        const a = Math.random() > 0.5 ? 1 : -1;
        const p = Math.floor(Math.random()*5)-2;

        switch(this.mode) {
            case 'v':
                g = {a, b:-2*a*p, c:a*p*p+1};
                f = `f(x) = ${this.fmt(g.a, g.b, g.c)}`;
                i = `頂点が (${p}, 1) で点 (0, ${g.c}) を通る2次関数を求めなさい。`;
                e = `<span class='step'>1. 基本形の利用</span> $y = a(x-p)^2 + q$ に頂点を代入します。<br><span class='step'>2. 係数の決定</span> 点を代入して $a$ を求め、展開します。`;
                break;
            case 'tangent':
                f = "y = x^2 \\text{ と } y = -(x-2)^2 + 2";
                i = "2つの放物線の共通接線の方程式を求めなさい。";
                e = `<span class='step'>1. 接点をおく</span> 接点を $(t, t^2)$ とし、接線の方程式 $y=2tx-t^2$ を作ります。<br><span class='step'>2. 条件の合致</span> 直線をもう一方の放物線に代入し、$D=0$ となる $t$ を求めます。`;
                g = {type:'double', a1:1, b1:0, c1:0, a2:-1, b2:4, c2:-2};
                break;
            case 'sep':
                f = "x^2 - 2mx + m + 2 = 0";
                i = "2つの解がともに 1 より大きくなるような定数 m の範囲を求めよ。";
                e = `<span class='step'>3つの条件</span> ①判別式 $D \\ge 0$、②軸 $x = m > 1$、③端点 $f(1) > 0$ を連立させます。`;
                g = {a:1, b:-4, c:6};
                break;
            case 'p':
                f = "f(x) = x^2 - 2px - p^2 + 2p - 1";
                i = "【FG 78】実数 p がどのような値をとっても f(x) < 0 となる x の範囲を求めよ。";
                e = `<span class='step'>主役の交代</span> pの2次関数 $g(p)$ と見て、常に負となる条件（判別式 $D < 0$）を解きます。`;
                g = {a:1, b:-2, c:0};
                break;
            case 'area':
                f = "y = x^2 - 2mx + m^2 + m \\quad (0 \\le m \\le 1)";
                i = "mが動くときの通過領域を求め、境界線を解析せよ。";
                e = `<span class='step'>逆像法</span> mの2次方程式が解を持つ条件を、$0 \\le m \\le 1$ の範囲で調べます。`;
                g = {a:1, b:-2, c:1};
                break;
        }
        this.current = {f, i, e, g};
        
        // 問題文と数式をセット
        document.getElementById('q-instr').innerText = i;
        document.getElementById('q-formula').innerHTML = "\\[ " + f + " \\]";
        
        // MathJax 3 のレンダリングを予約
        if (window.MathJax) MathJax.typesetPromise();
        this.draw();
    },

    showExpl() {
        const el = document.getElementById('expl');
        el.innerHTML = "<h3 style='margin:0; color:var(--accent)'>AI解析レポート</h3>" + this.current.e;
        el.style.display = 'block';
        // 解説の中の数式をレンダリング
        if (window.MathJax) MathJax.typesetPromise([el]);
    },

    draw() {
        const ctx = document.getElementById('mainChart').getContext('2d');
        if (this.chart) this.chart.destroy();
        const g = this.current.g;
        let ds = [];

        if (g.type === 'double') {
            let d1 = [], d2 = [];
            for (let x=-5; x<=5; x+=0.1) {
                d1.push({x, y: g.a1*x*x + g.b1*x + g.c1});
                d2.push({x, y: g.a2*x*x + g.b2*x + g.c2});
            }
            ds.push({data:d1, showLine:true, borderColor:'#6366f1', borderWidth:3, pointRadius:0});
            ds.push({data:d2, showLine:true, borderColor:'#ec4899', borderWidth:3, pointRadius:0});
        } else {
            let d = [];
            for (let x=-8; x<=8; x+=0.1) d.push({x, y: g.a*x*x + g.b*x + g.c});
            ds.push({data:d, showLine:true, borderColor:'#fff', borderWidth:3, pointRadius:0});
        }

        this.chart = new Chart(ctx, {
            type: 'scatter',
            data: { datasets: ds },
            options: { 
                responsive: true, maintainAspectRatio: false,
                scales: { 
                    x: { min:-5, max:5, grid:{color:'#222'} }, 
                    y: { min:-3, max:8, grid:{color:'#222'} } 
                },
                plugins: { legend: { display: false } }
            }
        });
    }
};

window.onload = () => app.reload();
</script>
</body>
</html>
