<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Focus Gold Ultimate AI Engine</title>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #050505; --neon: #00f2ff; --pink: #ff00ff; --panel: #111; }
        body { background: var(--bg); color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* サイドメニュー */
        aside { width: 320px; background: #000; border-right: 1px solid #333; padding: 25px; display: flex; flex-direction: column; }
        .brand { font-size: 1.5rem; font-weight: bold; color: var(--pink); margin-bottom: 30px; letter-spacing: 2px; }
        .nav-group { margin-bottom: 20px; }
        .nav-label { font-size: 0.7rem; color: #555; text-transform: uppercase; margin-bottom: 10px; display: block; }
        .q-btn { width: 100%; text-align: left; padding: 12px; background: #111; border: 1px solid #222; color: #888; cursor: pointer; margin-bottom: 5px; border-radius: 4px; transition: 0.3s; }
        .q-btn:hover { border-color: var(--neon); color: #fff; }
        .q-btn.active { border-color: var(--neon); background: #1a1a1a; color: #fff; box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); }

        /* メインコンテンツ */
        main { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--panel); border: 1px solid #222; padding: 30px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .status-bar { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--neon); margin-bottom: 15px; }
        .status-dot { width: 8px; height: 8px; background: var(--neon); border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }

        /* 数式表示エリア */
        .math-container { background: #000; border: 1px solid #333; padding: 40px; border-radius: 4px; margin: 20px 0; min-height: 120px; display: flex; align-items: center; justify-content: center; }
        #math-output { font-size: 2rem; }

        /* 操作ボタン */
        .controls { display: flex; gap: 15px; }
        .btn-main { flex: 2; padding: 18px; background: var(--neon); color: #000; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-main:hover { filter: brightness(1.1); box-shadow: 0 0 20px var(--neon); }

        /* グラフエリア */
        .graph-wrap { flex: 1; background: #000; border: 1px solid #222; border-radius: 8px; min-height: 400px; padding: 10px; }
    </style>
</head>
<body>

<aside>
    <div class="brand">FG-ULTIMATE</div>
    
    <div class="nav-group">
        <span class="nav-label">軌跡・領域</span>
        <button class="q-btn active" onclick="engine.setMode('passing', this)">通過領域の完全解析</button>
    </div>

    <div class="nav-group">
        <span class="nav-label">方程式・不等式</span>
        <button class="q-btn" onclick="engine.setMode('roots', this)">解の配置：存在条件</button>
        <button class="q-btn" onclick="engine.setMode('integers', this)">整数解の個数限定</button>
    </div>

    <div class="nav-group">
        <span class="nav-label">図形と計量</span>
        <button class="q-btn" onclick="engine.setMode('triangle', this)">直角三角形の境界値</button>
        <button class="q-btn" onclick="engine.setMode('symmetry', this)">対称式の変数変換</button>
    </div>
</aside>

<main>
    <div class="card">
        <div class="status-bar">
            <div class="status-dot"></div>
            <span id="ai-status">AI ENGINE READY: WAITING FOR PARAMETERS</span>
        </div>
        <div id="instruction" style="font-size: 1.1rem; line-height: 1.6; color: #ccc;"></div>
        
        <div class="math-container">
            <div id="math-output"></div>
        </div>

        <div class="controls">
            <button class="btn-main" onclick="engine.generate()">Generate Randomized Problem</button>
        </div>
    </div>

    <div class="graph-wrap">
        <canvas id="graphCanvas"></canvas>
    </div>
</main>

<script>
/**
 * Focus Gold AI Logic Engine (100+ lines of specialized logic)
 */
const engine = {
    mode: 'passing',
    chart: null,
    
    // AI乱数生成器
    randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; },
    
    setMode(m, btn) {
        this.mode = m;
        document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        this.generate();
    },

    // 最強AI問題生成ロジック
    generate() {
        const out = document.getElementById('math-output');
        const inst = document.getElementById('instruction');
        const status = document.getElementById('ai-status');
        
        let formula = "";
        let text = "";
        
        // パラメータの完全ランダム化
        const a = this.randomInt(1, 4);
        const b = this.randomInt(-5, 5);
        const c = this.randomInt(1, 6);
        const targetCount = this.randomInt(2, 5);

        status.innerText = `AI THINKING... GENERATING ${this.mode.toUpperCase()} PROBLEM`;

        switch(this.mode) {
            case 'passing':
                const rangeEnd = this.randomInt(1, 3);
                text = `定数 m が 0 \\leqq m \\leqq ${rangeEnd} の範囲を動くとき、次の2次関数が通過する領域を求め、図示せよ。`;
                formula = `y = x^2 - ${a*2}mx + ${a}m`;
                this.renderGraph('area', {a, b: -2*a, c: a, range: rangeEnd});
                break;

            case 'roots':
                const xStart = this.randomInt(-2, 1);
                const xEnd = xStart + this.randomInt(3, 5);
                text = `方程式 f(x) = 0 が、${xStart} \\leqq x \\leqq ${xEnd} の範囲に少なくとも1つの実数解をもつような定数 a の範囲を求めよ。`;
                formula = `f(x) = x^2 - 2ax + ${this.randomInt(1, 10)}`;
                this.renderGraph('para', {a: 1, b: -2, c: 5});
                break;

            case 'integers':
                text = `不等式 f(x) \\leqq 0 を満たす整数 x がちょうど ${targetCount} 個存在するような整数 m の値をすべて求めよ。`;
                formula = `f(x) = x^2 - mx + \\frac{m}{${this.randomInt(2, 4)}} - 1`;
                this.renderGraph('para', {a: 1, b: -targetCount, c: 0});
                break;

            case 'triangle':
                const sumVal = this.randomInt(1, 10);
                text = `直角三角形の3辺の長さの和が ${sumVal} であるとき、斜辺の長さ c のとり得る値の範囲を求めよ。`;
                formula = `a^2 + b^2 = c^2, \\quad a+b+c = ${sumVal}`;
                this.renderGraph('line', {});
                break;

            case 'symmetry':
                const total = this.randomInt(5, 20);
                text = `x, y が実数であるとき、次の連立方程式が実数解をもつための k の範囲を求めよ。`;
                formula = `\\begin{cases} x^2 + xy + y^2 = ${total} \\\\ x^2 + y^2 = k \\end{cases}`;
                this.renderGraph('circle', {r: Math.sqrt(total)});
                break;
        }

        inst.innerHTML = `\\( ${text} \\)`;
        out.innerHTML = `\\[ ${formula} \\]`;

        // MathJaxの再描画
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    },

    // 動的グラフ描画システム
    renderGraph(type, params) {
        const ctx = document.getElementById('graphCanvas').getContext('2d');
        if (this.chart) this.chart.destroy();

        let datasets = [];
        
        if (type === 'area') {
            // 通過領域のシミュレーション描画
            for (let m = 0; m <= params.range; m += params.range/10) {
                let data = [];
                for (let x = -2; x <= 4; x += 0.1) {
                    data.push({x: x, y: x*x + params.b*m*x + params.c*m});
                }
                datasets.push({
                    data: data,
                    showLine: true,
                    borderColor: `rgba(0, 242, 255, ${1 - m/params.range})`,
                    borderWidth: 1,
                    pointRadius: 0
                });
            }
        } else {
            // 通常の放物線など
            let data = [];
            for (let x = -10; x <= 10; x += 0.2) {
                data.push({x: x, y: params.a * x * x + (params.b || 0) * x + (params.c || 0)});
            }
            datasets.push({
                data: data,
                showLine: true,
                borderColor: '#ff00ff',
                borderWidth: 2,
                pointRadius: 0
            });
        }

        this.chart = new Chart(ctx, {
            type: 'scatter',
            data: { datasets: datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { type: 'linear', position: 'center', grid: { color: '#222' } },
                    y: { type: 'linear', position: 'center', grid: { color: '#222' } }
                },
                plugins: { legend: { display: false } }
            }
        });
    }
};

// 初期起動
window.onload = () => engine.generate();
</script>

</body>
</html>
