<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIGA CORE 3,000,000 | Open Source Edition</title>
    <style>
        :root { --bg: #fdfdfd; --side: #ffffff; --accent: #007aff; --text: #1d1d1f; --grid: #f2f2f7; --sub: #8e8e93; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; overflow: hidden; }
        
        /* Sidebar Navigation */
        aside { width: 260px; background: var(--side); border-right: 1px solid #e5e5e7; display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 100; }
        aside.collapsed { transform: translateX(-260px); position: absolute; height: 100%; }
        .nav-head { padding: 25px 20px; font-weight: 800; color: var(--accent); font-size: 1.2rem; border-bottom: 1px solid var(--grid); }
        .nav-scroll { flex: 1; overflow-y: auto; padding: 10px 15px; }
        .cat { font-size: 0.65rem; color: var(--sub); margin: 15px 0 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .nav-btn { width: 100%; padding: 12px; background: none; border: none; color: #444; text-align: left; cursor: pointer; border-radius: 10px; font-size: 0.85rem; margin-bottom: 4px; transition: 0.2s; }
        .nav-btn:hover { background: #f2f2f7; }
        .nav-btn.active { background: var(--accent); color: #fff; font-weight: 600; box-shadow: 0 4px 12px rgba(0,122,255,0.2); }

        /* Main Content */
        main { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 15px; position: relative; min-width: 0; }
        .menu-trigger { position: absolute; left: 15px; top: 15px; z-index: 101; cursor: pointer; background: #fff; border: 1px solid #ddd; padding: 8px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

        /* Problem Card */
        .p-card { background: #fff; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); min-height: 40%; overflow-y: auto; display: flex; flex-direction: column; }
        .math-row { font-size: 1.8rem; font-weight: 700; text-align: center; margin: 10px 0; word-break: break-all; }
        .inst-row { font-size: 1.1rem; color: var(--accent); text-align: center; font-weight: 600; margin-bottom: 20px; }
        .btn-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn { flex: 1; height: 48px; border-radius: 12px; border: none; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: 0.2s; }
        .btn-gen { background: var(--accent); color: #fff; }
        .btn-ans { background: #f2f2f7; color: #1d1d1f; }
        .ans-box { padding: 18px; background: #f9f9fb; border-radius: 12px; display: none; line-height: 1.6; font-size: 0.95rem; border-left: 5px solid var(--accent); animation: fadeIn 0.3s ease; }

        /* Visualizer */
        .graph-box { flex: 1; background: #fff; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); position: relative; overflow: hidden; border: 1px solid #f0f0f0; }
        canvas { width: 100%; height: 100%; }
        .controls { position: absolute; bottom: 15px; right: 15px; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); padding: 15px; border-radius: 15px; border: 1px solid #eee; width: 220px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .ctrl-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
        .ctrl-row label { font-size: 0.65rem; font-weight: 800; color: #888; text-transform: uppercase; }
        input[type=range] { width: 100%; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { aside { position: absolute; height: 100%; } }
    </style>
</head>
<body>

<div class="menu-trigger" id="menuToggle">MENU</div>

<aside id="sidebar">
    <div class="nav-head">GIGA CORE 3M</div>
    <div class="nav-scroll" id="navContainer">
        <div class="cat">Analysis & Logic</div>
        <button class="nav-btn active" data-mode="f1">文字平方完成</button>
        <button class="nav-btn" data-mode="f2">動く区間の最大最小</button>
        <button class="nav-btn" data-mode="f3">解の配置: 思考プロセス</button>
        <div class="cat">Complex Geometry</div>
        <button class="nav-btn" data-mode="f4">絶対値の多重折り畳み</button>
        <button class="nav-btn" data-mode="f5">通過領域と包絡線</button>
        <button class="nav-btn" data-mode="f6">二次曲線の接線(数III)</button>
        <div class="cat">Divine Mechanics</div>
        <button class="nav-btn" data-mode="f7">格子点計数アルゴリズム</button>
        <button class="nav-btn" data-mode="f8">放物線と直線の求積</button>
        <button class="nav-btn" data-mode="f9">頂点の軌跡連鎖</button>
    </div>
</aside>

<main>
    <div class="p-card">
        <div id="q-math" class="math-row"></div>
        <div id="q-inst" class="inst-row"></div>
        <div class="btn-row">
            <button class="btn btn-gen" id="genBtn">GENERATION</button>
            <button class="btn btn-ans" id="ansBtn">ANALYSIS STEP</button>
        </div>
        <div id="ans-box" class="ans-box"></div>
    </div>
    <div class="graph-box">
        <canvas id="mainCanvas"></canvas>
        <div class="controls">
            <div class="ctrl-row">
                <label>Param A: <span id="labelA">1.0</span></label>
                <input type="range" id="inputA" min="-5" max="5" step="0.1" value="1">
            </div>
            <div class="ctrl-row">
                <label>Param B: <span id="labelB">0.0</span></label>
                <input type="range" id="inputB" min="-5" max="5" step="0.1" value="0">
            </div>
        </div>
    </div>
</main>

<script>
/**
 * GIGA CORE 3,000,000 : Stability First Edition
 */
const CoreApp = {
    mode: 'f1',
    paramA: 1.0,
    paramB: 0.0,
    
    init() {
        this.cacheDOM();
        this.bindEvents();
        this.generateProblem();
        this.render();
    },

    cacheDOM() {
        this.dom = {
            sidebar: document.getElementById('sidebar'),
            menuToggle: document.getElementById('menuToggle'),
            navBtns: document.querySelectorAll('.nav-btn'),
            qMath: document.getElementById('q-math'),
            qInst: document.getElementById('q-inst'),
            ansBox: document.getElementById('ans-box'),
            genBtn: document.getElementById('genBtn'),
            ansBtn: document.getElementById('ansBtn'),
            canvas: document.getElementById('mainCanvas'),
            inputA: document.getElementById('inputA'),
            inputB: document.getElementById('inputB'),
            labelA: document.getElementById('labelA'),
            labelB: document.getElementById('labelB')
        };
        this.ctx = this.dom.canvas.getContext('2d');
    },

    bindEvents() {
        this.dom.menuToggle.addEventListener('click', () => this.dom.sidebar.classList.toggle('collapsed'));
        this.dom.genBtn.addEventListener('click', () => this.generateProblem());
        this.dom.ansBtn.addEventListener('click', () => this.toggleAnalysis());
        
        this.dom.navBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                this.dom.navBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                this.mode = e.target.dataset.mode;
                this.generateProblem();
            });
        });

        const updateParams = () => {
            this.paramA = parseFloat(this.dom.inputA.value);
            this.paramB = parseFloat(this.dom.inputB.value);
            this.dom.labelA.innerText = this.paramA.toFixed(1);
            this.dom.labelB.innerText = this.paramB.toFixed(1);
            this.render();
        };

        this.dom.inputA.addEventListener('input', updateParams);
        this.dom.inputB.addEventListener('input', updateParams);
        window.addEventListener('resize', () => this.render());
    },

    engines: {
        f1: () => ({ q: "y = x² - 2ax + a² + 2a", i: "頂点の座標を a で表せ。", a: "1. 平方完成: (x-a)² + 2a<br>2. 頂点定義より、x=a, y=2a<br>3. 結論: (a, 2a)" }),
        f2: () => ({ q: "y = x² - 4x + 5 (a ≦ x ≦ a+2)", i: "最大値 M(a) が 10 となる a は？", a: "1. 軸 x=2 と区間中央 a+1 を比較<br>2. a < 1 (左寄り) か a ≧ 1 (右寄り) で場合分け<br>3. 各端点の値を計算し方程式を解く。" }),
        f3: () => ({ q: "x² - 2ax + 3a = 0 (1 < x < 3)", i: "異なる2解を持つ a の範囲？", a: "1. D > 0 (判別式)<br>2. 1 < 軸 < 3<br>3. f(1) > 0 かつ f(3) > 0" }),
        f4: () => ({ q: "y = | |x² - a| - b |", i: "共有点の個数の変化を追え。", a: "1. 基本形 x²-a の描画<br>2. 折り返し処理<br>3. bによる平行移動後の再折り返し" }),
        f5: () => ({ q: "y = 2ax - a² (0 ≦ a ≦ 1)", i: "通過領域の境界線を求めよ。", a: "1. a の二次方程式とみなす<br>2. 判別式 D≧0 から y ≦ x² を導出<br>3. 境界条件をグラフで確認" }),
        f6: () => ({ q: "x²/4 + y²/1 = 1", i: "接線の傾きと接点を連動させよ。", a: "接線の公式: (x1)x/a² + (y1)y/b² = 1" }),
        f7: () => ({ q: "y ≧ x², y ≦ ax + b", i: "領域内の格子点数を動的に計算。", a: "各整数 x における (upper_y - lower_y) の和。" }),
        f8: () => ({ q: "y = x² - 4, y = -x² + 4", i: "囲まれた面積の最小化。", a: "1/6公式 S = |a|/6 * (β-α)³ の適用。" }),
        f9: () => ({ q: "y = x² - 2ax + a² + a", i: "頂点の軌跡を a を消去して求めよ。", a: "X=a, Y=a より Y=X すなわち y=x" })
    },

    generateProblem() {
        const data = this.engines[this.mode]();
        this.dom.qMath.innerHTML = data.q;
        this.dom.qInst.innerText = data.i;
        this.dom.ansBox.innerHTML = data.a;
        this.dom.ansBox.style.display = 'none';
        this.render();
    },

    toggleAnalysis() {
        const display = this.dom.ansBox.style.display;
        this.dom.ansBox.style.display = (display === 'block') ? 'none' : 'block';
    },

    render() {
        const { canvas, ctx } = this;
        const w = canvas.width = canvas.offsetWidth;
        const h = canvas.height = canvas.offsetHeight;
        const scale = 45;
        const ox = w / 2;
        const oy = h / 2 + 50;

        ctx.clearRect(0, 0, w, h);

        // Grid
        ctx.strokeStyle = '#f2f2f7';
        ctx.lineWidth = 1;
        for (let i = -20; i <= 20; i++) {
            ctx.beginPath(); ctx.moveTo(ox + i * scale, 0); ctx.lineTo(ox + i * scale, h); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, oy - i * scale); ctx.lineTo(w, oy - i * scale); ctx.stroke();
        }

        // Axes
        ctx.strokeStyle = '#d1d1d6';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(w, oy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, h); ctx.stroke();

        // Plot
        ctx.strokeStyle = '#007aff';
        ctx.lineWidth = 3;
        ctx.beginPath();

        for (let i = 0; i < w; i++) {
            let x = (i - ox) / scale;
            let y = 0;
            const a = this.paramA;
            const b = this.paramB;

            switch(this.mode) {
                case 'f4': y = Math.abs(Math.abs(x*x - a) - Math.abs(b)); break;
                case 'f5': y = 2*a*x - a*a; break;
                case 'f6': 
                    ctx.save(); ctx.strokeStyle = '#ff9500';
                    ctx.beginPath();
                    for(let t=0; t<Math.PI*2; t+=0.1){
                        let ex = ox + Math.cos(t)*2*scale;
                        let ey = oy - Math.sin(t)*1*scale;
                        if(t===0) ctx.moveTo(ex, ey); else ctx.lineTo(ex, ey);
                    }
                    ctx.stroke(); ctx.restore();
                    y = -100; // Skip main plot
                    break;
                case 'f7':
                    this.drawLattice(ctx, ox, oy, scale, a, b);
                    y = x*x; ctx.strokeStyle = 'rgba(0,122,255,0.2)';
                    break;
                default:
                    y = a * x * x + b * x;
            }

            let py = oy - y * scale;
            if (i === 0) ctx.moveTo(i, py); else ctx.lineTo(i, py);
        }
        ctx.stroke();
    },

    drawLattice(ctx, ox, oy, s, a, b) {
        ctx.fillStyle = '#ff3b30';
        for(let x=-4; x<=4; x++) {
            for(let y=-2; y<=6; y++) {
                if(y >= x*x - 0.1 && y <= a*x + b + 3 + 0.1) {
                    ctx.beginPath(); ctx.arc(ox + x*s, oy - y*s, 3, 0, Math.PI*2); ctx.fill();
                }
            }
        }
    }
};

document.addEventListener('DOMContentLoaded', () => CoreApp.init());
</script>
</body>
</html>
