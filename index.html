<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ポータブル教頭：基礎から叩き込む二次関数</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            chtml: { displayAlign: 'center' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root { --bg: #f8f9fa; --main: #2c3e50; --accent: #e74c3c; --sub: #3498db; --white: #ffffff; }
        body { background: var(--bg); color: var(--main); font-family: 'Helvetica Neue', 'Arial', 'Hiragino Kaku Gothic ProN', sans-serif; margin: 0; display: flex; height: 100vh; }
        
        /* サイドバー：教頭の学習指示棚 */
        aside { width: 320px; background: var(--main); color: white; padding: 30px; display: flex; flex-direction: column; box-shadow: 4px 0 10px rgba(0,0,0,0.1); }
        .mode-label { font-size: 0.75rem; color: #bdc3c7; letter-spacing: 1px; margin-bottom: 5px; }
        .nav-group { margin-bottom: 20px; border-bottom: 1px solid #455a64; padding-bottom: 15px; }
        
        .menu-btn { width: 100%; padding: 12px; background: rgba(255,255,255,0.1); border: none; color: white; text-align: left; cursor: pointer; margin-bottom: 8px; border-radius: 6px; font-size: 0.9rem; transition: 0.3s; }
        .menu-btn:hover { background: rgba(255,255,255,0.2); }
        .menu-btn.active { background: var(--sub); font-weight: bold; }
        .menu-btn.kiso { border-left: 5px solid #2ecc71; }
        .menu-btn.nanmon { border-left: 5px solid var(--accent); }

        /* メイン講義エリア */
        main { flex: 1; padding: 40px; display: flex; flex-direction: column; gap: 25px; overflow-y: auto; }
        .lecture-card { background: var(--white); border-radius: 15px; padding: 35px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border-top: 5px solid var(--sub); }
        .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .difficulty { font-weight: bold; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; }
        
        .formula-box { background: #f1f3f5; border-radius: 10px; padding: 30px; margin: 20px 0; font-size: 2rem; text-align: center; color: #1a1a1a; }
        
        .control-btns { display: flex; gap: 15px; margin-top: 20px; }
        .btn { flex: 1; padding: 18px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .btn-main { background: var(--sub); color: white; }
        .btn-main:hover { background: #2980b9; transform: translateY(-2px); }

        .graph-area { background: white; border-radius: 15px; padding: 20px; height: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<aside>
    <div style="margin-bottom: 30px;">
        <h2 style="margin:0; font-size: 1.5rem;">ポータブル教頭</h2>
        <p style="font-size: 0.8rem; opacity: 0.7;">FG完全網羅・学習支援システム</p>
    </div>

    <div class="nav-group">
        <span class="mode-label">【基礎固め：星1〜2】</span>
        <button class="menu-btn kiso active" onclick="app.setMode('base_top', this)">頂点と平方完成</button>
        <button class="menu-btn kiso" onclick="app.setMode('base_move', this)">グラフの平行移動</button>
        <button class="menu-btn kiso" onclick="app.setMode('base_ineq', this)">2次不等式の基礎</button>
    </div>

    <div class="nav-group">
        <span class="mode-label">【入試標準：星3〜4】</span>
        <button class="menu-btn nanmon" onclick="app.setMode('root_pos', this)">解の配置</button>
        <button class="menu-btn nanmon" onclick="app.setMode('area', this)">通過領域</button>
        <button class="menu-btn nanmon" onclick="app.setMode('abs', this)">絶対値の共有点</button>
    </div>
</aside>

<main>
    <div class="lecture-card">
        <div class="q-header">
            <span id="q-title" style="font-size: 1.2rem; font-weight: bold;">頂点と平方完成の特訓</span>
            <span id="q-diff" class="difficulty" style="background: #e8f8f5; color: #2ecc71;">FG 星1級</span>
        </div>
        <div id="q-text" style="line-height: 1.8;"></div>
        <div class="formula-box" id="q-math"></div>
        <div class="control-btns">
            <button class="btn btn-main" onclick="app.generate()">数値を入れ替えて練習</button>
        </div>
    </div>

    <div class="graph-area">
        <canvas id="mainChart"></canvas>
    </div>
</main>

<script>
const app = {
    mode: 'base_top', chart: null,
    r(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; },

    setMode(m, btn) {
        this.mode = m;
        document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        this.generate();
    },

    generate() {
        const text = document.getElementById('q-text');
        const math = document.getElementById('q-math');
        const title = document.getElementById('q-title');
        const diff = document.getElementById('q-diff');
        
        let t = "", m = "", conf = {};
        const a = this.r(1, 3); const p = this.r(-5, 5); const q = this.r(-5, 5);
        const b = -2 * a * p; const c = a * p * p + q;

        switch(this.mode) {
            case 'base_top':
                title.innerText = "頂点と平方完成の特訓";
                diff.innerText = "FG 星1級"; diff.style.background="#e8f8f5"; diff.style.color="#2ecc71";
                t = `次の2次関数を平方完成し、頂点の座標を求めなさい。`;
                m = `y = ${a === 1 ? '' : a}x^2 ${b >= 0 ? '+' : ''} ${b}x ${c >= 0 ? '+' : ''} ${c}`;
                conf = { type: 'p', a: a, p: p, q: q }; break;
            case 'base_move':
                title.innerText = "グラフの平行移動";
                diff.innerText = "FG 星2級"; diff.style.background="#e8f8f5"; diff.style.color="#2ecc71";
                const dx = this.r(-3, 3); const dy = this.r(-3, 3);
                t = `放物線 $y = x^2$ を、$x$ 軸方向に ${dx}、$y$ 軸方向に ${dy} だけ平行移動したあとの方程式を求めよ。`;
                m = `y = x^2 \\longrightarrow 移動後 ?`;
                conf = { type: 'p', a: 1, p: dx, q: dy }; break;
            case 'base_ineq':
                title.innerText = "2次不等式の基礎";
                diff.innerText = "FG 星2級"; diff.style.background="#e8f8f5"; diff.style.color="#2ecc71";
                const x1 = this.r(1, 3); const x2 = this.r(4, 6);
                t = `次の2次不等式を解け。グラフをイメージして範囲を答えること。`;
                m = `(x - ${x1})(x - ${x2}) \\leqq 0`;
                conf = { type: 'i', x1: x1, x2: x2 }; break;
            case 'root_pos':
                title.innerText = "解の配置 (D・軸・端点)";
                diff.innerText = "FG 星4級"; diff.style.background="#fdedec"; diff.style.color="#e74c3c";
                t = `2次方程式 $x^2 - 2ax + ${this.r(4, 8)} = 0$ が、$x > 1$ の範囲に異なる2つの実数解をもつ定数 $a$ の範囲。`;
                m = `x^2 - 2ax + ${this.r(4, 8)} = 0`;
                conf = { type: 'p', a: 1, p: 3, q: -2 }; break;
            case 'area':
                title.innerText = "通過領域 (逆像法)";
                diff.innerText = "FG 星4級"; diff.style.background="#fdedec"; diff.style.color="#e74c3c";
                t = `実数 $m$ が $0 \\leqq m \\leqq 1$ を動くとき、$y = x^2 - 2mx + m$ が動く範囲。`;
                m = `y = x^2 - 2mx + m`;
                conf = { type: 'area' }; break;
        }

        text.innerHTML = t;
        math.innerHTML = `\\[ ${m} \\]`;
        if (window.MathJax) MathJax.typesetPromise();
        this.draw(conf);
    },

    draw(conf) {
        const ctx = document.getElementById('mainChart').getContext('2d');
        if (this.chart) this.chart.destroy();
        let ds = [];
        
        if (conf.type === 'p') {
            let d = []; for(let x=-10; x<=10; x+=0.2) d.push({x: x, y: conf.a * Math.pow(x - conf.p, 2) + conf.q});
            ds.push({ data: d, showLine: true, borderColor: '#3498db', borderWidth: 3, pointRadius: 0 });
            ds.push({ data: [{x: conf.p, y: conf.q}], pointRadius: 6, pointBackgroundColor: '#e74c3c', label: '頂点' });
        } else if (conf.type === 'i') {
            let d = []; for(let x=conf.x1-2; x<=conf.x2+2; x+=0.2) d.push({x: x, y: (x-conf.x1)*(x-conf.x2)});
            ds.push({ data: d, showLine: true, borderColor: '#2ecc71', borderWidth: 3, pointRadius: 0 });
        } else if (conf.type === 'area') {
            for(let m=0; m<=1; m+=0.2) {
                let d = []; for(let x=-2; x<=4; x+=0.2) d.push({x: x, y: x*x - 2*m*x + m});
                ds.push({ data: d, showLine: true, borderColor: `rgba(52, 152, 219, ${1-m})`, borderWidth: 1, pointRadius: 0 });
            }
        }

        this.chart = new Chart(ctx, {
            type: 'scatter',
            data: { datasets: ds },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    x: { type: 'linear', position: 'center', min: -8, max: 8 },
                    y: { type: 'linear', position: 'center', min: -8, max: 8 }
                },
                plugins: { legend: { display: false } }
            }
        });
    }
};

window.onload = () => app.generate();
</script>
</body>
</html>
