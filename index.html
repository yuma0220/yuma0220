<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二次関数嫌い</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background: radial-gradient(circle at top,#0b1f35,#020617);
  color:white;
}

.container{
  display:flex;
  gap:20px;
  padding:20px;
}

.card{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  padding:20px;
}

.left{width:250px;}
.center{flex:1;}
.right{width:300px;}

input{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#111827;
  color:white;
}

button{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:8px;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:white;
  cursor:pointer;
}

.question{
  text-align:center;
  font-size:22px;
  margin:20px 0;
}

.row{
  display:flex;
  gap:10px;
}

canvas{
  background:#020617;
  border-radius:10px;
  width:100%;
}

.badge{
  background:#0ea5e9;
  padding:5px 10px;
  border-radius:10px;
  font-size:12px;
}
</style>
</head>

<body>

<h2 style="padding:20px;">📘 二次関数嫌い</h2>

<div class="container">

<!-- 左 -->
<div class="left">
  <div class="card">
    <p>名前</p>
    <input id="username">
    <button onclick="generate()">開始</button>
  </div>

  <div class="card">
    <p>難易度</p>
    <button onclick="setLevel('easy')">Easy</button>
    <button onclick="setLevel('normal')">Normal</button>
    <button onclick="setLevel('hard')">Hard</button>
  </div>
</div>

<!-- 中央 -->
<div class="center">
  <div class="card">

    <span class="badge">問題</span>

    <div id="question" class="question"></div>

    <div class="row">
      <input id="answer">
      <button onclick="check()">答える</button>
    </div>

    <p id="result"></p>
    <p id="score">スコア:0</p>

  </div>

  <div class="card">
    <canvas id="graph" width="700" height="350"></canvas>
  </div>
</div>

<!-- 右 -->
<div class="right">

  <div class="card">
    <p id="analysis">分析</p>
  </div>

  <div class="card">
    <p>履歴</p>
    <ul id="history"></ul>
  </div>

</div>

</div>

<script>
let a,b,c,correct,score=0;
let level="normal";

/* ===== 履歴・分析 ===== */
let history = JSON.parse(localStorage.getItem("history")) || [];

let stats = {
  easy:{ok:0,total:0},
  normal:{ok:0,total:0},
  hard:{ok:0,total:0}
};

/* ===== 難易度 ===== */
function setLevel(l){
  level=l;
  generate();
}

/* ===== ランダム ===== */
function rand(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}

/* ===== 問題生成 ===== */
function generate(){

  if(level==="easy"){
    a=1; b=rand(-4,4); c=0;
  }
  if(level==="normal"){
    a=rand(1,3); b=rand(-6,6); c=rand(-5,5);
  }
  if(level==="hard"){
    a=rand(-3,3)||1; b=rand(-8,8); c=rand(-8,8);
  }

  correct=-b/(2*a);

  document.getElementById("question").innerText=
  `y=${a}x²${b>=0?'+':''}${b}x${c>=0?'+':''}${c}
の頂点のx座標`;

  drawGraph();
}

/* ===== 判定 ===== */
function check(){
  let ans=Number(document.getElementById("answer").value);
  let ok=Math.abs(ans-correct)<0.5;

  document.getElementById("result").innerText=
    ok?"正解！":"不正解："+correct.toFixed(2);

  score+=ok?10:-5;
  document.getElementById("score").innerText="スコア:"+score;

  // 記録
  stats[level].total++;
  if(ok) stats[level].ok++;

  history.push({
    result: ok,
    level: level,
    date: new Date().toLocaleString()
  });

  localStorage.setItem("history", JSON.stringify(history));

  showHistory();
  analyze();

  generate();
}

/* ===== 履歴表示 ===== */
function showHistory(){
  const ul=document.getElementById("history");
  ul.innerHTML="";

  history.slice(-10).reverse().forEach(h=>{
    let li=document.createElement("li");
    li.innerText=`${h.date} : ${h.result?"○":"×"} (${h.level})`;
    ul.appendChild(li);
  });
}

/* ===== 分析 ===== */
function analyze(){
  let worst="easy";
  let worstRate=1;

  for(let k in stats){
    let r=stats[k].ok/(stats[k].total||1);
    if(r<worstRate){
      worstRate=r;
      worst=k;
    }
  }

  document.getElementById("analysis").innerText=
    `弱点: ${worst} (${Math.round(worstRate*100)}%)`;
}

/* ===== グラフ ===== */
function drawGraph(){
  const canvas=document.getElementById("graph");
  const ctx=canvas.getContext("2d");

  const W=canvas.width;
  const H=canvas.height;

  ctx.clearRect(0,0,W,H);

  const scale=30;
  const cx=W/2;
  const cy=H/2;

  // 背景
  ctx.fillStyle="#020617";
  ctx.fillRect(0,0,W,H);

  // グリッド
  ctx.strokeStyle="rgba(255,255,255,0.15)";
  for(let i=-10;i<=10;i++){
    let x=cx+i*scale;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();

    let y=cy-i*scale;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }

  // 軸
  ctx.strokeStyle="white";
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,cy); ctx.lineTo(W,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx,H); ctx.stroke();

  // 放物線
  ctx.strokeStyle="#60a5fa";
  ctx.lineWidth=3;
  ctx.beginPath();

  for(let x=-10;x<=10;x+=0.05){
    let y=a*x*x+b*x+c;
    let px=cx+x*scale;
    let py=cy-y*scale;

    if(x===-10) ctx.moveTo(px,py);
    else ctx.lineTo(px,py);
  }
  ctx.stroke();

  // 頂点
  let vx=-b/(2*a);
  let vy=a*vx*vx+b*vx+c;

  ctx.fillStyle="red";
  ctx.beginPath();
  ctx.arc(cx+vx*scale,cy-vy*scale,5,0,Math.PI*2);
  ctx.fill();
}

/* ===== 初期表示 ===== */
showHistory();
analyze();
generate();
</script>

</body>
</html>
