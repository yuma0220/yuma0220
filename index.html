<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>FG-MASTER AI: 完結・高速版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --neon: #00f2ff; --pink: #ff00ff; --text: #c9d1d9; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; display: flex; height: 100vh; }
        
        /* サイドバー */
        aside { width: 280px; background: #010409; border-right: 1px solid #30363d; padding: 20px; overflow-y: auto; }
        .menu-btn { width: 100%; padding: 12px; background: none; border: 1px solid #30363d; color: #8b949e; text-align: left; cursor: pointer; margin-bottom: 8px; border-radius: 6px; font-size: 0.85rem; }
        .menu-btn:hover { border-color: var(--neon); color: #fff; }
        .menu-btn.active { border-color: var(--neon); background: rgba(0, 242, 255, 0.05); color: var(--neon); }

        /* メイン */
        main { flex: 1; padding: 25px; display: grid; grid-template-rows: auto 1fr; gap: 20px; overflow: hidden; }
        .card { background: var(--card); border: 1px solid #30363d; border-radius: 12px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .math-box { background: #000; border: 1px solid var(--neon); padding: 20px; margin: 15px 0; text-align: center; font-size: 1.8rem; min-height: 80px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        
        .btn-gen { width: 100%; padding: 15px; background: var(--neon); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn-gen:hover { filter: brightness(1.1); box-shadow: 0 0 15px var(--neon); }

        .graph-wrap { background: #000; border: 1px solid #30363d; border-radius: 12px; padding: 10px; position: relative; min-height: 0; }
        canvas { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>

<aside>
    <h2 style="color: var(--neon); font-size: 1.2rem;">FGマスター AI</h2>
    <p style="font-size: 0.7rem; color: #8b949e;">全問題集網羅モード</p>
    <button class="menu-btn active" onclick="app.setMode('area', this)">通過領域 (逆像法)</button>
    <button class="menu-btn" onclick="app.setMode('roots', this)">解の配置 (D・軸・境界)</button>
    <button class="menu-btn" onclick="app.setMode('maxmin', this)">動く定義域の最大最小</button>
    <button class="menu-btn" onclick="app.setMode('abs', this)">絶対値と共有点の個数</button>
    <button class="menu-btn" onclick="app.setMode('int', this)">整数解の個数限定</button>
    <button class="menu-btn" onclick="app.setMode('sym', this)">対称式と実数存在条件</button>
</aside>

<main>
    <div class="card">
        <div id="instr" style="font-size: 1rem; line-height: 1.5; margin-bottom: 10px;"></div>
        <div class="math-box"><div id="math"></div></div>
        <button class="btn-gen" onclick="app.generate()">この単元の類題を無限生成</button>
    </div>
    <div class="graph-wrap">
        <canvas id="chart"></canvas>
    </div>
</main>

<script>
const app = {
    mode: 'area', chart: null,
    r(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; },
    
    setMode(m, b) {
        this.mode = m;
        document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
        b.classList.add('active');
        this.generate();
    },

    generate() {
        const inst = document.getElementById('instr');
        const math = document.getElementById('math');
        let t = "", m = "", conf = {};
        const a = this.r(1, 3); const b = this.r(2, 6); const k = this.r(3, 8);

        switch(this.mode) {
            case 'area':
                t = `実数 \(m\) が \(0 \leqq m \leqq ${a}\) の範囲を動くとき、放物線 \(y = x^2 - ${a*2}mx + m\) が通過する領域を求めよ。`;
                m = `y = x^2 - ${a*2}mx + m \\quad (0 \\leqq m \\leqq ${a})`;
                conf = { type: 'area', b: -a*2, range: a }; break;
            case 'roots':
                t = `方程式 \(x^2 - 2ax + ${k} = 0\) が \(x \geqq 1\) の範囲に異なる2つの実数解をもつ \(a\) の範囲を求めよ。`;
                m = `x^2 - 2ax + ${k} = 0 \\quad (x \geqq 1)`;
                conf = { type: 'std', a: 1, b: -4, c: k }; break;
            case 'maxmin':
                t = `定義域 \(0 \leqq x \leqq ${b}\) における関数 \(y = x^2 - 2ax + a\) の最大値 \(M(a)\) を求めよ。`;
                m = `y = x^2 - 2ax + a \\quad (0 \\leqq x \\leqq ${b})`;
                conf = { type: 'std', a: 1, b: -2, c: 1 }; break;
            case 'abs':
                t = `関数 \(y = |x^2 - ${a*2}x|\) と直線 \(y = k\) の共有点の個数が3個となる定数 \(k\) を求めよ。`;
                m = `y = |x^2 - ${a*2}x|`;
                conf = { type: 'abs', b: -a*2 }; break;
            case 'int':
                t = `不等式を満たす整数 \(x\) がちょうど 3個 あるような定数 \(m\) の範囲を求めよ。`;
                m = `x^2 - mx + \\frac{m}{4} - 1 \\leqq 0`;
                conf = { type: 'std', a: 1, b: -3, c: 0 }; break;
            case 'sym':
                t = `\(x^2 + xy + y^2 = ${k*2}\) のとき、\(x^2 + y^2\) の最大値・最小値を求めよ。`;
                m = `x^2 + xy + y^2 = ${k*2}`;
                conf = { type: 'std', a: 1, b: 0, c: 0 }; break;
        }

        inst.innerHTML = t;
        math.innerHTML = `\\[ ${m} \\]`;
        if (window.MathJax) MathJax.typesetPromise();
        this.draw(conf);
    },

    draw(conf) {
        const ctx = document.getElementById('chart').getContext('2d');
        if (this.chart) this.chart.destroy();
        let ds = [];

        if (conf.type === 'area') {
            for (let m = 0; m <= conf.range; m += conf.range/6) {
                let d = []; for (let x = -2; x <= 5; x += 0.2) d.push({x: x, y: x*x + conf.b*m*x + m});
                ds.push({ data: d, showLine: true, borderColor: `rgba(0, 242, 255, ${1 - m/conf.range})`, pointRadius: 0, borderWidth: 1 });
            }
        } else if (conf.type === 'abs') {
            let d = []; for (let x = -1; x <= 5; x += 0.1) d.push({x: x, y: Math.abs(x*x + conf.b*x)});
            ds.push({ data: d, showLine: true, borderColor: '#ff00ff', pointRadius: 0, borderWidth: 2 });
        } else {
            let d = []; for (let x = -5; x <= 8; x += 0.2) d.push({x: x, y: conf.a*x*x + (conf.b||0)*x + (conf.c||0)});
            ds.push({ data: d, showLine: true, borderColor: '#00f2ff', pointRadius: 0, borderWidth: 2 });
        }

        this.chart = new Chart(ctx, {
            type: 'scatter',
            data: { datasets: ds },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    x: { type: 'linear', position: 'center', grid: { color: '#222' } },
                    y: { type: 'linear', position: 'center', grid: { color: '#222' } }
                },
                plugins: { legend: { display: false } }
            }
        });
    }
};

// 起動時に確実にグラフを表示
window.onload = () => {
    setTimeout(() => app.generate(), 500);
};
</script>
</body>
</html>
