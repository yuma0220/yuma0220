<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>KYOTO GIGA-MAX: THE COMPLETE 13</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #000; --sidebar: #050505; --card: #0a0a0a;
            --neon-blue: #00f2ff; --neon-green: #39ff14; --neon-mag: #ff00ff;
            --text: #fff; --sub: #555; --ans: #ffcc00;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); color: var(--text); font-family: 'Consolas', 'Meiryo', monospace;
            height: 100vh; width: 100vw; overflow: hidden; display: flex; 
        }

        /* SIDEBAR: STYLISH & COMPACT */
        aside { 
            width: 260px; background: var(--sidebar); border-right: 2px solid var(--neon-blue);
            display: flex; flex-direction: column; padding: 15px; z-index: 100;
        }
        .logo h1 { font-size: 1.2rem; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); text-align: center; margin-bottom: 15px; letter-spacing: 2px; }
        .nav-scroll { flex: 1; overflow-y: auto; padding-right: 5px; }
        .cat { font-size: 0.7rem; color: var(--sub); margin: 12px 0 5px; font-weight: bold; border-left: 3px solid var(--neon-blue); padding-left: 8px; }
        .nav-btn { 
            width: 100%; padding: 10px; background: transparent; border: 1px solid #1a1a1a; 
            color: #666; text-align: left; cursor: pointer; margin-bottom: 4px; border-radius: 5px; font-size: 0.8rem;
        }
        .nav-btn:hover { border-color: var(--neon-blue); color: #fff; }
        .nav-btn.active { border-color: var(--neon-blue); background: rgba(0, 242, 255, 0.1); color: #fff; font-weight: bold; }
        .kiso-b { border-left: 4px solid var(--neon-green) !important; }
        .elite-b { border-left: 4px solid var(--neon-mag) !important; }

        /* MAIN CONTENT: ONE-SCREEN LAYOUT */
        main { flex: 1; display: flex; flex-direction: column; padding: 15px; height: 100vh; gap: 12px; }

        .problem-card { 
            background: var(--card); border: 1px solid #1a1a1a; border-radius: 12px;
            padding: 20px; display: flex; flex-direction: column; justify-content: center; min-height: 220px;
        }
        .math-display {
            display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
            font-size: 2.4rem; font-weight: bold; text-align: center; line-height: 1.3;
        }
        .sup { font-size: 0.6em; vertical-align: super; color: var(--neon-green); margin-left: 2px; }
        .inst-text { color: var(--neon-blue); font-size: 1.6rem; margin-left: 15px; font-weight: 900; text-shadow: 0 0 8px var(--neon-blue); }

        .btn-row { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; height: 50px; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; font-size: 1.1rem; text-transform: uppercase; }
        .btn-gen { background: var(--neon-blue); color: #000; }
        .btn-ans { background: #1a1a1a; color: #fff; border: 1px solid #333; }

        .ans-panel { 
            margin-top: 10px; padding: 12px; background: rgba(255, 204, 0, 0.05); 
            border: 1px dashed var(--ans); border-radius: 8px; display: none; 
            color: var(--ans); font-size: 1.2rem; text-align: center;
        }

        /* GRAPH: Fills the remaining space */
        .graph-panel { flex: 1; background: #000; border: 1px solid #111; border-radius: 12px; overflow: hidden; position: relative; }
        canvas { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>

<aside>
    <div class="logo"><h1>KYOTO GIGA CORE</h1></div>
    <div class="nav-scroll">
        <div class="cat">BASIC (基礎)</div>
        <button class="nav-btn kiso-b active" onclick="app.set('k_square', this)">01. 平方完成・頂点</button>
        <button class="nav-btn kiso-b" onclick="app.set('k_move', this)">02. 平行移動</button>
        <button class="nav-btn kiso-b" onclick="app.set('k_axis', this)">03. 三点を通る式</button>
        <button class="nav-btn kiso-b" onclick="app.set('k_maxmin', this)">04. 基本の最大最小</button>
        <button class="nav-btn kiso-b" onclick="app.set('k_ineq', this)">05. 二次不等式</button>
        <button class="nav-btn kiso-b" onclick="app.set('k_kouten', this)">06. x軸との共有点</button>
        
        <div class="cat">ELITE (応用)</div>
        <button class="nav-btn elite-b" onclick="app.set('a_maxmin', this)">07. 軸が動く最大最小</button>
        <button class="nav-btn elite-b" onclick="app.set('a_root_pos', this)">08. 解の配置</button>
        <button class="nav-btn elite-b" onclick="app.set('a_area', this)">09. 通過領域</button>
        <button class="nav-btn elite-b" onclick="app.set('a_abs', this)">10. 絶対値と共有点</button>
        <button class="nav-btn elite-b" onclick="app.set('a_int', this)">11. 整数解条件</button>
        <button class="nav-btn elite-b" onclick="app.set('a_sym', this)">12. 対称式と存在条件</button>
        <button class="nav-btn elite-b" onclick="app.set('a_tri', this)">13. 三角形への応用</button>
    </div>
</aside>

<main>
    <div class="problem-card">
        <div class="math-display" id="math-out">
            </div>
        <div class="btn-row">
            <button class="btn btn-gen" onclick="app.gen()">GENERATE PROBLEM</button>
            <button class="btn btn-ans" onclick="app.toggle()">ANALYSIS</button>
        </div>
        <div id="ans-out" class="ans-panel"></div>
    </div>
    <div class="graph-panel"><canvas id="chart"></canvas></div>
</main>

<script>
const app = {
    mode: 'k_square', chart: null,
    r: (n, m) => Math.floor(Math.random() * (m - n + 1)) + n,
    f: (n, d) => {
        let gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
        let common = gcd(n, d); n /= common; d /= common;
        if (d < 0) { n *= -1; d *= -1; }
        return d === 1 ? `${n}` : `${n}/${d}`;
    },

    set(m, btn) {
        this.mode = m;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        this.gen();
    },

    toggle() {
        const p = document.getElementById('ans-out');
        p.style.display = p.style.display === 'block' ? 'none' : 'block';
    },

    engines: {
        k_square: () => {
            let a = app.r(1, 2), b = app.r(-8, 8), c = app.r(-5, 5);
            return { q: `y = ${a==1?'':a}x<span class="sup">2</span>${b>=0?'+':''}${b}x${c>=0?'+':''}${c}`, i: "の頂点の座標を求めよ。", a: `頂点: (${app.f(-b, 2*a)}, ${app.f(4*a*c-b*b, 4*a)})`, c: {a, b, c} };
        },
        k_move: () => {
            let mx = app.r(-5, 5), my = app.r(-5, 5);
            return { q: `y = x<span class="sup">2</span> を x軸:${mx}, y軸:${my} 移動`, i: "した後の式を求めよ。", a: `y = (x ${-mx>=0?'+':''}${-mx})<span class="sup">2</span> ${my>=0?'+':''}${my}`, c: {a:1, b:-2*mx, c:mx*mx+my} };
        },
        k_ineq: () => {
            let x1 = app.r(-3, 0), x2 = x1 + app.r(2, 5);
            return { q: `x<span class="sup">2</span>${-(x1+x2)>=0?'+':''}${-(x1+x2)}x+${x1*x2} ≦ 0`, i: "の解を求めよ。", a: `${x1} ≦ x ≦ ${x2}`, c: {a:1, b:-(x1+x2), c:x1*x2} };
        },
        a_maxmin: () => {
            let c = app.r(2, 6);
            return { q: `y = x<span class="sup">2</span> - 2ax + ${c}`, i: "0 ≦ x ≦ 2 での最小値を求めよ。", a: `a<0: ${c} | 0≦a≦2: ${c}-a² | a>2: ${c+4}-4a`, c: {a:1, b:-2, c:c} };
        },
        a_root_pos: () => {
            let k = app.r(2, 6);
            return { q: `x<span class="sup">2</span> - 2ax + ${k} = 0`, i: "x > 1 で2解をもつ a の範囲を求めよ。", a: `√${k} < a < ${(k+1)/2}`, c: {a:1, b:-4, c:k} };
        },
        a_abs: () => {
            let k = app.r(1, 2);
            return { q: `y = |x<span class="sup">2</span> - 4x + 3|`, i: `y = ${k} との共有点の個数を調べよ。`, a: `${k==1?3:2} 個`, c: {a:1, b:-4, c:3, abs:true, k:k} };
        },
        a_area: () => {
            return { q: `y = 2mx - m<span class="sup">2</span> (0 ≦ m ≦ 1)`, i: "の通過領域を求めよ。", a: `境界線: y=x², y=2x-1 (図示参照)`, c: {area: true} };
        },
        k_axis: () => ({ q: "(0,1), (1,0), (2,1) を通る", i: "二次関数の式を求めよ。", a: "y = x² - 2x + 1", c: {a:1, b:-2, c:1} }),
        k_maxmin: () => ({ q: "y = x<span class="sup">2</span> - 4x + 1 (0 ≦ x ≦ 3)", i: "の最大・最小を求めよ。", a: "最大:1 (x=0), 最小:-3 (x=2)", c: {a:1, b:-4, c:1} }),
        k_kouten: () => ({ q: "y = x<span class="sup">2</span> - 4x + 3", i: "と x軸の共有点を求めよ。", a: "(1,0), (3,0)", c: {a:1, b:-4, c:3} }),
        a_int: () => ({ q: "x<span class="sup">2</span> - ax + 2 = 0", i: "が整数解をもつ a を求めよ。", a: "a = ±3", c: {a:1, b:-3, c:2} }),
        a_sym: () => ({ q: "x+y=a, xy=a+3", i: "実数x,yが存在する a の範囲を求めよ。", a: "a ≦ -2, 6 ≦ a", c: {a:1, b:-4, c:-12} }),
        a_tri: () => ({ q: "直角をはさむ2辺の和が10", i: "の三角形の最大面積を求めよ。", a: "25 (5×5/2)", c: {a:-0.5, b:5, c:0} })
    },

    gen() {
        const res = (this.engines[this.mode] || this.engines.k_square)();
        document.getElementById('math-out').innerHTML = `<span>${res.q}</span><span class="inst-text">${res.i}</span>`;
        document.getElementById('ans-out').innerHTML = `【ANALYSIS】 ${res.a}`;
        document.getElementById('ans-out').style.display = 'none';
        this.draw(res.c);
    },

    draw(cfg) {
        const ctx = document.getElementById('chart').getContext('2d');
        if (this.chart) this.chart.destroy();
        let ds = [];
        if (cfg.area) {
            for(let m=0; m<=1; m+=0.1) {
                let d = []; for(let x=-1; x<=3; x+=0.1) d.push({x, y: 2*m*x - m*m});
                ds.push({ data: d, showLine: true, borderColor: `rgba(0, 242, 255, ${1.1-m})`, borderWidth: 1, pointRadius: 0 });
            }
        } else {
            let d = []; for(let x=-8; x<=8; x+=0.1) {
                let y = (cfg.a||1)*x*x + (cfg.b||0)*x + (cfg.c||0);
                if (cfg.abs) y = Math.abs(y);
                d.push({x, y});
            }
            ds.push({ data: d, showLine: true, borderColor: '#39ff14', borderWidth: 4, pointRadius: 0 });
            if (cfg.k) ds.push({ data: [{x:-10, y:cfg.k}, {x:10, y:cfg.k}], showLine: true, borderColor: '#ff00ff', borderDash: [5,5], borderWidth: 2, pointRadius: 0 });
        }
        this.chart = new Chart(ctx, {
            type: 'scatter',
            data: { datasets: ds },
            options: {
                responsive: true, maintainAspectRatio: false, animation: false,
                scales: {
                    x: { min: -5, max: 7, position: 'center', grid: { color: '#111' }, ticks: { color: '#444' } },
                    y: { min: -4, max: 10, position: 'center', grid: { color: '#111' }, ticks: { color: '#444' } }
                },
                plugins: { legend: { display: false } }
            }
        });
    }
};
window.onload = () => app.gen();
</script>
</body>
</html>
