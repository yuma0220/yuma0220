<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二次関数嫌い</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1 class="title">📘 二次関数嫌い</h1>

<div class="layout">

  <!-- 左 -->
  <div class="left">
    <div class="card">
      <h3>名前を入力</h3>
      <input id="username" placeholder="ユーザー名">
      <button onclick="login()">開始</button>
    </div>

    <div class="card">
      <h3>操作ガイド</h3>
      <p>頂点 x = -b / 2a</p>
    </div>

    <div class="card purple">
      <h3>場合分けのヒント</h3>
      <p>a > 0 → 最小</p>
      <p>a < 0 → 最大</p>
      <p>区間 → 端と頂点比較</p>
    </div>
  </div>

  <!-- 中央 -->
  <div class="center">
    <div class="card">
      <h2 id="question"></h2>

      <div class="row">
        <input id="answer" placeholder="答えを入力">
        <button onclick="check()">答える</button>
      </div>

      <p id="result"></p>
      <p id="score">スコア:0</p>
    </div>

    <div class="card">
      <h3>二次関数のグラフ</h3>
      <canvas id="graph"></canvas>

      <p class="legend">
        🔴 頂点　🟡 y切片　🟢 x切片
      </p>
    </div>
  </div>

  <!-- 右 -->
  <div class="right">
    <div class="card">
      <h3>分析（弱点）</h3>
      <p id="status"></p>
      <canvas id="weakChart" width="250" height="200"></canvas>
      <button onclick="weakMode()">弱点特訓モード</button>
    </div>

    <div class="card">
      <h3>履歴（最新10件）</h3>
      <ul id="historyList"></ul>
    </div>

    <div class="card">
      <h3>データ管理</h3>
      <button onclick="downloadBackup()">データを保存（バックアップ）</button>
      <input type="file" onchange="loadBackup(event)">
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
