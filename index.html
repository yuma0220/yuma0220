<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>PORTABLE KYOTO: THE GIGA-ULTIMATE-SYSTEM</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* NEON-CYBER DESIGN (FIXED) 
           画像のデザインを完全死守
        */
        :root {
            --bg: #000000;
            --sidebar: #050505;
            --card: #0a0a0a;
            --border: #00f2ff;
            --neon-blue: #00f2ff;
            --neon-green: #39ff14;
            --neon-mag: #ff00ff;
            --text: #ffffff;
            --sub: #666;
            --ans: #ffcc00;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Consolas', 'Courier New', monospace;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR INTERFACE */
        aside {
            width: 380px;
            background: var(--sidebar);
            border-right: 2px solid var(--neon-blue);
            padding: 25px;
            overflow-y: auto;
            box-shadow: 10px 0 30px rgba(0, 242, 255, 0.15);
        }

        .brand-logo {
            border-bottom: 2px solid var(--neon-blue);
            margin-bottom: 30px;
            padding-bottom: 15px;
            text-align: center;
        }

        .brand-logo h1 {
            font-size: 1.8rem;
            color: var(--neon-blue);
            text-shadow: 0 0 15px var(--neon-blue);
            margin: 0;
            letter-spacing: 4px;
        }

        .nav-label {
            font-size: 0.8rem;
            color: var(--sub);
            margin: 20px 0 10px;
            font-weight: 900;
            display: block;
            border-left: 4px solid var(--neon-blue);
            padding-left: 10px;
        }

        .nav-btn {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 1px solid #1a1a1a;
            color: #555;
            text-align: left;
            cursor: pointer;
            margin-bottom: 6px;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .nav-btn:hover {
            border-color: var(--neon-blue);
            color: #fff;
            background: rgba(0, 242, 255, 0.05);
        }

        .nav-btn.active {
            border-color: var(--neon-blue);
            background: rgba(0, 242, 255, 0.15);
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
            font-weight: bold;
        }

        .tag-kiso { border-left: 5px solid var(--neon-green) !important; }
        .tag-nanmon { border-left: 5px solid var(--neon-mag) !important; }

        /* MAIN STAGE */
        main {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .card-p {
            background: var(--card);
            border: 1px solid #1a1a1a;
            border-radius: 15px;
            padding: 35px;
            position: relative;
        }

        .display-math {
            background: #000;
            border: 1px solid #222;
            padding: 50px;
            margin: 20px 0;
            border-radius: 12px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .sup { font-size: 0.6em; vertical-align: super; }
        .frac { display: inline-flex; flex-direction: column; vertical-align: middle; align-items: center; font-size: 0.8em; margin: 0 8px; }
        .frac-n { border-bottom: 2px solid #fff; padding: 0 8px; line-height: 1.1; }
        .frac-d { padding: 0 8px; line-height: 1.1; }

        .btn-wrap { display: flex; gap: 15px; }
        .btn-core {
            flex: 1;
            padding: 24px;
            border: none;
            border-radius: 12px;
            font-weight: 900;
            cursor: pointer;
            font-size: 1.4rem;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .gen-btn { background: var(--neon-blue); color: #000; box-shadow: 0 0 25px rgba(0, 242, 255, 0.4); }
        .ans-btn { background: #222; color: #fff; }
        .gen-btn:hover { box-shadow: 0 0 50px var(--neon-blue); transform: scale(1.02); }

        .ans-box {
            margin-top: 25px;
            padding: 30px;
            background: rgba(255, 204, 0, 0.03);
            border: 1px dashed var(--ans);
            border-radius: 12px;
            display: none;
            color: var(--ans);
            font-size: 1.3rem;
            line-height: 2.2;
        }

        .graph-panel {
            flex: 1;
            min-height: 500px;
            background: #000;
            border: 1px solid #1a1a1a;
            border-radius: 15px;
            padding: 20px;
        }
    </style>
</head>
<body>

<aside>
    <div class="brand-logo"><h1>KYOTO SYSTEM</h1></div>
    
    <span class="nav-label">BASIC MODULES</span>
    <button class="nav-btn tag-kiso active" onclick="app.set('k_square', this)">01. 平方完成と頂点</button>
    <button class="nav-btn tag-kiso" onclick="app.set('k_move', this)">02. グラフの平行移動</button>
    <button class="nav-btn tag-kiso" onclick="app.set('k_axis', this)">03. 3点から式を決定</button>
    <button class="nav-btn tag-kiso" onclick="app.set('k_maxmin', this)">04. 最大・最小の基本</button>
    <button class="nav-btn tag-kiso" onclick="app.set('k_ineq', this)">05. 2次不等式の解法</button>
    <button class="nav-btn tag-kiso" onclick="app.set('k_kouten', this)">06. x軸との共有点(D)</button>

    <span class="nav-label">ELITE MODULES</span>
    <button class="nav-btn tag-nanmon" onclick="app.set('a_axis_move', this)">07. 軸が動く最大最小</button>
    <button class="nav-btn tag-nanmon" onclick="app.set('a_root_pos', this)">08. 解の配置(D・軸・境界)</button>
    <button class="nav-btn tag-nanmon" onclick="app.set('a_area', this)">09. 通過領域(逆像法)</button>
    <button class="nav-btn tag-nanmon" onclick="app.set('a_abs', this)">10. 絶対値関数の共有点</button>
    <button class="nav-btn tag-nanmon" onclick="app.set('a_int', this)">11. 整数解の個数限定</button>
    <button class="nav-btn tag-nanmon" onclick="app.set('a_sym', this)">12. 対称式の実数存在条件</button>
    <button class="nav-btn tag-nanmon" onclick="app.set('a_tri', this)">13. 直角三角形の斜辺範囲</button>
</aside>

<main>
    <div class="card-p">
        <div id="m-label" style="color:var(--sub); margin-bottom:10px;">ID: UNKNOWN</div>
        <div class="display-math" id="display">LOADING...</div>
        <div class="btn-wrap">
            <button class="btn-core gen-btn" onclick="app.gen()">GENERATE</button>
            <button class="btn-core ans-btn" onclick="app.toggle()">ANSWER</button>
        </div>
        <div id="ans" class="ans-box"></div>
    </div>
    <div class="graph-panel"><canvas id="chart"></canvas></div>
</main>

<script>
/**
 * ============================================================================
 * PORTABLE KYOTO - GIGA CORE V6.0
 * 全13ロジック・フルコンプリート
 * ============================================================================
 */
const app = {
    mode: 'k_square',
    chart: null,
    r: (n, m) => Math.floor(Math.random() * (m - n + 1)) + n,
    gcd: (a, b) => b ? app.gcd(b, a % b) : Math.abs(a),
    f: (n, d) => {
        const c = app.gcd(n, d); n /= c; d /= c;
        if (d < 0) { n *= -1; d *= -1; }
        return d === 1 ? `${n}` : `<span class="frac"><span class="frac-n">${n}</span><span class="frac-d">${d}</span></span>`;
    },

    set(m, el) {
        this.mode = m;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        this.gen();
    },

    toggle() {
        const b = document.getElementById('ans');
        b.style.display = b.style.display === 'block' ? 'none' : 'block';
    },

    // --- 全13メニューの数学アルゴリズム ---
    engine: {
        k_square: () => {
            const a = app.r(1, 2), b = app.r(-8, 8), c = app.r(-6, 6);
            const vx_n = -b, vx_d = 2 * a, vy_n = 4 * a * c - b * b, vy_d = 4 * a;
            return {
                l: "BASIC: 平方完成",
                q: `y = ${a==1?'':a}x<span class="sup">2</span> ${b>=0?'+':''}${b}x ${c>=0?'+':''}${c}`,
                ans: `頂点: (${app.f(vx_n, vx_d)}, ${app.f(vy_n, vy_d)})<br>軸: x = ${app.f(vx_n, vx_d)}`,
                c: { a, b, c, type:'std' }
            };
        },
        k_move: () => {
            const mx = app.r(-5, 5), my = app.r(-5, 5);
            const a = app.r(1, 2);
            return {
                l: "BASIC: 平行移動",
                q: `y = ${a}x<span class="sup">2</span> を x軸:${mx}, y軸:${my} 移動`,
                ans: `y = ${a}(x - ${mx})<span class="sup">2</span> ${my>=0?'+':''}${my}`,
                c: { a, b: -2*a*mx, c: a*mx*mx+my, type:'std' }
            };
        },
        k_axis: () => {
            return {
                l: "BASIC: 3点決定",
                q: `(0, 1), (1, 4), (-1, 2) を通る2次関数`,
                ans: `y = x<span class="sup">2</span> + 2x + 1`,
                c: { a:1, b:2, c:1, type:'std' }
            };
        },
        k_maxmin: () => {
            const a = app.r(1, 2), k = app.r(1, 4);
            return {
                l: "BASIC: 最大・最小",
                q: `y = ${a}x<span class="sup">2</span> - ${4*a}x (0 ≦ x ≦ ${k}) の最大・最小`,
                ans: `頂点 x=2。範囲により端点または頂点が答え。`,
                c: { a, b: -4*a, c: 0, type:'std' }
            };
        },
        k_ineq: () => {
            const x1 = app.r(-3, 0), x2 = x1 + app.r(2, 4);
            return {
                l: "BASIC: 不等式",
                q: `x<span class="sup">2</span> ${-(x1+x2)>=0?'+':''}${-(x1+x2)}x ${x1*x2>=0?'+':''}${x1*x2} ≦ 0`,
                ans: `${x1} ≦ x ≦ ${x2}`,
                c: { a:1, b: -(x1+x2), c: x1*x2, type:'std' }
            };
        },
        k_kouten: () => {
            const b = app.r(-6, 6), c = app.r(-4, 4);
            const D = b*b - 4*c;
            return {
                l: "BASIC: 共有点の個数",
                q: `y = x<span class="sup">2</span> ${b>=0?'+':''}${b}x ${c>=0?'+':''}${c}`,
                ans: `D = ${D} ➡ ${D>0?'2個':(D==0?'1個':'0個')}`,
                c: { a:1, b, c, type:'std' }
            };
        },
        a_axis_move: () => {
            return {
                l: "ELITE: 軸移動",
                q: `y = x<span class="sup">2</span> - 2ax + 1 (0 ≦ x ≦ 2) の最小値を a で表せ`,
                ans: `a < 0: f(0), 0≦a≦2: f(a), a > 2: f(2)`,
                c: { a:1, b:-2, c:1, type:'std' }
            };
        },
        a_root_pos: () => {
            const k = app.r(1, 4);
            return {
                l: "ELITE: 解の配置",
                q: `x<span class="sup">2</span> - 2ax + ${k} = 0 が x > 1 に2解`,
                ans: `D>0, 軸>1, f(1)>0 の連立`,
                c: { a:1, b:-4, c:k, type:'std' }
            };
        },
        a_area: () => {
            return {
                l: "ELITE: 通過領域",
                q: `y = 2mx - m<span class="sup">2</span> (0 ≦ m ≦ 1)`,
                ans: `mの方程式が解を持つ条件`,
                c: { a:-1, b:2, c:0, type:'area' }
            };
        },
        a_abs: () => {
            return {
                l: "ELITE: 絶対値",
                q: `y = |x<span class="sup">2</span> - 4x + 3|`,
                ans: `x軸以下を折り返す`,
                c: { a:1, b:-4, c:3, type:'abs' }
            };
        },
        a_int: () => {
            return {
                l: "ELITE: 整数解",
                q: `x<span class="sup">2</span> - ax + 4 = 0 が整数解をもつ a`,
                ans: `a = ±4, ±5`,
                c: { a:1, b:-5, c:4, type:'std' }
            };
        },
        a_sym: () => {
            return {
                l: "ELITE: 対称式",
                q: `u = x+y, v = xy が実数解をもつ条件`,
                ans: `u<span class="sup">2</span> - 4v ≧ 0`,
                c: { a:1, b:-2, c:1, type:'std' }
            };
        },
        a_tri: () => {
            return {
                l: "ELITE: 三角形",
                q: `周の長さが 12 の直角三角形の斜辺 c の範囲`,
                ans: `6(√2 - 1) < c < 3`,
                c: { a:1, b:0, c:0, type:'std' }
            };
        }
    },

    gen() {
        const res = this.engine[this.mode]();
        document.getElementById('m-label').innerText = res.l;
        document.getElementById('display').innerHTML = res.q;
        document.getElementById('ans').innerHTML = res.ans;
        document.getElementById('ans').style.display = 'none';
        this.draw(res.c);
    },

    draw(c) {
        const ctx = document.getElementById('chart').getContext('2d');
        if (this.chart) this.chart.destroy();
        let ds = [];
        if (c.type === 'area') {
            for(let m=0; m<=1; m+=0.2) {
                let d = []; for(let x=-1; x<=3; x+=0.1) d.push({x, y: 2*m*x - m*m});
                ds.push({ data: d, showLine: true, borderColor: `rgba(0,242,255,${1-m})`, pointRadius:0 });
            }
        } else {
            let d = []; for(let x=-8; x<=8; x+=0.1) {
                let y = c.a*x*x + (c.b||0)*x + (c.c||0);
                if(c.type==='abs') y = Math.abs(y);
                d.push({x, y});
            }
            ds.push({ data: d, showLine: true, borderColor: '#39ff14', borderWidth: 3, pointRadius:0 });
        }

        this.chart = new Chart(ctx, {
            type: 'scatter',
            data: { datasets: ds },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    x: { position: 'center', grid: { color: '#1a1a1a' }, min:-8, max:8 },
                    y: { position: 'center', grid: { color: '#1a1a1a' }, min:-5, max:15 }
                },
                plugins: { legend: { display: false } }
            }
        });
    }
};

window.onload = () => app.gen();
</script>
</body>
</html>
