<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>KYOTO GIGA-MAX UI</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #000; --card: #080808;
            --neon-blue: #00f2ff; --neon-green: #39ff14; --neon-mag: #ff00ff;
            --text: #fff; --ans: #ffcc00;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); color: var(--text); font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', sans-serif;
            height: 100vh; width: 100vw; overflow: hidden; display: flex; 
        }

        /* サイドバー：細くしてメインを広く */
        aside { 
            width: 220px; background: #050505; border-right: 2px solid var(--neon-blue);
            display: flex; flex-direction: column; padding: 10px;
        }
        .nav-btn { 
            width: 100%; padding: 8px; background: transparent; border: 1px solid #222; 
            color: #666; text-align: left; cursor: pointer; margin-bottom: 4px; border-radius: 4px; font-size: 0.75rem;
        }
        .nav-btn.active { border-color: var(--neon-blue); background: rgba(0, 242, 255, 0.1); color: #fff; font-weight: bold; }

        /* メインエリア：一画面に凝縮 */
        main { 
            flex: 1; display: flex; flex-direction: column; padding: 10px; gap: 8px; height: 100vh;
        }

        /* 問題エリア：文字を巨大化 */
        .p-card { 
            height: 35%; background: var(--card); border: 1px solid #222; border-radius: 12px;
            display: flex; flex-direction: column; padding: 15px; justify-content: space-around;
        }
        .math-row {
            display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
            font-size: 3.5rem; font-weight: bold; text-align: center; line-height: 1.2;
        }
        .instruction { 
            color: var(--neon-blue); font-size: 2.2rem; margin-left: 20px; 
            text-shadow: 0 0 10px var(--neon-blue);
        }
        .sup { font-size: 0.5em; vertical-align: super; color: var(--neon-green); }

        .btn-row { display: flex; gap: 10px; height: 50px; }
        .btn { flex: 1; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; font-size: 1.2rem; }
        .gen { background: var(--neon-blue); color: #000; }
        .ans-btn { background: #222; color: #fff; }

        .ans-area { 
            height: 60px; padding: 10px; background: rgba(255, 204, 0, 0.05); 
            border: 1px dashed var(--ans); border-radius: 8px; display: none; 
            color: var(--ans); font-size: 1.5rem; text-align: center;
        }

        /* グラフ：最大化 */
        .graph-area { 
            flex: 1; background: #000; border: 1px solid #222; border-radius: 12px;
            position: relative; overflow: hidden;
        }
        canvas { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>

<aside>
    <div style="color:var(--neon-blue); font-weight:bold; margin-bottom:10px; text-align:center;">KYOTO CORE</div>
    <button class="nav-btn active" onclick="app.set('a_root_pos', this)">08. 解の配置 (難問)</button>
    <button class="nav-btn" onclick="app.set('a_axis_move', this)">07. 軸移動 (難問)</button>
    <button class="nav-btn" onclick="app.set('a_abs', this)">10. 絶対値 (応用)</button>
    <button class="nav-btn" onclick="app.set('k_square', this)">01. 平方完成 (基礎)</button>
    <button class="nav-btn" onclick="app.set('k_maxmin', this)">04. 最大最小 (基礎)</button>
</aside>

<main>
    <div class="p-card">
        <div class="math-row" id="display">
            </div>
        <div class="btn-row">
            <button class="btn gen" onclick="app.gen()">NEXT MISSION</button>
            <button class="btn ans-btn" onclick="app.toggle()">CHECK ANALYSIS</button>
        </div>
        <div id="ans" class="ans-area"></div>
    </div>
    <div class="graph-area">
        <canvas id="chart"></canvas>
    </div>
</main>

<script>
const app = {
    mode: 'a_root_pos', chart: null,
    r: (n, m) => Math.floor(Math.random() * (m - n + 1)) + n,

    set(m, el) {
        this.mode = m;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        this.gen();
    },

    toggle() {
        const b = document.getElementById('ans');
        b.style.display = b.style.display === 'block' ? 'none' : 'block';
    },

    engines: {
        a_root_pos: () => {
            const k = app.r(2, 6);
            return {
                q: `x<span class="sup">2</span>-2ax+${k}=0`,
                inst: "x>1 で異なる2解をもつ a を求めよ",
                ans: `判別式 a²-${k}>0 , 軸 a>1 , f(1)=${k+1}-2a>0 より √${k} < a < ${(k+1)/2}`,
                c: { a:1, b:-4, c:k, type:'std' }
            };
        },
        a_axis_move: () => {
            const a = app.r(1, 2);
            return {
                q: `y = x<span class="sup">2</span>-2ax+4`,
                inst: "0≦x≦2 での最小値を求めよ",
                ans: `a<0のとき4, 0≦a≦2のとき4-a², a>2のとき8-4a`,
                c: { a:1, b:-2, c:4, type:'std' }
            };
        },
        a_abs: () => {
            const k = app.r(1, 2);
            return {
                q: `y = |x<span class="sup">2</span>-4x+3|`,
                inst: `y=${k} との共有点の個数を調べよ`,
                ans: `k=${k} のとき、共有点は ${k==1?3:2} 個`,
                c: { a:1, b:-4, c:3, type:'abs', k_val: k }
            };
        }
    },

    gen() {
        const eng = this.engines[this.mode] || this.engines.a_root_pos;
        const res = eng();
        document.getElementById('display').innerHTML = `<div>${res.q}</div><div class="instruction">${res.inst}</div>`;
        document.getElementById('ans').innerHTML = res.ans;
        document.getElementById('ans').style.display = 'none';
        this.draw(res.c);
    },

    draw(c) {
        const ctx = document.getElementById('chart').getContext('2d');
        if (this.chart) this.chart.destroy();
        let ds = [];
        let d = []; for(let x=-5; x<=7; x+=0.1) {
            let y = c.a*x*x + (c.b||0)*x + (c.c||0);
            if (c.type === 'abs') y = Math.abs(y);
            d.push({x, y});
        }
        ds.push({ data: d, showLine: true, borderColor: '#39ff14', borderWidth: 5, pointRadius: 0 });
        if (c.k_val) ds.push({ data: [{x:-10, y:c.k_val}, {x:10, y:c.k_val}], showLine: true, borderColor: '#ff00ff', borderDash: [10,10], borderWidth: 3, pointRadius: 0 });

        this.chart = new Chart(ctx, {
            type: 'scatter',
            data: { datasets: ds },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    x: { min: -4, max: 6, position: 'center', grid: { color: '#222' }, ticks: { color: '#555', font: {size: 14} } },
                    y: { min: -4, max: 10, position: 'center', grid: { color: '#222' }, ticks: { color: '#555', font: {size: 14} } }
                },
                plugins: { legend: { display: false } }
            }
        });
    }
};
window.onload = () => app.gen();
</script>
</body>
</html>
