<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>二次関数：究極解析 System v4.0</title>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$']] }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #09090b; --panel: #18181b; --accent: #7c3aed; --text: #f4f4f5; --border: #27272a; }
        body { background: var(--bg); color: var(--text); font-family: 'Hiragino Kaku Gothic ProN', sans-serif; margin: 0; display: flex; height: 100vh; }
        
        aside { width: 350px; background: var(--panel); border-right: 1px solid var(--border); padding: 30px; display: flex; flex-direction: column; gap: 10px; }
        .nav-h { font-size: 0.75rem; color: #a1a1aa; letter-spacing: 1px; margin-top: 20px; text-transform: uppercase; }
        .q-btn { width: 100%; text-align: left; padding: 15px; background: #27272a; border: 1px solid transparent; color: #d4d4d8; cursor: pointer; border-radius: 8px; transition: 0.2s; font-size: 0.9rem; }
        .q-btn:hover { background: #3f3f46; border-color: var(--accent); }
        .q-btn.active { background: var(--accent); color: white; font-weight: bold; }

        main { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 25px; }
        .card { background: var(--panel); border-radius: 12px; padding: 30px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .instr-box { font-size: 1.2rem; line-height: 1.7; border-left: 4px solid var(--accent); padding-left: 20px; color: #fafafa; }
        .formula-display { font-size: 2.2rem; text-align: center; margin: 25px 0; padding: 30px; background: #000; border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; }
        
        .ai-analysis { background: #0c0a09; border-radius: 12px; padding: 30px; display: none; border: 1px solid #444; line-height: 2; }
        .step-h { color: var(--accent); font-weight: bold; font-size: 1.1rem; border-bottom: 1px solid #27272a; margin-bottom: 15px; display: block; }
        
        .chart-wrap { height: 450px; background: #000; border-radius: 12px; border: 1px solid var(--border); padding: 15px; }
        .action-row { display: flex; gap: 15px; }
        .btn { flex: 1; padding: 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; border: none; transition: 0.2s; }
        .btn-p { background: var(--accent); color: white; }
        .btn-s { background: #3f3f46; color: white; }
    </style>
</head>
<body>

<aside>
    <h2 style="margin:0 0 20px; color:var(--accent);">Quadratic AI Engine</h2>
    
    <div class="nav-h">画像認識・再現（最大最小）</div>
    <button class="q-btn active" onclick="app.select('case-a', this)">軸が動く場合分け（5パターン）</button>
    <button class="nav-h">Focus Gold 入試標準〜発展</button>
    <button class="q-btn" onclick="app.select('abs-graph', this)">絶対値関数の折れ曲がり</button>
    <button class="q-btn" onclick="app.select('p-logic', this)">主役の交代（全称命題 p）</button>
    <button class="q-btn" onclick="app.select('trace-area', this)">放物線の通過領域</button>
</aside>

<main>
    <div class="card">
        <div id="q-instr" class="instr-box">解析中...</div>
        <div id="q-formula" class="formula-display"></div>
        <div class="action-row">
            <button class="btn btn-p" onclick="app.toggleExpl()">AI詳細解説・場合分けグラフ</button>
            <button class="btn btn-s" onclick="app.reload()">類題・数値を変更</button>
        </div>
    </div>
    
    <div id="expl" class="ai-analysis"></div>
    <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
</main>

<script>
const app = {
    mode: 'case-a',
    chart: null,
    current: null,

    select(m, b) {
        this.mode = m;
        document.querySelectorAll('.q-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        this.reload();
    },

    // AI類題生成ロジック
    reload() {
        const explEl = document.getElementById('expl');
        explEl.style.display = 'none';
        let d = {};

        if (this.mode === 'case-a') {
            // 画像にあった「最大・最小の場合分け」を完全シミュレート
            const a = Math.floor(Math.random() * 3) + 1; // 係数 a
            d = {
                instr: `関数 $f(x) = x^2 - 2ax + a^2 + 1$ の $0 \\le x \\le 2$ における最小値 $m(a)$ を、$a$ の値で場合分けして求めよ。`,
                formula: `f(x) = (x - a)^2 + 1 \\quad (0 \\le x \\le 2)`,
                expl: `
                    <span class="step-h">AI思考プロセス：軸の位置による分類</span>
                    
                    軸 $x=a$ が定義域 $0 \\le x \\le 2$ に対してどこにあるかを考えます。<br>
                    1. **軸が左側 ($a < 0$)**: 左端 $x=0$ で最小。 $m(a) = f(0) = a^2+1$<br>
                    2. **軸が内部 ($0 \\le a \\le 2$)**: 頂点 $x=a$ で最小。 $m(a) = f(a) = 1$<br>
                    3. **軸が右側 ($a > 2$)**: 右端 $x=2$ で最小。 $m(a) = f(2) = (2-a)^2+1$<br>
                    <span class="step-h">ポイント</span> 最大値の場合は、定義域の中央 ($x=1$) と軸の比較になるため、場合分けの境界が変わることに注意せよ。`,
                graph: { a: 1.5, type: 'anim' }
            };
        } else if (this.mode === 'abs-graph') {
            const k = Math.floor(Math.random() * 4) + 1;
            d = {
                instr: `関数 $f(x) = |x^2 - ${k}|$ のグラフを描き、直線 $y=m$ との共有点が4個になるような $m$ の範囲を求めよ。`,
                formula: `y = |x^2 - ${k}|`,
                expl: `
                    <span class="step-h">AIグラフ解析</span>
                    1. $y = x^2 - ${k}$ を描き、負の部分（$x$ 軸より下）を上に折り返します。<br>
                    2. 頂点は $(0, 0)$ から $(0, ${k})$ に移動します。<br>
                    3. 共有点が4個になるのは、$x$ 軸 ($y=0$) と折り返した頂点 ($y=${k}$) の間のときです。`,
                graph: { a: 1, b: 0, c: -k, abs: true }
            };
        } else if (this.mode === 'p-logic') {
            d = {
                instr: `すべての実数 $p$ に対して $x^2 - 2px + 2p^2 - 2 > 0$ が成り立つような $x$ の範囲を求めよ。`,
                formula: `x^2 - 2px + 2p^2 - 2 > 0`,
                expl: `
                    <span class="step-h">主役の入れ替え戦略</span>
                    $p$ を変数と見なし、$g(p) = 2p^2 - 2xp + (x^2 - 2) > 0$ と整理します。<br>
                    これがすべての $p$ で成り立つためには、$p$ の2次関数の判別式 $D < 0$ となれば良い。`,
                graph: { a: 2, b: -2, c: -1 } // pを横軸にした場合の挙動
            };
        } else if (this.mode === 'trace-area') {
            d = {
                instr: `放物線 $y = x^2 - 2mx + m$ が、実数 $m$ のすべての値に対して通過する領域を求めよ。`,
                formula: `m^2 - (2x+1)m + (x^2-y) = 0`,
                expl: `<span class="step-h">逆像法による境界線の抽出</span> $m$ についての方程式が実数解を持つ条件 $D \ge 0$ から境界線を求めます。`,
                graph: { type: 'area' }
            };
        }

        this.current = d;
        this.updateUI();
    },

    updateUI() {
        document.getElementById('q-instr').innerHTML = this.current.instr;
        document.getElementById('q-formula').innerHTML = "\\[ " + this.current.formula + " \\]";
        if (window.MathJax) MathJax.typesetPromise();
        this.draw();
    },

    toggleExpl() {
        const el = document.getElementById('expl');
        if (el.style.display === 'none') {
            el.innerHTML = `<h3 style="color:var(--accent); margin:0 0 15px;">🔍 AI 論理解析レポート</h3>` + this.current.expl;
            el.style.display = 'block';
            if (window.MathJax) MathJax.typesetPromise([el]);
        } else {
            el.style.display = 'none';
        }
    },

    draw() {
        const ctx = document.getElementById('mainChart').getContext('2d');
        if (this.chart) this.chart.destroy();
        const g = this.current.graph;
        let ds = [];

        if (g.abs) {
            let pts = [];
            for(let x=-4; x<=4; x+=0.05) pts.push({x, y: Math.abs(x*x + g.c)});
            ds.push({data: pts, showLine: true, borderColor: '#7c3aed', borderWidth: 3, pointRadius: 0});
        } else if (this.mode === 'case-a') {
            // 軸が動く様子を視覚化（定義域を強調）
            let pts = [];
            for(let x=-2; x<=4; x+=0.1) pts.push({x, y: Math.pow(x-1.5, 2) + 1});
            ds.push({label:'Curve', data: pts, showLine: true, borderColor: '#7c3aed', borderWidth: 3, pointRadius: 0});
            // 定義域の枠
            ds.push({label:'Domain', data: [{x:0, y:-10}, {x:0, y:20}], showLine: true, borderColor: '#ef4444', borderDash:[5,5], pointRadius:0});
            ds.push({label:'Domain', data: [{x:2, y:-10}, {x:2, y:20}], showLine: true, borderColor: '#ef4444', borderDash:[5,5], pointRadius:0});
        } else {
            let pts = [];
            for(let x=-5; x<=5; x+=0.1) pts.push({x, y: x*x});
            ds.push({data: pts, showLine: true, borderColor: '#fff', borderWidth: 2, pointRadius: 0});
        }

        this.chart = new Chart(ctx, {
            type: 'scatter',
            data: { datasets: ds },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    x: { min: -3, max: 5, grid: { color: '#27272a' } },
                    y: { min: -1, max: 10, grid: { color: '#27272a' } }
                },
                plugins: { legend: { display: false } }
            }
        });
    }
};

window.addEventListener('DOMContentLoaded', () => app.reload());
</script>
</body>
</html>
