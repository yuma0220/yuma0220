<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GIGA CORE 3M: STEALTH [GOD MODE]</title>
    <style>
        :root { --bg: #f8f9fa; --side: #ffffff; --accent: #007aff; --text: #1d1d1f; --grid: #e5e5e7; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; height: 100vh; display: flex; overflow: hidden; }
        aside { width: 240px; background: var(--side); border-right: 1px solid var(--grid); display: flex; flex-direction: column; padding: 20px; }
        .nav-scroll { flex: 1; overflow-y: auto; }
        .cat { font-size: 0.7rem; color: #888; margin: 15px 0 5px; font-weight: 700; letter-spacing: 1px; }
        .nav-btn { width: 100%; padding: 10px; background: none; border: none; color: #555; text-align: left; cursor: pointer; border-radius: 8px; font-size: 0.8rem; transition: 0.2s; }
        .nav-btn:hover { background: #f0f0f2; }
        .nav-btn.active { background: var(--accent); color: #fff; font-weight: bold; }
        main { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 20px; }
        .p-card { background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 4px 24px rgba(0,0,0,0.04); height: 40%; display: flex; flex-direction: column; justify-content: center; position: relative; }
        .math-row { font-size: 2rem; font-weight: 700; text-align: center; margin-bottom: 10px; }
        .inst-row { font-size: 1.1rem; color: var(--accent); text-align: center; font-weight: 600; }
        .btn-row { display: flex; gap: 10px; margin-top: 25px; }
        .btn { flex: 1; height: 44px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-gen { background: var(--accent); color: #fff; }
        .btn-gen:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-ans { background: #f2f2f7; color: #555; }
        .ans-box { margin-top: 15px; padding: 15px; background: #fff9e6; border-radius: 10px; color: #8a6d3b; display: none; font-size: 0.9rem; border: 1px solid #fbeed5; }
        .graph-box { flex: 1; background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.04); overflow: hidden; position: relative; }
        canvas { width: 100%; height: 100%; }
    </style>
</head>
<body>
<aside>
    <div style="font-weight:900; margin-bottom:20px; font-size:1.1rem; color:var(--accent)">GIGA CORE 3M</div>
    <div class="nav-scroll">
        <div class="cat">BASIC/ABYSS</div>
        <button class="nav-btn active" onclick="app.set('t1', this)">文字平方完成</button>
        <button class="nav-btn" onclick="app.set('t2', this)">区間動最大最小</button>
        <button class="nav-btn" onclick="app.set('t3', this)">4次関数帰着</button>
        <button class="nav-btn" onclick="app.set('t4', this)">解の配置(多重)</button>
        <div class="cat">OVERLORD</div>
        <button class="nav-btn" onclick="app.set('t5', this)">通過領域</button>
        <button class="nav-btn" onclick="app.set('t6', this)">絶対値迷宮</button>
        <div class="cat">DIVINE</div>
        <button class="nav-btn" onclick="app.set('t7', this)">格子点計数</button>
        <button class="nav-btn" onclick="app.set('t8', this)">1/6公式求積</button>
        <button class="nav-btn" onclick="app.set('t9', this)">頂点軌跡</button>
        <button class="nav-btn" onclick="app.set('t10', this)">共通接線</button>
    </div>
</aside>
<main>
    <div class="p-card">
        <div id="q-m" class="math-row"></div>
        <div id="q-i" class="inst-row"></div>
        <div class="btn-row">
            <button class="btn btn-gen" onclick="app.gen()">GENERATE</button>
            <button class="btn btn-ans" onclick="app.toggle()">ANALYSIS</button>
        </div>
        <div id="ans" class="ans-box"></div>
    </div>
    <div class="graph-box"><canvas id="cvs"></canvas></div>
</main>
<script>
const app = {
    mode: 't1',
    set(m, el) {
        this.mode = m;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        this.gen();
    },
    toggle() { const b = document.getElementById('ans'); b.style.display = (b.style.display==='block')?'none':'block'; },
    engines: {
        t1: () => ({ q: "y = x² - 2ax + a² + 3a", i: "頂点の座標を a で表せ。", a: "(a, 3a)", c: {a:1, b:-2, c:1} }),
        t2: () => ({ q: "y = x² - 4ax (0 ≦ x ≦ 2)", i: "最大値 M(a) を求めよ。", a: "a<1/2:f(2), a≧1/2:f(0)", c: {a:1, b:-2, c:0} }),
        t3: () => ({ q: "y = (x²-2x)² + 2(x²-2x) - 1", i: "最小値を求めよ。", a: "-2", c: {type:'f'} }),
        t4: () => ({ q: "x² - (a+1)x + a = 0", i: "-2<x<0に解を持つaの範囲？", a: "f(-2)f(0)<0 等を確認", c: {a:1} }),
        t5: () => ({ q: "y = 2tx - t² (0 ≦ t ≦ 1)", i: "通過領域を求めよ。", a: "x∈[0,1]で y≦x² など", c: {type:'e'} }),
        t6: () => ({ q: "y = | |x²-4| - 1 |", i: "共有点6個のkの範囲は？", a: "0 < k < 1", c: {type:'ab'} }),
        t7: () => ({ q: "y ≧ x², y ≦ x+2", i: "領域内の格子点個数は？", a: "9個", c: {type:'l'} }),
        t8: () => ({ q: "y = x², y = kx (S = 4/3)", i: "正の定数 k を求めよ。", a: "k=2", c: {type:'s'} }),
        t9: () => ({ q: "y = x² - 2ax + a² + a", i: "頂点の軌跡を求めよ。", a: "y = x", c: {type:'t'} }),
        t10: () => ({ q: "y = x², y = -(x-2)²", i: "共通接線を求めよ。", a: "y=x-1/4, y=3x-9/4", c: {type:'c'} })
    },
    gen() {
        const r = this.engines[this.mode]();
        document.getElementById('q-m').innerText = r.q;
        document.getElementById('q-i').innerText = r.i;
        document.getElementById('ans').innerText = `[LOGIC] ${r.a}`;
        document.getElementById('ans').style.display = 'none';
        this.draw(r.c);
    },
    draw(c) {
        const cvs = document.getElementById('cvs');
        const ctx = cvs.getContext('2d');
        const w = cvs.width = cvs.offsetWidth, h = cvs.height = cvs.offsetHeight;
        const s = 40, ox = w/2, oy = h/2 + 40;
        ctx.strokeStyle = '#f0f0f2'; ctx.lineWidth = 1;
        for(let i=-20; i<=20; i++){
            ctx.beginPath(); ctx.moveTo(ox+i*s, 0); ctx.lineTo(ox+i*s, h); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, oy-i*s); ctx.lineTo(w, oy-i*s); ctx.stroke();
        }
        ctx.strokeStyle = '#d1d1d6'; ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(w, oy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, h); ctx.stroke();
        ctx.strokeStyle = '#007aff'; ctx.lineWidth = 3; ctx.beginPath();
        for(let p=0; p<w; p++){
            let x = (p-ox)/s, y = 0;
            if(c.type==='f') y = Math.pow(x*x-2*x,2)+2*(x*x-2*x)-1;
            else if(c.type==='ab') y = Math.abs(Math.abs(x*x-4)-1);
            else if(c.type==='e') y = (x>=0&&x<=1)?x*x:(x>1?2*x-1:-10);
            else if(c.type==='t') { ctx.strokeStyle='#ff3b30'; y=x; }
            else if(c.type==='c') { ctx.strokeStyle='#ff3b30'; y=x*x; ctx.stroke(); ctx.beginPath(); y=-Math.pow(x-2,2); }
            else y = (c.a||1)*x*x+(c.b||0)*x+(c.c||0);
            let py = oy - y*s; if(p===0) ctx.moveTo(p,py); else ctx.lineTo(p,py);
        }
        ctx.stroke();
        if(c.type==='l'){
            ctx.fillStyle='#ff3b30';
            for(let x=-1;x<=2;x++) for(let y=Math.ceil(x*x-0.1);y<=x+2.1;y++){
                ctx.beginPath(); ctx.arc(ox+x*s, oy-y*s, 3, 0, 7); ctx.fill();
            }
        }
    }
};
window.onload = () => app.gen();
</script>
</body>
</html>
