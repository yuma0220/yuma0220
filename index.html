<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>二次関数：究極の演習システム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.9/MathJax.js?config=TeX-MML-AM_CHTML"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #050505; --card: #111111; --accent: #8b5cf6; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        aside { width: 300px; background: var(--card); border-right: 1px solid #222; padding: 20px; overflow-y: auto; }
        .lvl-group { margin-bottom: 20px; }
        .lvl-h { color: var(--accent); font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 10px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .q-btn { width: 100%; text-align: left; padding: 12px; background: transparent; border: 1px solid transparent; color: #999; cursor: pointer; border-radius: 6px; font-size: 0.85rem; margin-bottom: 2px; }
        .q-btn:hover { background: #1a1a1a; color: white; }
        .q-btn.active { background: var(--accent); color: white; font-weight: bold; }

        main { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .p-card { background: var(--card); border-radius: 12px; padding: 30px; border: 1px solid #222; }
        .math-box { font-size: 2.2rem; text-align: center; margin: 20px 0; padding: 20px; background: #000; border-radius: 8px; min-height: 1.2em; }
        .instr { font-size: 1.1rem; line-height: 1.6; margin-bottom: 20px; color: #ccc; }
        
        .ai-expl { background: #0a0a0f; border: 1px solid var(--accent); border-radius: 8px; padding: 20px; display: none; line-height: 1.8; margin-bottom: 20px; }
        .chart-box { flex: 1; min-height: 300px; background: #000; border-radius: 12px; border: 1px solid #222; padding: 10px; }
        .ctrl { display: flex; gap: 10px; }
        button.primary { flex: 1; background: var(--accent); color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
    </style>
</head>
<body>

<aside>
    <h2 style="color:var(--accent); margin-bottom: 30px;">二次関数 Master</h2>
    <div class="lvl-group">
        <div class="lvl-h">レベル 1: 基礎・移動</div>
        <button class="q-btn active" id="btn-l1_v" onclick="app.select('l1_v')">頂点と軸の方程式</button>
        <button class="q-btn" id="btn-l1_m" onclick="app.select('l1_m')">平行移動・対称移動</button>
    </div>
    <div class="lvl-group">
        <div class="lvl-h">レベル 2: 最大・最小</div>
        <button class="q-btn" id="btn-l2_r" onclick="app.select('l2_r')">定義域と最大最小</button>
        <button class="q-btn" id="btn-l2_t" onclick="app.select('l2_t')">4次式の置き換え(t)</button>
    </div>
    <div class="lvl-group">
        <div class="lvl-h">レベル 3: 方程式・不等式</div>
        <button class="q-btn" id="btn-l3_d" onclick="app.select('l3_d')">x軸との共有点の個数</button>
        <button class="q-btn" id="btn-l3_l" onclick="app.select('l3_l')">切り取る線分の長さ</button>
    </div>
    <div class="lvl-group">
        <div class="lvl-h">レベル 4: 発展・章末</div>
        <button class="q-btn" id="btn-l4_k" onclick="app.select('l4_k')">頂点の軌跡 (k)</button>
        <button class="q-btn" id="btn-l4_a" onclick="app.select('l4_a')">絶対値グラフの共有点</button>
    </div>
</aside>

<main>
    <div class="p-card">
        <div id="q-instr" class="instr"></div>
        <div id="q-formula" class="math-box"></div>
        <div class="ctrl">
            <button class="primary" onclick="app.showExpl()">解説を表示</button>
            <button class="primary" style="background:#222;" onclick="app.reload()">類題を生成</button>
        </div>
    </div>
    <div id="expl" class="ai-expl"></div>
    <div class="chart-box"><canvas id="mainChart"></canvas></div>
</main>

<script>
const app = {
    mode: 'l1_v',
    current: {},
    chart: null,

    // 数式クリーナー (1x -> x, 0x -> 消去, +- -> -)
    fmt(a, b, c) {
        let s = "";
        if (a !== 0) {
            if (a === 1) s += "x^2";
            else if (a === -1) s += "-x^2";
            else s += a + "x^2";
        }
        if (b !== 0) {
            const sign = b > 0 ? (s ? "+" : "") : "-";
            const val = Math.abs(b) === 1 ? "" : Math.abs(b);
            s += sign + val + "x";
        }
        if (c !== 0) {
            s += (c > 0 ? (s ? "+" : "") : "-") + Math.abs(c);
        }
        return s || "0";
    },

    r(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; },

    select(m) {
        this.mode = m;
        document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + m).classList.add('active');
        this.reload();
    },

    reload() {
        document.getElementById('expl').style.display = 'none';
        let f = "", i = "", e = "", g = {a:1, b:0, c:0, abs:false};
        
        const a = (this.r(1, 2)) * (Math.random() > 0.5 ? 1 : -1);
        const p = this.r(-3, 3); const q = this.r(-3, 3);

        switch(this.mode) {
            case 'l1_v':
                g = {a, b:-2*a*p, c:a*p*p+q, abs:false};
                f = "y = " + this.fmt(g.a, g.b, g.c);
                i = "この2次関数の頂点の座標と軸の方程式を求めよ。";
                e = "平方完成を行うと、y = " + a + "(x " + (p>=0?'-':'+') + Math.abs(p) + ")^2 " + (q>=0?'+':'-') + Math.abs(q) + " となります。よって、頂点は (" + p + ", " + q + ")、軸は x = " + p + " です。";
                break;
            case 'l1_m':
                const dx = this.r(1,3); const dy = this.r(-3,3);
                f = "y = " + this.fmt(a, 0, 0) + " を x軸方向に " + dx + ", y軸方向に " + dy + " 移動";
                i = "平行移動した後の放物線の方程式を求めよ。";
                e = "公式 y - q = a(x - p)^2 に代入します。y - (" + dy + ") = " + a + "(x - " + dx + ")^2。展開して整理すると、y = " + this.fmt(a, -2*a*dx, a*dx*dx+dy) + " です。";
                g = {a, b:-2*a*dx, c:a*dx*dx+dy, abs:false};
                break;
            case 'l2_r':
                const s = p-1; const end = p+2;
                g = {a:1, b:-2*p, c:p*p+q, abs:false};
                f = "y = " + this.fmt(g.a, g.b, g.c) + " \\quad (" + s + " \\le x \\le " + end + ")";
                i = "上の範囲における最大値と最小値を求めよ。";
                const yS = (s-p)**2+q; const yE = (end-p)**2+q;
                e = "頂点 x = " + p + " が範囲内にあります。頂点での値 y = " + q + " と、端点 f(" + s + ")=" + yS + ", f(" + end + ")=" + yE + " を比較して決定します。";
                break;
            case 'l2_t':
                f = "y = (x^2-2x)^2 + 4(x^2-2x) + 1";
                i = "t = x^2 - 2x と置いて、この関数の最小値を求めよ。";
                e = "t = (x-1)^2 - 1 より t ≧ -1。与式は y = t^2 + 4t + 1 = (t+2)^2 - 3。t ≧ -1 の範囲では t = -1 で最小値をとります。";
                g = {a:1, b:4, c:1, abs:false};
                break;
            case 'l3_d':
                const D_val = this.r(-2, 2);
                g = {a:1, b:this.r(-4, 4), c:0, abs:false};
                g.c = Math.floor((g.b**2 - 4*D_val)/4);
                f = "y = " + this.fmt(1, g.b, g.c);
                i = "このグラフと x軸との共有点の個数を求めよ。";
                const D = g.b**2 - 4*g.c;
                e = "判別式 D = b^2 - 4ac を計算します。D = " + D + "。D > 0 なら2個、D = 0 なら1個、D < 0 なら0個となります。";
                break;
            case 'l3_l':
                const len = [2, 4][this.r(0,1)];
                const c_l = p*p - (len*len/4);
                g = {a:1, b:-2*p, c:c_l, abs:false};
                f = "y = " + this.fmt(1, g.b, g.c);
                i = "このグラフが x軸から切り取る線分の長さを求めよ。";
                e = "y=0 とした2次方程式の2解の差を求めます。解は x = " + (p-len/2) + ", " + (p+len/2) + " なので、長さは " + len + " です。";
                break;
            case 'l4_k':
                const kv = this.r(1,3);
                f = "y = x^2 - 2kx + k^2 + " + kv + "k";
                i = "定数 k が変化するとき、この放物線の頂点が描く図形の方程式を求めよ。";
                e = "頂点の座標を (x, y) とすると、x = k, y = " + kv + "k です。kを消去して y = " + kv + "x となります。";
                g = {a:1, b:-2*2, c:4+kv*2, abs:false};
                break;
            case 'l4_a':
                const av = [1, 4][this.r(0,1)];
                f = "y = |x^2 - " + av + "|";
                i = "直線 y = k との共有点が3個になるような、定数 k の値を求めよ。";
                e = "y = |x^2 - " + av + "| のグラフは x = 0 で極大値 " + av + " をとります。直線がここを通るとき、共有点は3個です。";
                g = {a:1, b:0, c:-av, abs:true};
                break;
        }

        this.current = {f, i, e, g};
        document.getElementById('q-formula').innerHTML = "\\[ " + f + " \\]";
        document.getElementById('q-instr').innerText = i;
        if (window.MathJax) MathJax.Hub.Queue(["Typeset", MathJax.Hub, "q-formula"]);
        this.draw();
    },

    showExpl() {
        const el = document.getElementById('expl');
        el.innerHTML = "<h3 style='margin:0 0 10px 0; color:var(--accent)'>解説</h3>" + this.current.e;
        el.style.display = 'block';
        if (window.MathJax) MathJax.Hub.Queue(["Typeset", MathJax.Hub, "expl"]);
    },

    draw() {
        const ctx = document.getElementById('mainChart').getContext('2d');
        if (this.chart) this.chart.destroy();
        const {a, b, c, abs} = this.current.g;
        const pts = [];
        for (let x = -7; x <= 7; x += 0.05) {
            let y = a * x * x + b * x + c;
            if (abs) y = Math.abs(y);
            pts.push({ x, y });
        }
        this.chart = new Chart(ctx, {
            type: 'scatter',
            data: { datasets: [{ data: pts, showLine: true, borderColor: '#8b5cf6', borderWidth: 2, pointRadius: 0, tension: 0.4 }] },
            options: { 
                responsive: true, maintainAspectRatio: false, 
                scales: { 
                    x: { min: -5, max: 5, grid: { color: '#222' } }, 
                    y: { min: -3, max: 10, grid: { color: '#222' } } 
                },
                plugins: { legend: { display: false } }
            }
        });
    }
};

window.onload = () => app.reload();
</script>
</body>
</html>
