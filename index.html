<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>二次関数 AI Tutor - 完全解説版</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --purple: #a78bfa; --text: #f8fafc; --accent: #22c55e; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 250px 1fr; gap: 20px; }
        .card { background: var(--card); border-radius: 12px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .formula-box { background: rgba(0,0,0,0.3); padding: 20px; text-align: center; font-size: 1.5em; border-radius: 8px; margin: 15px 0; border: 1px solid var(--purple); }
        
        /* ここが「解説」のスタイル */
        .explanation-area { 
            background: linear-gradient(135deg, #1e1b4b, #2e1065); 
            border: 1px solid var(--purple); border-left: 6px solid var(--purple);
            padding: 20px; margin-top: 20px; display: none; /* 最初は隠す */
        }
        .step { margin-bottom: 15px; }
        .step-label { color: var(--purple); font-weight: bold; display: block; margin-bottom: 5px; }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 8px; color: white; }
        .btn-main { background: #3b82f6; }
        .btn-ans { background: var(--accent); }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; font-size: 1.1em; }
    </style>
</head>
<body>

<div class="container">
    <aside>
        <div class="card">
            <h3>問題を選択</h3>
            <button class="btn btn-main" onclick="app.generate('vertex')">頂点の座標 (*)</button>
            <button class="btn btn-main" onclick="app.generate('maxmin')">最大・最小 (***)</button>
            <p style="font-size: 0.8em; color: #94a3b8;">※画像(Step Up 7,8)の類似問題をAIが自動生成します</p>
        </div>
    </aside>

    <main>
        <div class="card">
            <div id="q-label" style="font-size: 0.9em; color: var(--purple);">演習</div>
            <div id="q-text" class="formula-box">問題を生成してください</div>
            <p id="q-desc" style="font-weight: bold;"></p>
            <input type="text" id="user-ans" placeholder="答えを入力">
            <button class="btn btn-ans" style="margin-top:15px;" onclick="app.check()">判定 & 解説を表示</button>
        </div>

        <div id="explanation" class="explanation-area">
            <h3 style="margin-top:0; color: var(--purple);">🤖 AIによる詳細解説</h3>
            <div id="expl-content"></div>
            <button class="btn btn-main" style="margin-top:15px; background: #475569;" onclick="app.next()">次の問題へ</button>
        </div>
    </main>
</div>

<script>
const app = {
    current: {},

    // 問題を生成する心臓部
    generate(type) {
        document.getElementById('explanation').style.display = 'none';
        document.getElementById('user-ans').value = '';
        
        // ランダムな係数 (画像の問題レベルに調整)
        const a = (Math.floor(Math.random() * 2) + 1) * (Math.random() > 0.5 ? 1 : -1);
        const p = Math.floor(Math.random() * 6) - 3;
        const q = Math.floor(Math.random() * 6) - 3;
        const b = -2 * a * p;
        const c = a * p * p + q;

        this.current = { a, b, c, p, q, type };

        if (type === 'vertex') {
            document.getElementById('q-text').innerHTML = `\\( y = ${this.fmt(a,b,c)} \\)`;
            document.getElementById('q-desc').innerText = "この放物線の頂点の座標を求めなさい。";
        } else {
            const start = p - 2; const end = p + 1;
            this.current.range = [start, end];
            document.getElementById('q-text').innerHTML = `\\( y = ${this.fmt(a,b,c)} \\quad (${start} \\le x \\le ${end}) \\)`;
            document.getElementById('q-desc').innerText = "この範囲における最大値と最小値を求めなさい。";
        }
        MathJax.typeset();
    },

    // 判定と「解説」の生成
    check() {
        const expl = document.getElementById('explanation');
        const content = document.getElementById('expl-content');
        const { a, b, c, p, q, type, range } = this.current;

        // --- ここでAI解説文を動的に組み立てる ---
        let html = `<div class="step"><span class="step-label">【STEP 1】平方完成</span>`;
        html += `式を $y = a(x-p)^2 + q$ の形に変形します。<br>`;
        html += `\\( y = ${a}(x^2 ${b/a >= 0 ? '+' : ''}${b/a}x) ${c >= 0 ? '+' : ''}${c} \\)<br>`;
        html += `\\( y = ${a}(x ${-p >= 0 ? '+' : ''}${-p})^2 ${q >= 0 ? '+' : ''}${q} \\)</div>`;

        if (type === 'vertex') {
            html += `<div class="step"><span class="step-label">【STEP 2】頂点の特定</span>`;
            html += `平方完成された形から、頂点は **$(${p}, ${q})$** となります。</div>`;
        } else {
            const y_start = a*range[0]*range[0] + b*range[0] + c;
            const y_end = a*range[1]*range[1] + b*range[1] + c;
            html += `<div class="step"><span class="step-label">【STEP 2】端点の値を計算</span>`;
            html += `$x = ${range[0]}$ のとき $y = ${y_start}$<br>`;
            html += `$x = ${range[1]}$ のとき $y = ${y_end}$</div>`;
            html += `<div class="step"><span class="step-label">【STEP 3】最大・最小の判断</span>`;
            html += `軸 $x = ${p}$ は範囲内にあるため、頂点と端点を比較します。<br>`;
            html += `結果：**最大値 ${Math.max(y_start, y_end, q)}、最小値 ${Math.min(y_start, y_end, q)}** です。</div>`;
        }

        content.innerHTML = html;
        expl.style.display = 'block';
        MathJax.typeset();
    },

    fmt(a, b, c) {
        let s = (a === 1 ? "" : a === -1 ? "-" : a) + "x^2";
        if (b !== 0) s += (b > 0 ? "+" : "") + (Math.abs(b) === 1 ? (b > 0 ? "" : "-") : b) + "x";
        if (c !== 0) s += (c > 0 ? "+" : "") + c;
        return s;
    },

    next() { this.generate(this.current.type); }
};

window.onload = () => app.generate('vertex');
</script>

</body>
</html>
