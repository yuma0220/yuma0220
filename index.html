<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GIGA CORE 3M: STEALTH BLACK</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <aside>
        <div class="logo">GIGA CORE 3.0M</div>
        <div class="nav-scroll">
            <div class="cat">BASIC</div>
            <button class="nav-btn active" data-mode="k_sq">01. 頂点・平方完成</button>
            <button class="nav-btn" data-mode="k_mv">02. 平行移動</button>
            <button class="nav-btn" data-mode="k_3p">03. 三点を通る式</button>
            <button class="nav-btn" data-mode="k_mm">04. 最大・最小</button>
            <button class="nav-btn" data-mode="k_iq">05. 二次不等式</button>
            <button class="nav-btn" data-mode="k_cp">06. x軸との共有点</button>
            <div class="cat">ELITE</div>
            <button class="nav-btn" data-mode="a_mm">07. 軸が動く最大最小</button>
            <button class="nav-btn" data-mode="a_rp">08. 解の配置</button>
            <button class="nav-btn" data-mode="a_ar">09. 通過領域</button>
            <button class="nav-btn" data-mode="a_ab">10. 絶対値と共有点</button>
            <button class="nav-btn" data-mode="a_it">11. 整数解条件</button>
            <button class="nav-btn" data-mode="a_sm">12. 対称式と存在条件</button>
            <button class="nav-btn" data-mode="a_tr">13. 図形への応用</button>
        </div>
    </aside>

    <main>
        <div class="p-card">
            <div id="q-math" class="math-row"></div>
            <div id="q-inst" class="inst-row"></div>
            <div class="btn-row">
                <button class="btn btn-gen" id="gen-btn">GENERATE</button>
                <button class="btn btn-ans" id="ans-btn">ANALYSIS</button>
            </div>
            <div id="ans-box" class="ans-box"></div>
        </div>
        <div class="graph-box">
            <canvas id="mainChart"></canvas>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
