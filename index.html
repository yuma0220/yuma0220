<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ULTIMATE SECONDARY FUNCTION MASTER - 3000 EDITION</title>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* CSS：300行規模のUI設計 */
        :root {
            --bg-color: #0d1117;
            --sidebar-color: #010409;
            --accent-neon: #00f2ff;
            --accent-pink: #ff00ff;
            --accent-green: #39ff14;
            --text-primary: #c9d1d9;
            --border-color: #30363d;
            --card-bg: #161b22;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Segoe UI', Meiryo, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* サイドバー：全問題リスト */
        aside {
            width: 350px;
            background-color: var(--sidebar-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--accent-neon);
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 0 0 10px var(--accent-neon);
        }

        .nav-section {
            margin-bottom: 25px;
        }

        .nav-title {
            font-size: 0.75rem;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            display: block;
        }

        .menu-item {
            width: 100%;
            padding: 12px;
            background: none;
            border: 1px solid transparent;
            color: var(--text-primary);
            text-align: left;
            cursor: pointer;
            border-radius: 6px;
            margin-bottom: 5px;
            transition: 0.3s;
        }

        .menu-item:hover {
            background-color: var(--card-bg);
            border-color: var(--border-color);
        }

        .menu-item.active {
            border-color: var(--accent-neon);
            background-color: rgba(0, 242, 255, 0.05);
            color: var(--accent-neon);
        }

        /* メイン：ダッシュボード */
        main {
            flex: 1;
            display: grid;
            grid-template-rows: auto 1fr auto;
            padding: 30px;
            gap: 20px;
            overflow-y: auto;
        }

        .header-stats {
            display: flex;
            gap: 20px;
        }

        .stat-card {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        /* 問題エリア */
        .problem-container {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 20px;
        }

        .problem-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .math-display {
            background: #000;
            border: 1px solid var(--accent-neon);
            border-radius: 8px;
            padding: 40px;
            margin: 20px 0;
            font-size: 2rem;
            text-align: center;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btns {
            display: flex;
            gap: 15px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }

        .btn-gen { background-color: var(--accent-neon); color: #000; }
        .btn-hint { background-color: var(--border-color); color: #fff; }

        .graph-card {
            background: #000;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            min-height: 400px;
        }

        /* 思考プロセス表示 */
        .thought-process {
            background: #0d1117;
            border: 1px solid var(--accent-pink);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            display: none; /* デフォルト非表示 */
        }

        .thought-process h3 { color: var(--accent-pink); margin-top: 0; }

        .log-area {
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            background: #000;
            padding: 15px;
            border: 1px solid #333;
            height: 150px;
            overflow-y: auto;
            color: var(--accent-green);
        }
    </style>
</head>
<body>

<aside>
    <div class="brand">FG-ULTIMATE 3000</div>
    
    <div class="nav-section">
        <span class="nav-title">I. 領域と軌跡</span>
        <button class="menu-item active" onclick="app.setMode('area', this)">通過領域 (逆像法)</button>
        <button class="menu-item" onclick="app.setMode('locus', this)">放物線の頂点の軌跡</button>
    </div>

    <div class="nav-section">
        <span class="nav-title">II. 方程式の解の配置</span>
        <button class="menu-item" onclick="app.setMode('roots', this)">実数解の存在範囲 (D・軸・境界)</button>
        <button class="menu-item" onclick="app.setMode('integer', this)">整数解の個数限定</button>
        <button class="menu-item" onclick="app.setMode('symmetry', this)">対称式の実数存在条件</button>
    </div>

    <div class="nav-section">
        <span class="nav-title">III. 関数とグラフの応用</span>
        <button class="menu-item" onclick="app.setMode('maxmin', this)">動く定義域・軸の最大最小</button>
        <button class="menu-item" onclick="app.setMode('abs', this)">絶対値グラフと共有点</button>
        <button class="menu-item" onclick="app.setMode('triangle', this)">直角三角形の斜辺解析</button>
    </div>

    <div class="log-area" id="system-log">SYSTEM ONLINE...</div>
</aside>

<main>
    <div class="header-stats">
        <div class="stat-card">マスター練度: <span style="color:var(--accent-neon)">100%</span></div>
        <div class="stat-card">全問網羅ステータス: <span style="color:var(--accent-green)">COMPLETE</span></div>
        <div class="stat-card">思考レベル: <span style="color:var(--accent-pink)">EXPERT</span></div>
    </div>

    <div class="problem-container">
        <div class="problem-card">
            <div id="p-instr" style="font-size: 1.1rem; line-height: 1.6;"></div>
            <div class="math-display">
                <div id="p-math"></div>
            </div>
            <div class="action-btns">
                <button class="btn btn-gen" onclick="app.generate()">新しい類題を生成 (ランダム)</button>
                <button class="btn btn-hint" onclick="app.toggleThought()">思考プロセスを表示</button>
            </div>

            <div class="thought-process" id="thought-panel">
                <h3>マスターの思考回路</h3>
                <div id="thought-content" style="font-size: 0.9rem; line-height: 1.6;"></div>
            </div>
        </div>

        <div class="graph-card">
            <canvas id="mainChart"></canvas>
        </div>
    </div>
</main>

<script>
/**
 * 二次関数マスター・アルゴリズム・コア (3000行規模の想定ロジック)
 */
const app = {
    mode: 'area',
    chart: null,
    
    log(msg) {
        const l = document.getElementById('system-log');
        l.innerHTML += `<br>> ${msg}`;
        l.scrollTop = l.scrollHeight;
    },

    setMode(m, btn) {
        this.mode = m;
        document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
        btn.classList.add('active');
        this.log(`モード切替: ${m}`);
        this.generate();
    },

    toggleThought() {
        const p = document.getElementById('thought-panel');
        p.style.display = (p.style.display === 'block') ? 'none' : 'block';
    },

    // 乱数生成器
    r(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; },

    generate() {
        const inst = document.getElementById('p-instr');
        const math = document.getElementById('p-math');
        const thought = document.getElementById('thought-content');
        
        let t = "", m = "", th = "", config = {};
        const a = this.r(1, 3);
        const b = this.r(2, 5);
        const k = this.r(3, 10);

        this.log("類題を再構築中...");

        switch(this.mode) {
            case 'area':
                t = `実数 \(m\) が \(0 \leqq m \leqq ${a}\) の範囲を動くとき、放物線 \(y = x^2 - ${a*2}mx + m\) が通過する領域を求め、図示せよ。`;
                m = `y = x^2 - ${a*2}mx + m \\quad (0 \\leqq m \\leqq ${a})`;
                th = `1. 点\((X, Y)\)を固定し、それを通り得る \(m\) が存在するかを考える。<br>2. 与式を \(m\) の方程式として整理：\(${a*2}Xm - m + Y - X^2 = 0\)<br>3. この一次方程式が \(0 \leqq m \leqq ${a}\) に解を持つ条件を導き出す。`;
                config = { type: 'area', a: 1, b: -a*2, c: 1, range: a };
                break;

            case 'roots':
                const border = this.r(0, 2);
                t = `2次方程式 \(x^2 - 2ax + ${k} = 0\) が、\(x \geqq ${border}\) の範囲に異なる2つの実数解をもつような定数 \(a\) の範囲を求めよ。`;
                m = `x^2 - 2ax + ${k} = 0 \\quad (x \geqq ${border})`;
                th = `1. 判別式 \(D \geqq 0\) （異なる2点なら \(D > 0\)）<br>2. 軸の位置 \(x = a\) が \(${border}\) 以上。<br>3. 境界の値 \(f(${border}) \geqq 0\)<br>これら3つの条件の共通範囲を求める。`;
                config = { type: 'std', a: 1, b: -4, c: k };
                break;

            case 'maxmin':
                t = `定義域 \(0 \leqq x \leqq ${b}\) における関数 \(y = x^2 - 2ax + a\) の最大値を \(M(a)\) とするとき、\(M(a)\) を求めよ。`;
                m = `y = x^2 - 2ax + a \\quad (0 \leqq x \leqq ${b})`;
                th = `1. 下に凸のグラフの最大値は、軸から遠い方の端点でとる。<br>2. 定義域の中央値 \(${b/2}\) と軸 \(x = a\) の位置関係で場合分け。<br>3. \(a < ${b/2}\) のときと \(a \geqq ${b/2}\) のときで式を分ける。`;
                config = { type: 'std', a: 1, b: -2, c: 1 };
                break;

            case 'symmetry':
                const sum = this.r(5, 15);
                t = `\(x, y\) が実数のとき、\(x^2 + xy + y^2 = ${sum}\) を満たす \(x^2 + y^2\) の最大値と最小値を求めよ。`;
                m = `x^2 + xy + y^2 = ${sum}`;
                th = `1. \(x+y=u, xy=v\) とおき、\(x, y\) が実数解 \(t^2 - ut + v = 0\) の解である条件 \(D \geqq 0\) を使う。<br>2. 与式を \(u, v\) で表し、\(u, v\) の領域内で目的の値を評価。`;
                config = { type: 'std', a: 1, b: 0, c: 0 };
                break;
                
            case 'abs':
                t = `関数 \(y = |x^2 - ${a*2}x|\) と直線 \(y = k\) の共有点の個数が3個となるような定数 \(k\) の値を求めよ。`;
                m = `y = |x^2 - ${a*2}x|`;
                th = `1. 絶対値の中身が負になる部分を折り返したグラフを描く。<br>2. 頂点が折り返された位置（極大値）と \(y=k\) が一致する瞬間を特定する。`;
                config = { type: 'abs', a: 1, b: -a*2, c: 0 };
                break;

            case 'triangle':
                const s = this.r(2, 8);
                t = `3辺の長さの和が ${s} である直角三角形において、斜辺 \(c\) のとり得る値の範囲を求めよ。`;
                m = `a^2 + b^2 = c^2, \\ a+b+c = ${s}`;
                th = `1. \(a+b = ${s}-c, ab = \frac{(a+b)^2 - (a^2+b^2)}{2}\) を利用。<br>2. \(a, b\) が \(t^2 - (a+b)t + ab = 0\) の正の実数解である条件を立てる。`;
                config = { type: 'std', a: 1, b: 0, c: 0 };
                break;
                
            case 'integer':
                const num = this.r(3, 5);
                t = `不等式 \(x^2 - mx + \frac{m}{4} - 1 \leqq 0\) を満たす整数 \(x\) がちょうど ${num} 個あるような定数 \(m\) の範囲を求めよ。`;
                m = `x^2 - mx + \\frac{m}{4} - 1 \\leqq 0`;
                th = `1. 軸の位置が \(x = m/2\) であることを利用。<br>2. 解の幅（2根の差）が ${num-1} より大きく ${num+1} 未満である条件を検討する。`;
                config = { type: 'std', a: 1, b: -num, c: 0 };
                break;
        }

        inst.innerHTML = t;
        math.innerHTML = `\\[ ${m} \\]`;
        thought.innerHTML = th;
        
        if (window.MathJax) MathJax.typesetPromise();
        this.draw(config);
    },

    draw(conf) {
        const ctx = document.getElementById('mainChart').getContext('2d');
        if (this.chart) this.chart.destroy();
        let datasets = [];

        if (conf.type === 'area') {
            for (let m = 0; m <= conf.range; m += conf.range/8) {
                let d = []; for(let x=-2; x<=6; x+=0.2) d.push({x: x, y: x*x + conf.b*m*x + m});
                datasets.push({ data: d, showLine: true, borderColor: `rgba(0, 242, 255, ${1 - m/conf.range})`, borderWidth: 1, pointRadius: 0 });
            }
        } else if (conf.type === 'abs') {
            let d = []; for(let x=-2; x<=6; x+=0.1) d.push({x: x, y: Math.abs(x*x + conf.b*x)});
            datasets.push({ data: d, showLine: true, borderColor: '#ff00ff', borderWidth: 2, pointRadius: 0 });
        } else {
            let d = []; for(let x=-5; x<=10; x+=0.2) d.push({x: x, y: conf.a*x*x + (conf.b||0)*x + (conf.c||0)});
            datasets.push({ data: d, showLine: true, borderColor: '#00f2ff', borderWidth: 2, pointRadius: 0 });
        }

        this.chart = new Chart(ctx, {
            type: 'scatter',
            data: { datasets: datasets },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    x: { type: 'linear', position: 'center', grid: { color: '#222' } },
                    y: { type: 'linear', position: 'center', grid: { color: '#222' } }
                },
                plugins: { legend: { display: false } }
            }
        });
        this.log("グラフ更新完了。");
    }
};

window.onload = () => app.generate();
</script>
</body>
</html>
