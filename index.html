<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIGA CORE 3M: FULL REPOSITORY</title>
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --border: #30363d;
            --accent-green: #238636; --accent-blue: #1f6feb; --accent-purple: #8957e5;
            --text-main: #c9d1d9; --text-sub: #8b949e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text-main); font-family: -apple-system, sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        aside { width: 280px; background: var(--bg); border-right: 1px solid var(--border); padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
        .nav-scroll { flex: 1; }
        .cat { font-size: 0.7rem; color: var(--text-sub); margin: 15px 0 8px; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
        .nav-btn { width: 100%; padding: 10px; background: none; border: 1px solid transparent; color: var(--text-sub); text-align: left; cursor: pointer; border-radius: 6px; font-size: 0.85rem; margin-bottom: 4px; }
        .nav-btn:hover { background: #21262d; color: #fff; }
        .nav-btn.active { background: #21262d; border-color: var(--accent-blue); color: #fff; }

        main { flex: 1; padding: 20px; overflow-y: auto; display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
        .p-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 25px; position: relative; }
        .badge { position: absolute; top: 15px; left: 15px; background: var(--accent-blue); color: #fff; font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; }
        .q-text { font-size: 1.8rem; text-align: center; margin: 20px 0; font-weight: bold; color: #fff; }
        .q-inst { text-align: center; color: var(--text-sub); margin-bottom: 20px; min-height: 3em; }
        
        .input-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 15px; }
        input[type="text"] { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 10px; color: #fff; width: 50%; }
        .btn-green { background: var(--accent-green); color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-blue { background: var(--accent-blue); color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }

        .graph-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; height: 400px; position: relative; }
        canvas { width: 100%; height: 100%; }

        .analysis-col { display: flex; flex-direction: column; gap: 20px; }
        .side-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 15px; }
        .stat-bar-container { display: flex; align-items: flex-end; gap: 8px; height: 100px; padding: 10px; }
        .stat-bar { flex: 1; border-radius: 4px 4px 0 0; min-height: 5px; }

        .controls { background: #000; padding: 10px; border-radius: 8px; margin-top: 10px; border: 1px solid var(--border); }
        .ctrl-row { margin-bottom: 8px; }
        .ctrl-row label { font-size: 0.7rem; color: var(--text-sub); display: block; }
        input[type=range] { width: 100%; accent-color: var(--accent-blue); }

        .ans-box { display: none; margin-top: 10px; padding: 10px; background: #000; border-left: 3px solid var(--accent-purple); font-size: 0.85rem; color: var(--text-sub); }
    </style>
</head>
<body>

<aside>
    <div style="font-weight: 800; color: var(--accent-blue); margin-bottom: 20px; font-size: 1.2rem;">CORE 3M: INF</div>
    <div class="nav-scroll">
        <div class="cat">Quadratic (I/A)</div>
        <button class="nav-btn active" data-unit="q1">文字係数の平方完成</button>
        <button class="nav-btn" data-unit="q2">区間が動く最大最小</button>
        <button class="nav-btn" data-unit="q3">解の配置(多重制約)</button>
        <div class="cat">Advanced (II/B)</div>
        <button class="nav-btn" data-unit="a1">指数関数の爆発的変化</button>
        <button class="nav-btn" data-unit="a2">対数関数のグラフ性質</button>
        <button class="nav-btn" data-unit="a3">三角関数の干渉</button>
        <div class="cat">Divine (III/C)</div>
        <button class="nav-btn" data-unit="d1">楕円の標準形と接線</button>
        <button class="nav-btn" data-unit="d2">放物線の1/6求積</button>
    </div>
</aside>

<main>
    <div style="display:flex; flex-direction:column; gap:20px;">
        <div class="p-card">
            <span class="badge" id="badge">normal</span>
            <div class="q-text" id="q-math">y = 2x² - 3x + 1</div>
            <div class="q-inst" id="q-inst">の頂点のx座標を求めよ。</div>
            <div class="input-row">
                <input type="text" id="user-ans" placeholder="答えを入力">
                <button class="btn-green" onclick="app.check()">答える</button>
                <button class="btn-blue" onclick="app.toggleAns()">解説</button>
            </div>
            <div id="ans-box" class="ans-box"></div>
        </div>

        <div class="graph-card">
            <canvas id="cvs"></canvas>
            <div class="controls">
                <div class="ctrl-row">
                    <label>PARAM α: <span id="valA">1.0</span></label>
                    <input type="range" id="rangeA" min="-5" max="5" step="0.1" value="1">
                </div>
                <div class="ctrl-row">
                    <label>PARAM β: <span id="valB">0.0</span></label>
                    <input type="range" id="rangeB" min="-5" max="5" step="0.1" value="0">
                </div>
            </div>
        </div>
    </div>

    <div class="analysis-col">
        <div class="side-card">
            <h3>📊 分析 (弱点)</h3>
            <div class="stat-bar-container">
                <div class="stat-bar" style="height: 50%; background: var(--accent-green);"></div>
                <div class="stat-bar" style="height: 66%; background: var(--accent-blue);"></div>
                <div class="stat-bar" style="height: 33%; background: var(--accent-purple);"></div>
            </div>
            <div style="display:flex; font-size:0.7rem; color:var(--text-sub); text-align:center;">
                <span style="flex:1">basic</span><span style="flex:1">normal</span><span style="flex:1">advanced</span>
            </div>
        </div>
        <div class="side-card">
            <h3>🕒 履歴</h3>
            <div id="history" style="font-size:0.8rem; color:var(--text-sub);">
                記録待ち...
            </div>
        </div>
    </div>
</main>

<script>
const app = {
    unit: 'q1', paramA: 1.0, paramB: 0.0,
    
    engines: {
        q1: { q: "y = ax² + bx + c", i: "頂点の座標を α, β を用いて表せ。", a: "頂点 (-b/2a, f(-b/2a))", badge: "basic" },
        q2: { q: "y = x² - 4x + 5 (α ≦ x ≦ α+2)", i: "最大値 M(α) が 10 となる α は？", a: "軸 x=2 と区間中央 α+1 を比較せよ。", badge: "normal" },
        q3: { q: "x² - 2αx + 3β = 0", i: "異なる2つの実数解を持つ範囲を求めよ。", a: "判別式 D > 0, 軸, 端点の符号を確認。", badge: "advanced" },
        a1: { q: "y = α^x", i: "α > 1 の時と 0 < α < 1 の時の違いをグラフで示せ。", a: "増加・減少の入れ替わり。", badge: "exp" },
        a2: { q: "y = log_α(x + β)", i: "漸近線の位置を β で答えよ。", a: "x = -β が漸近線。", badge: "log" },
        a3: { q: "y = α sin(βx)", i: "振幅 α と周期 2π/β の関係を確認せよ。", a: "bが大きくなると波が細かくなる。", badge: "trig" },
        d1: { q: "x²/α² + y²/β² = 1", i: "楕円上の点における接線を α, β で表せ。", a: "x1x/a² + y1y/b² = 1", badge: "conic" },
        d2: { q: "y = x² - α, y = -x² + β", i: "囲まれた面積の公式(1/6)を適用せよ。", a: "S = 1/6|a-a'|(β-α)³", badge: "calc" }
    },

    init() {
        this.cacheDOM();
        this.bindEvents();
        this.updateUnit();
    },

    cacheDOM() {
        this.qMath = document.getElementById('q-math');
        this.qInst = document.getElementById('q-inst');
        this.ansBox = document.getElementById('ans-box');
        this.badge = document.getElementById('badge');
        this.cvs = document.getElementById('cvs');
        this.ctx = this.cvs.getContext('2d');
    },

    bindEvents() {
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.onclick = (e) => {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                this.unit = e.target.dataset.unit;
                this.updateUnit();
            };
        });

        const updateParams = () => {
            this.paramA = parseFloat(document.getElementById('rangeA').value);
            this.paramB = parseFloat(document.getElementById('rangeB').value);
            document.getElementById('valA').innerText = this.paramA.toFixed(1);
            document.getElementById('valB').innerText = this.paramB.toFixed(1);
            this.draw();
        };
        document.getElementById('rangeA').oninput = updateParams;
        document.getElementById('rangeB').oninput = updateParams;
        window.onresize = () => this.draw();
    },

    updateUnit() {
        const data = this.engines[this.unit];
        this.qMath.innerText = data.q;
        this.qInst.innerText = data.i;
        this.ansBox.innerText = "[解説]: " + data.a;
        this.ansBox.style.display = 'none';
        this.badge.innerText = data.badge;
        this.draw();
    },

    toggleAns() {
        this.ansBox.style.display = (this.ansBox.style.display === 'block') ? 'none' : 'block';
    },

    check() {
        alert("GitHubデプロイ用に回答チェック機能を拡張可能です！");
    },

    draw() {
        const { cvs, ctx, paramA: a, paramB: b } = this;
        const w = cvs.width = cvs.offsetWidth, h = cvs.height = cvs.offsetHeight;
        const s = 40, ox = w/2, oy = h/2;

        ctx.clearRect(0,0,w,h);
        ctx.strokeStyle = "#30363d"; ctx.beginPath();
        for(let i=-15; i<=15; i++){
            ctx.moveTo(ox+i*s, 0); ctx.lineTo(ox+i*s, h);
            ctx.moveTo(0, oy-i*s); ctx.lineTo(w, oy-i*s);
        }
        ctx.stroke();

        ctx.strokeStyle = "#1f6feb"; ctx.lineWidth = 3; ctx.beginPath();
        for(let i=0; i<w; i++){
            let x = (i-ox)/s, y = 0;
            switch(this.unit){
                case 'q1': case 'q2': case 'q3': y = a*x*x + b*x; break;
                case 'a1': y = Math.pow(Math.abs(a)+0.1, x); break;
                case 'a2': y = (x+b>0)? Math.log(x+b)/Math.log(Math.abs(a)+1.1) : -10; break;
                case 'a3': y = a * Math.sin(b * x); break;
                case 'd1': // 楕円
                    ctx.save(); ctx.strokeStyle = "#8957e5"; ctx.beginPath();
                    for(let t=0; t<Math.PI*2; t+=0.1){
                        let ex = ox + Math.cos(t)*Math.abs(a)*s, ey = oy - Math.sin(t)*Math.abs(b)*s;
                        if(t===0) ctx.moveTo(ex, ey); else ctx.lineTo(ex, ey);
                    }
                    ctx.stroke(); ctx.restore(); y=-100; break;
                case 'd2': y = (x-a)*(x-b); break;
            }
            let py = oy - y*s;
            if(i===0) ctx.moveTo(i, py); else ctx.lineTo(i, py);
        }
        ctx.stroke();
    }
};
window.onload = () => app.init();
</script>
</body>
</html>
