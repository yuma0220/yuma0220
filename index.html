<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>二次関数 Ultimate AI Studio</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #020617; --panel: #0f172a; --accent: #c084fc; --text: #f8fafc; --green: #22c55e; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* サイドバー：全問題カテゴリ網羅 */
        aside { width: 320px; background: var(--panel); border-right: 1px solid #1e293b; overflow-y: auto; padding: 20px; }
        .cat-title { font-size: 0.8rem; color: #64748b; text-transform: uppercase; margin: 20px 0 10px; border-bottom: 1px solid #1e293b; }
        .btn-q { width: 100%; text-align: left; padding: 10px; background: transparent; border: 1px solid transparent; color: #94a3b8; cursor: pointer; border-radius: 6px; font-size: 0.9rem; transition: 0.2s; }
        .btn-q:hover { background: #1e293b; color: var(--accent); }
        .btn-q.active { border-color: var(--accent); color: white; background: #1e1b4b; }

        /* メインコンテンツ */
        main { flex: 1; overflow-y: auto; padding: 40px; }
        .problem-card { background: var(--panel); border-radius: 20px; padding: 40px; border: 1px solid #1e293b; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .formula { font-size: 2.2rem; text-align: center; margin: 30px 0; min-height: 80px; }
        .instruction { font-size: 1.2rem; color: #cbd5e1; margin-bottom: 30px; line-height: 1.6; }
        
        /* 解説パネル */
        .ai-expl { margin-top: 30px; background: linear-gradient(135deg, #1e1b4b, #2e1065); border: 1px solid var(--accent); border-radius: 12px; padding: 25px; display: none; }
        .step { margin-bottom: 15px; padding-left: 20px; border-left: 2px solid var(--accent); }
        
        /* グラフ */
        .graph-wrap { margin-top: 30px; height: 400px; background: #000; border-radius: 12px; padding: 10px; }
        
        .ans-row { display: flex; gap: 10px; align-items: center; }
        input { flex: 1; padding: 15px; background: #020617; border: 1px solid #334155; color: white; border-radius: 10px; font-size: 1.1rem; }
        .btn-check { padding: 15px 30px; background: var(--green); border: none; color: white; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<aside>
    <h2 style="color:var(--accent)">二次関数マスター</h2>
    
    <div class="cat-title">画像 1-15 (基礎・移動)</div>
    <button class="btn-q" onclick="core.gen('v')">1-2. 頂点と軸</button>
    <button class="btn-q" onclick="core.gen('move')">3-5. 平行・対称移動</button>
    <button class="btn-q" onclick="core.gen('deter')">13-15. 式の決定</button>

    <div class="cat-title">画像 7-12 (最大・最小)</div>
    <button class="btn-q" onclick="core.gen('range')">7-9. 定義域による変化</button>
    <button class="btn-q" onclick="core.gen('replace')">10-11. 4次式の置き換え</button>
    <button class="btn-q" onclick="core.gen('geom')">12. 長方形の最大面積</button>

    <div class="cat-title">画像 16-27 (方程式・不等式)</div>
    <button class="btn-q" onclick="core.gen('root')">17-19. x軸との共有点</button>
    <button class="btn-q" onclick="core.gen('ineq')">22-24. 2次不等式の解</button>
    <button class="btn-q" onclick="core.gen('length')">25. 切り取る線分の長さ</button>

    <div class="cat-title">画像 34-37 (章末B・発展)</div>
    <button class="btn-q" onclick="core.gen('k_top')">34. 頂点の軌跡(kの式)</button>
    <button class="btn-q" onclick="core.gen('abs')">36-37. 絶対値と共有点</button>
    <button class="btn-q" onclick="core.gen('exist')">発展. 解の配置(符号)</button>
</aside>

<main>
    <div class="problem-card">
        <span id="q-tag" style="color:var(--accent); font-weight: bold;">SELECT A PROBLEM</span>
        <div id="q-formula" class="formula">$$y = ax^2 + bx + c$$</div>
        <div id="q-instr" class="instruction">左のメニューから問題を選択してください。</div>
        
        <div class="ans-row">
            <input type="text" id="ans-in" placeholder="答えを入力 (AIが思考プロセスを判定します)">
            <button class="btn-check" onclick="core.check()">判定 & 解説</button>
        </div>

        <div id="expl" class="ai-expl">
            <h3 style="margin-top:0; color:var(--accent)">🤖 AIによる思考ガイド</h3>
            <div id="expl-body"></div>
        </div>
    </div>

    <div class="graph-wrap">
        <canvas id="chart"></canvas>
    </div>
</main>

<script>
const core = {
    curr: {},
    chart: null,

    gen(type) {
        this.curr = { type };
        document.getElementById('expl').style.display = 'none';
        const a = (Math.floor(Math.random()*3)+1) * (Math.random()>0.5?1:-1);
        const p = Math.floor(Math.random()*6)-3;
        const q = Math.floor(Math.random()*6)-3;
        const b = -2*a*p; const c = a*p*p+q;
        
        let f = ""; let i = "";
        
        switch(type) {
            case 'v': 
                f = `y = ${this.fmt(a,b,c)}`; i = "頂点の座標を求めよ。"; break;
            case 'range': 
                let s = p-2; let e = p+1; this.curr.r = [s,e];
                f = `y = ${this.fmt(a,b,c)} \\quad (${s} \\le x \\le ${e})`;
                i = "最大値と最小値を求めよ。"; break;
            case 'length':
                let dist = Math.floor(Math.random()*4)+2;
                this.curr.a = 1; this.curr.b = -2*p; this.curr.c = p*p - (dist*dist/4);
                f = `y = x^2 ${this.fS(this.curr.b)}x ${this.fS(this.curr.c)}`;
                i = "x軸から切り取る線分の長さを求めよ。"; break;
            case 'k_top':
                let k = Math.floor(Math.random()*5)+1;
                f = `y = x^2 - 2kx + k^2 + ${k}k`;
                i = `頂点が直線 $y = 2x$ 上にあるときの $k$ の値を求めよ。`; break;
            case 'abs':
                f = `y = |x^2 - 4| + kx`;
                i = "kの値によってグラフの形がどう変わるか観察し、共有点の個数を考えよ。"; break;
        }

        document.getElementById('q-formula').innerHTML = `\\[ ${f} \\]`;
        document.getElementById('q-instr').innerHTML = i;
        this.curr.vals = {a,b,c,p,q};
        MathJax.typeset();
        this.draw();
    },

    check() {
        const eb = document.getElementById('expl-body');
        const {a,b,c,p,q,type} = this.curr.vals;
        let html = `<div class="step"><strong>1. 平方完成の実行:</strong><br>\\( y = ${a}(x ${-p>=0?'+':''}${-p})^2 ${q>=0?'+':''}${q} \\)</div>`;
        
        if(this.curr.type === 'range') {
            const r = this.curr.r;
            html += `<div class="step"><strong>2. 範囲の評価:</strong><br>軸 $x=${p}$ は範囲 $[${r[0]}, ${r[1]}]$ 内にある。端点の値 $f(${r[0]}), f(${r[1]})$ と頂点を比較する。</div>`;
        }
        
        document.getElementById('expl').style.display = 'block';
        eb.innerHTML = html;
        MathJax.typeset();
    },

    draw() {
        const ctx = document.getElementById('chart').getContext('2d');
        if(this.chart) this.chart.destroy();
        const data = [];
        for(let x=-8; x<=8; x+=0.05) {
            let y = this.curr.vals.a*x*x + this.curr.vals.b*x + this.curr.vals.c;
            if(this.curr.type === 'abs') y = Math.abs(x*x - 4) + 0.5*x;
            data.push({x, y});
        }
        this.chart = new Chart(ctx, {
            type: 'scatter',
            data: { datasets: [{ data, showLine: true, borderColor: '#c084fc', borderWidth: 2, pointRadius: 0 }] },
            options: { responsive: true, maintainAspectRatio: false, scales: { x: {min:-6, max:6}, y: {min:-6, max:10} }, plugins: { legend: {display:false} } }
        });
    },

    fmt(a,b,c) {
        let s = (a===1?"":a===-1?"-":a)+"x^2";
        if(b!==0) s += (b>0?"+":"")+(Math.abs(b)===1?(b>0?"":"-"):b)+"x";
        if(c!==0) s += (c>0?"+":"")+c;
        return s;
    },
    fS(n) { return n>=0? `+ ${n}` : `- ${Math.abs(n)}`; }
};
window.onload = () => core.gen('v');
</script>
</body>
</html>
