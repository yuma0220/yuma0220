<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- フォント完全一致 -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<title>二次関数嫌い</title>

<style>
body{font-family:'Inter',sans-serif;}
</style>
</head>

<body class="bg-gradient-to-br from-[#0b1f35] to-[#020617] text-white">

<h1 class="text-[22px] font-semibold px-6 py-5">📘 二次関数嫌い</h1>

<div class="grid lg:grid-cols-[260px_1fr_320px] gap-6 px-6 pb-10">

<!-- LEFT -->
<div class="space-y-6">

<div class="bg-white/5 border border-white/10 rounded-xl p-5 shadow-2xl backdrop-blur-xl">
<p class="mb-2 text-sm">名前を入力</p>
<input id="username" class="w-full p-3 rounded-lg bg-[#111827] outline-none">
<button onclick="start()" class="w-full mt-3 bg-green-500 hover:bg-green-600 transition p-3 rounded-lg">
開始
</button>
</div>

<div class="bg-white/5 border border-white/10 rounded-xl p-5">
<p class="text-sm">頂点 x = -b / 2a</p>
</div>

<div class="bg-purple-500/10 border border-purple-400 rounded-xl p-5">
<p class="text-sm">a > 0 → 最小</p>
<p class="text-sm">a < 0 → 最大</p>
<p class="text-sm">区間 → 端点＋頂点</p>
</div>

</div>

<!-- CENTER -->
<div class="space-y-6">

<div class="bg-white/5 border border-white/10 rounded-xl p-6 shadow-2xl backdrop-blur-xl">

<span class="bg-sky-500 text-xs px-3 py-1 rounded-full">
問題タイプ: normal
</span>

<div id="question" class="text-center text-[24px] font-semibold mt-6 mb-6 leading-relaxed"></div>

<div class="flex gap-3">
<input id="answer" class="flex-1 p-3 rounded-lg bg-[#111827] outline-none">
<button onclick="check()" class="bg-green-500 hover:bg-green-600 transition px-6 rounded-lg">
答える
</button>
</div>

<div class="mt-4 text-sm">
<p id="result">結果:</p>
<p id="score">スコア:0</p>
</div>

</div>

<div class="bg-white/5 border border-white/10 rounded-xl p-4">
<p class="mb-2 text-sm">二次関数のグラフ</p>
<canvas id="graph"></canvas>
</div>

</div>

<!-- RIGHT -->
<div class="space-y-6">

<div class="bg-white/5 border border-white/10 rounded-xl p-5">
<p class="text-sm mb-2">分析</p>
<p class="text-sm mb-3">basic (50%)</p>
<canvas id="chart"></canvas>
<button class="w-full mt-3 bg-green-500 hover:bg-green-600 transition p-3 rounded-lg">
弱点特訓モード
</button>
</div>

<div class="bg-white/5 border border-white/10 rounded-xl p-5">
<p class="text-sm">履歴</p>
<ul class="text-sm mt-2 space-y-1">
<li>● 正解 (basic)</li>
<li>● 不正解 (normal)</li>
</ul>
</div>

</div>

</div>

<script>
let a,b,c,correct,score=0;
let graphChart;

window.onload=start;

function start(){
generate();
}

function generate(){
a=Math.floor(Math.random()*3)+1;
b=Math.floor(Math.random()*11)-5;
c=Math.floor(Math.random()*6)-3;

correct=-b/(2*a);

document.getElementById("question").innerText =
`y = ${a}x² ${b>=0?'+':''}${b}x ${c>=0?'+':''}${c}
の頂点のx座標を求めよ`;

drawGraph();
}

function check(){
let ans=Number(document.getElementById("answer").value);
let ok=Math.abs(ans-correct)<0.5;

document.getElementById("result").innerText =
ok ? "正解！" : "不正解："+correct.toFixed(2);

score += ok ? 10 : -5;
document.getElementById("score").innerText="スコア:"+score;

generate();
}

function drawGraph(){
const ctx=document.getElementById("graph");

let data=[];
for(let x=-10;x<=10;x+=0.2){
data.push({x:x,y:a*x*x+b*x+c});
}

if(graphChart) graphChart.destroy();

graphChart=new Chart(ctx,{
type:'line',
data:{
datasets:[{
data:data,
borderColor:'#38bdf8',
pointRadius:0,
tension:0.25
}]
},
options:{
plugins:{legend:{display:false}},
scales:{
x:{
type:'linear',
grid:{color:'rgba(255,255,255,0.08)'},
ticks:{color:'#aaa'}
},
y:{
grid:{color:'rgba(255,255,255,0.08)'},
ticks:{color:'#aaa'}
}
}
}
});
}

new Chart(document.getElementById("chart"),{
type:'bar',
data:{
labels:['basic','normal','advanced'],
datasets:[{
data:[50,70,30],
backgroundColor:['#22c55e','#3b82f6','#a855f7'],
borderRadius:6
}]
},
options:{
plugins:{legend:{display:false}},
scales:{
y:{beginAtZero:true,max:100,ticks:{color:'#aaa'}},
x:{ticks:{color:'#aaa'}}
}
}
});
</script>

</body>
</html>
