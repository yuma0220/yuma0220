<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GIGA CORE 3,000,000: NO-LIBRARY EDITION</title>
    <style>
        :root {
            --bg: #000; --side: #0a0a0a; --card: #111;
            --accent: #00f2ff; --green: #39ff14; --ans: #ffcc00;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); color: #fff; font-family: sans-serif;
            height: 100vh; width: 100vw; overflow: hidden; display: flex; 
        }
        aside { 
            width: 240px; background: var(--side); border-right: 2px solid #222;
            display: flex; flex-direction: column; padding: 15px;
        }
        .nav-scroll { flex: 1; overflow-y: auto; }
        .cat { font-size: 0.7rem; color: #555; margin: 12px 0 5px; font-weight: bold; border-left: 2px solid var(--accent); padding-left: 8px; }
        .nav-btn { 
            width: 100%; padding: 10px; background: transparent; border: 1px solid #1a1a1a; 
            color: #777; text-align: left; cursor: pointer; margin-bottom: 4px; border-radius: 6px; font-size: 0.8rem;
        }
        .nav-btn.active { border-color: var(--accent); color: #fff; background: rgba(0,242,255,0.15); }
        main { flex: 1; display: flex; flex-direction: column; padding: 15px; gap: 12px; height: 100vh; }
        .p-card { 
            background: var(--card); border: 1px solid #333; border-radius: 12px; padding: 20px;
            display: flex; flex-direction: column; justify-content: center; height: 35%;
        }
        .math-row { font-size: 2.3rem; font-weight: 800; text-align: center; }
        .inst-row { font-size: 1.6rem; color: var(--accent); text-align: center; font-weight: 700; margin-top: 10px; }
        .sup { font-size: 0.6em; vertical-align: super; color: var(--green); }
        .btn-row { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; height: 50px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        .btn-gen { background: var(--accent); color: #000; }
        .btn-ans { background: #333; color: #fff; }
        .ans-box { margin-top: 10px; padding: 12px; background: rgba(255,204,0,0.1); border-radius: 6px; color: var(--ans); display: none; text-align: center; font-weight: bold; }
        .graph-box { flex: 1; background: #050505; border: 1px solid #222; border-radius: 12px; position: relative; }
        canvas { width: 100%; height: 100%; }
    </style>
</head>
<body>
<aside>
    <div style="color:var(--accent); font-weight:900; text-align:center; margin-bottom:15px;">GIGA CORE 3M</div>
    <div class="nav-scroll">
        <div class="cat">BASIC</div>
        <button class="nav-btn active" onclick="app.set('k_sq', this)">01. 頂点・平方完成</button>
        <button class="nav-btn" onclick="app.set('k_mv', this)">02. 平行移動</button>
        <button class="nav-btn" onclick="app.set('k_mm', this)">04. 最大最小</button>
        <button class="nav-btn" onclick="app.set('k_iq', this)">05. 二次不等式</button>
        <div class="cat">ELITE</div>
        <button class="nav-btn" onclick="app.set('a_mm', this)">07. 軸が動く最大最小</button>
        <button class="nav-btn" onclick="app.set('a_rp', this)">08. 解の配置</button>
        <button class="nav-btn" onclick="app.set('a_ab', this)">10. 絶対値と共有点</button>
        <button class="nav-btn" onclick="app.set('a_ar', this)">09. 通過領域</button>
    </div>
</aside>
<main>
    <div class="p-card">
        <div id="q-math" class="math-row"></div>
        <div id="q-inst" class="inst-row"></div>
        <div class="btn-row">
            <button class="btn btn-gen" onclick="app.gen()">GENERATION</button>
            <button class="btn btn-ans" onclick="app.toggle()">ANALYSIS</button>
        </div>
        <div id="ans-box" class="ans-box"></div>
    </div>
    <div class="graph-box"><canvas id="canvas"></canvas></div>
</main>
<script>
const app = {
    mode: 'k_sq',
    r: (n, m) => Math.floor(Math.random() * (m - n + 1)) + n,
    set(m, el) {
        this.mode = m;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        this.gen();
    },
    toggle() {
        const b = document.getElementById('ans-box');
        b.style.display = (b.style.display === 'block') ? 'none' : 'block';
    },
    engines: {
        k_sq: () => {
            let a = app.r(1, 2), b = app.r(-6, 6), c = app.r(-4, 4);
            return { q: `y = ${a==1?'':a}x<span class="sup">2</span>${b>=0?'+':''}${b}x${c>=0?'+':''}${c}`, i: "の頂点を求めよ。", a: `(${ -b/(2*a) }, ${ (4*a*c-b*b)/(4*a) })`, cfg: {a, b, c} };
        },
        k_mv: () => ({ q: "y = x<span class="sup">2</span> を x軸:+2, y軸:-1 移動", i: "した式を求めよ。", a: "y = (x-2)² - 1", cfg: {a:1, b:-4, c:3} }),
        k_mm: () => ({ q: "y = x<span class="sup">2</span>-4x+5 (0≦x≦3)", i: "の最大最小は？", a: "最大:5, 最小:1", cfg: {a:1, b:-4, c:5} }),
        k_iq: () => ({ q: "x<span class="sup">2</span>-5x+6 ≦ 0", i: "の解を求めよ。", a: "2 ≦ x ≦ 3", cfg: {a:1, b:-5, c:6} }),
        a_mm: () => ({ q: "y = x<span class="sup">2</span>-2ax+4 (0≦x≦2)", i: "の最小値を a で表せ。", a: "a<0:4, 0≦a≦2:4-a², a>2:8-4a", cfg: {a:1, b:-2, c:4} }),
        a_rp: () => ({ q: "x<span class="sup">2</span>-2ax+a+6=0", i: "が x>2 で2解をもつ a の範囲？", a: "3 < a < 10", cfg: {a:1, b:-6, c:10} }),
        a_ab: () => ({ q: "y = |x<span class="sup">2</span>-4x+3|", i: "y=1 との共有点個数は？", a: "3個", cfg: {a:1, b:-4, c:3, abs:true, kv:1} }),
        a_ar: () => ({ q: "y = 2mx - m<span class="sup">2</span> (0≦m≦1)", i: "の通過領域を求めよ。", a: "y ≦ x² など", cfg: {area: true} })
    },
    gen() {
        const res = (this.engines[this.mode] || this.engines.k_sq)();
        document.getElementById('q-math').innerHTML = res.q;
        document.getElementById('q-inst').innerText = res.i;
        document.getElementById('ans-box').innerHTML = `ANS: ${res.a}`;
        document.getElementById('ans-box').style.display = 'none';
        this.draw(res.cfg);
    },
    draw(cfg) {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const w = canvas.width = canvas.offsetWidth;
        const h = canvas.height = canvas.offsetHeight;
        ctx.clearRect(0, 0, w, h);

        const scale = 40;
        const ox = w/2; const oy = h/2 + 50;

        // 軸の描画 (白の太線)
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(w, oy); ctx.stroke(); // x
        ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, h); ctx.stroke(); // y

        // グリッド
        ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
        for(let i=-10; i<=10; i++) {
            ctx.beginPath(); ctx.moveTo(ox+i*scale, 0); ctx.lineTo(ox+i*scale, h); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, oy-i*scale); ctx.lineTo(w, oy-i*scale); ctx.stroke();
        }

        // グラフ
        ctx.strokeStyle = '#39ff14'; ctx.lineWidth = 4;
        ctx.beginPath();
        for(let px=0; px<w; px++) {
            let x = (px - ox) / scale;
            let y;
            if (cfg.area) {
                // 通過領域の簡易描画(境界線)
                y = x * x;
            } else {
                y = (cfg.a||1)*x*x + (cfg.b||0)*x + (cfg.c||0);
                if (cfg.abs) y = Math.abs(y);
            }
            let py = oy - y * scale;
            if (px === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();

        if (cfg.kv) {
            ctx.strokeStyle = '#f0f'; ctx.lineWidth = 2; ctx.setLineDash([5,5]);
            ctx.beginPath(); ctx.moveTo(0, oy-cfg.kv*scale); ctx.lineTo(w, oy-cfg.kv*scale); ctx.stroke();
            ctx.setLineDash([]);
        }
    }
};
window.onload = () => app.gen();
window.onresize = () => app.gen();
</script>
</body>
</html>
