<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>GIGA CORE 3000: FINAL STABLE</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #000; --side: #0a0a0a; --accent: #00f2ff;
            --green: #39ff14; --pink: #ff00ff; --text: #fff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); color: var(--text); font-family: sans-serif;
            height: 100vh; width: 100vw; overflow: hidden; display: flex; 
        }

        aside { 
            width: 220px; background: var(--side); border-right: 1px solid #333;
            display: flex; flex-direction: column; padding: 10px;
        }
        .nav-btn { 
            width: 100%; padding: 10px; background: transparent; border: 1px solid #222; 
            color: #888; text-align: left; cursor: pointer; margin-bottom: 4px; border-radius: 4px; font-size: 0.8rem;
        }
        .nav-btn.active { border-color: var(--accent); color: #fff; background: rgba(0,242,255,0.1); }
        .cat { font-size: 0.7rem; color: #555; margin: 10px 0 5px; padding-left: 5px; border-left: 2px solid var(--accent); }

        main { flex: 1; display: flex; flex-direction: column; padding: 15px; gap: 10px; height: 100vh; }

        .p-card { 
            background: #0d0d0d; border: 1px solid #222; border-radius: 12px; padding: 20px;
            display: flex; flex-direction: column; justify-content: center; min-height: 200px;
        }
        .math-row { font-size: 2.2rem; font-weight: bold; text-align: center; margin-bottom: 10px; }
        .inst-row { font-size: 1.6rem; color: var(--accent); text-align: center; font-weight: bold; }
        .sup { font-size: 0.6em; vertical-align: super; color: var(--green); }

        .btn-row { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; height: 50px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .btn-gen { background: var(--accent); color: #000; }
        .btn-ans { background: #222; color: #fff; }

        .ans-box { 
            margin-top: 10px; padding: 10px; border: 1px dashed #ffcc00; color: #ffcc00; 
            display: none; text-align: center; font-size: 1.2rem; font-weight: bold;
        }

        .graph-box { flex: 1; background: #050505; border: 1px solid #222; border-radius: 12px; position: relative; }
        canvas { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>

<aside>
    <div style="text-align:center; color:var(--accent); font-weight:bold; margin-bottom:10px;">KYOTO GIGA</div>
    <div class="cat">BASIC</div>
    <button class="nav-btn active" onclick="app.set('k_square', this)">01. 頂点</button>
    <button class="nav-btn" onclick="app.set('k_move', this)">02. 平行移動</button>
    <button class="nav-btn" onclick="app.set('k_maxmin', this)">04. 最大最小</button>
    <button class="nav-btn" onclick="app.set('k_ineq', this)">05. 不等式</button>
    <div class="cat">ELITE</div>
    <button class="nav-btn" onclick="app.set('a_maxmin', this)">07. 軸が動く</button>
    <button class="nav-btn" onclick="app.set('a_root_pos', this)">08. 解の配置</button>
    <button class="nav-btn" onclick="app.set('a_abs', this)">10. 絶対値</button>
    <button class="nav-btn" onclick="app.set('a_area', this)">09. 通過領域</button>
</aside>

<main>
    <div class="p-card">
        <div id="q-math" class="math-row"></div>
        <div id="q-inst" class="inst-row"></div>
        <div class="btn-row">
            <button class="btn btn-gen" onclick="app.gen()">PROBLEM GENERATE</button>
            <button class="btn btn-ans" onclick="app.toggle()">ANALYSIS</button>
        </div>
        <div id="ans-box" class="ans-box"></div>
    </div>
    <div class="graph-box"><canvas id="chart"></canvas></div>
</main>

<script>
const app = {
    mode: 'k_square', chart: null,
    r: (n, m) => Math.floor(Math.random() * (m - n + 1)) + n,

    set(m, el) {
        this.mode = m;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        this.gen();
    },

    toggle() {
        const b = document.getElementById('ans-box');
        b.style.display = (b.style.display === 'block') ? 'none' : 'block';
    },

    engines: {
        k_square: () => {
            let a = app.r(1, 2), b = app.r(-6, 6), c = app.r(-4, 4);
            return { q: `y = ${a==1?'':a}x<span class="sup">2</span>${b>=0?'+':''}${b}x${c>=0?'+':''}${c}`, i: "の頂点を求めよ。", a: `頂点: (${-b/(2*a)}, ${(4*a*c-b*b)/(4*a)})`, cfg: {a, b, c} };
        },
        k_move: () => {
            let mx = app.r(-3, 3), my = app.r(-3, 3);
            return { q: `y = x<span class="sup">2</span> を x軸:${mx}, y軸:${my} 移動`, i: "した後の式を求めよ。", a: `y = (x${-mx>=0?'+':''}${-mx})² ${my>=0?'+':''}${my}`, cfg: {a:1, b:-2*mx, c:mx*mx+my} };
        },
        k_maxmin: () => ({ q: "y = x<span class="sup">2</span> - 4x + 1 (0 ≦ x ≦ 3)", i: "の最大・最小を求めよ。", a: "最大 1 (x=0), 最小 -3 (x=2)", cfg: {a:1, b:-4, c:1} }),
        k_ineq: () => ({ q: "x<span class="sup">2</span> - 4x + 3 ≦ 0", i: "の解を求めよ。", a: "1 ≦ x ≦ 3", cfg: {a:1, b:-4, c:3} }),
        a_maxmin: () => {
            let c = app.r(2, 5);
            return { q: `y = x<span class="sup">2</span> - 2ax + ${c}`, i: "0 ≦ x ≦ 2 での最小値を求めよ。", a: "a<0: c | 0≦a≦2: c-a² | a>2: c+4-4a", cfg: {a:1, b:-2, c:c} };
        },
        a_root_pos: () => {
            let k = app.r(2, 5);
            return { q: `x<span class="sup">2</span> - 2ax + ${k} = 0`, i: "x > 1 で2つの実数解をもつ a の範囲は？", a: `√${k} < a < ${(k+1)/2}`, cfg: {a:1, b:-4, c:k} };
        },
        a_abs: () => {
            let k = app.r(1, 2);
            return { q: `y = |x<span class="sup">2</span> - 4x + 3|`, i: `y = ${k} との共有点の個数は？`, a: `${k==1?3:2} 個`, cfg: {a:1, b:-4, c:3, abs:true, k:k} };
        },
        a_area: () => ({ q: `y = 2mx - m<span class="sup">2</span> (0 ≦ m ≦ 1)`, i: "の通過領域を求めよ。", a: "境界 y=x², y=2x-1 の間", cfg: {area: true} })
    },

    gen() {
        const res = (this.engines[this.mode] || this.engines.k_square)();
        document.getElementById('q-math').innerHTML = res.q;
        document.getElementById('q-inst').innerText = res.i;
        document.getElementById('ans-box').innerHTML = res.a;
        document.getElementById('ans-box').style.display = 'none';
        this.draw(res.cfg);
    },

    draw(cfg) {
        const ctx = document.getElementById('chart').getContext('2d');
        if (this.chart) this.chart.destroy();
        let ds = [];
        if (cfg.area) {
            for(let m=0; m<=1; m+=0.1) {
                let d = []; for(let x=-1; x<=3; x+=0.1) d.push({x, y: 2*m*x - m*m});
                ds.push({ data: d, showLine: true, borderColor: `rgba(0, 242, 255, 0.4)`, borderWidth: 1, pointRadius: 0 });
            }
        } else {
            let d = []; for(let x=-8; x<=8; x+=0.1) {
                let y = (cfg.a||1)*x*x + (cfg.b||0)*x + (cfg.c||0);
                if (cfg.abs) y = Math.abs(y);
                d.push({x, y});
            }
            ds.push({ data: d, showLine: true, borderColor: '#39ff14', borderWidth: 4, pointRadius: 0 });
            if (cfg.k) ds.push({ data: [{x:-10, y:cfg.k}, {x:10, y:cfg.k}], showLine: true, borderColor: '#ff00ff', borderDash: [5,5], borderWidth: 2, pointRadius: 0 });
        }

        this.chart = new Chart(ctx, {
            type: 'scatter',
            data: { datasets: ds },
            options: {
                responsive: true, maintainAspectRatio: false, animation: false,
                scales: {
                    x: { min: -4, max: 6, position: 'center', grid: { color: '#444', lineWidth: (c) => c.tick.value===0?3:1 }, ticks: { color: '#888' } },
                    y: { min: -3, max: 8, position: 'center', grid: { color: '#444', lineWidth: (c) => c.tick.value===0?3:1 }, ticks: { color: '#888' } }
                },
                plugins: { legend: { display: false } }
            }
        });
    }
};
window.onload = () => app.gen();
</script>
</body>
</html>
