<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIGA CORE 3M: INFINITY</title>
    <style>
        :root {
            --bg: #050505; --side: #0a0a0c; --accent: #00f2ff; /* シアンネオン */
            --magenta: #ff00ff; --text: #e0e0e0; --grid: #1a1a1f;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; overflow: hidden; }
        
        /* Neon UI Elements */
        aside { width: 280px; background: var(--side); border-right: 1px solid #333; display: flex; flex-direction: column; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
        aside.collapsed { transform: translateX(-280px); position: absolute; }
        .nav-head { padding: 30px 20px; font-weight: 900; color: var(--accent); font-size: 1.4rem; letter-spacing: 2px; text-shadow: 0 0 10px var(--accent); }
        .nav-scroll { flex: 1; overflow-y: auto; padding: 0 15px; }
        .cat { font-size: 0.7rem; color: #555; margin: 20px 0 10px; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid #222; }
        .nav-btn { width: 100%; padding: 12px; background: none; border: 1px solid transparent; color: #888; text-align: left; cursor: pointer; border-radius: 4px; font-size: 0.85rem; margin-bottom: 5px; transition: 0.3s; }
        .nav-btn:hover { color: #fff; border-color: #444; }
        .nav-btn.active { color: var(--accent); border-color: var(--accent); background: rgba(0,242,255,0.05); box-shadow: inset 0 0 10px rgba(0,242,255,0.1); text-shadow: 0 0 5px var(--accent); }

        main { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 15px; position: relative; min-width: 0; }
        .menu-trigger { position: absolute; left: 10px; top: 10px; z-index: 101; cursor: pointer; background: #111; color: var(--accent); border: 1px solid var(--accent); padding: 5px 12px; border-radius: 20px; font-size: 0.7rem; box-shadow: 0 0 10px var(--accent); }

        /* Problem Card Neon */
        .p-card { background: rgba(15,15,20,0.8); border: 1px solid #333; border-radius: 12px; padding: 25px; min-height: 38%; display: flex; flex-direction: column; backdrop-filter: blur(10px); }
        .math-row { font-size: 2rem; font-weight: 800; text-align: center; color: #fff; margin: 15px 0; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
        .inst-row { font-size: 1.1rem; color: var(--magenta); text-align: center; font-weight: 600; text-shadow: 0 0 10px var(--magenta); }
        .btn-row { display: flex; gap: 15px; margin-top: auto; }
        .btn { flex: 1; height: 50px; border-radius: 6px; border: 1px solid #444; cursor: pointer; font-weight: 800; transition: 0.3s; background: #000; color: #888; text-transform: uppercase; }
        .btn-gen { border-color: var(--accent); color: var(--accent); }
        .btn-gen:hover { background: var(--accent); color: #000; box-shadow: 0 0 20px var(--accent); }
        .btn-ans { border-color: var(--magenta); color: var(--magenta); }
        .btn-ans:hover { background: var(--magenta); color: #000; box-shadow: 0 0 20px var(--magenta); }
        .ans-box { margin-top: 15px; padding: 15px; background: #000; border: 1px solid #444; color: #aaa; display: none; font-size: 0.9rem; line-height: 1.6; border-left: 3px solid var(--accent); }

        /* Graph Canvas Neon */
        .graph-box { flex: 1; background: #000; border-radius: 12px; position: relative; overflow: hidden; border: 1px solid #222; }
        canvas { width: 100%; height: 100%; }
        .controls { position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.8); border: 1px solid #333; padding: 15px; border-radius: 10px; width: 220px; }
        .ctrl-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
        .ctrl-row label { font-size: 0.6rem; color: var(--accent); font-weight: bold; }
        input[type=range] { accent-color: var(--accent); }
    </style>
</head>
<body>

<div class="menu-trigger" id="menuToggle">CORE_OS_v3M</div>

<aside id="sidebar">
    <div class="nav-head">INFINITY_CORE</div>
    <div class="nav-scroll">
        <div class="cat">Quadratic (I/A)</div>
        <button class="nav-btn active" data-mode="q1">文字係数の平方完成</button>
        <button class="nav-btn" data-mode="q2">動く区間の最大最小</button>
        <button class="nav-btn" data-mode="q3">解の配置(多重制約)</button>
        <button class="nav-btn" data-mode="q4">格子点計数アルゴリズム</button>

        <div class="cat">Advanced (II/B)</div>
        <button class="nav-btn" data-mode="a1">通過領域と包絡線</button>
        <button class="nav-btn" data-mode="a2">絶対値の多重折り畳み</button>
        <button class="nav-btn" data-mode="a3">指数関数の爆発的変化</button>
        <button class="nav-btn" data-mode="a4">対数関数の漸近線</button>
        <button class="nav-btn" data-mode="a5">三角関数の干渉波形</button>

        <div class="cat">Divine (III/C)</div>
        <button class="nav-btn" data-mode="d1">二次曲線の接線と法線</button>
        <button class="nav-btn" data-mode="d2">放物線と直線の面積(1/6)</button>
        <button class="nav-btn" data-mode="d3">頂点の軌跡連鎖</button>
    </div>
</aside>

<main>
    <div class="p-card">
        <div id="q-math" class="math-row"></div>
        <div id="q-inst" class="inst-row"></div>
        <div class="btn-row">
            <button class="btn btn-gen" id="genBtn">EXEC_GENERATE</button>
            <button class="btn btn-ans" id="ansBtn">LOGIC_TRACE</button>
        </div>
        <div id="ans-box" class="ans-box"></div>
    </div>
    <div class="graph-box">
        <canvas id="mainCanvas"></canvas>
        <div class="controls">
            <div class="ctrl-row">
                <label>PARAM_α: <span id="labelA">1.0</span></label>
                <input type="range" id="inputA" min="-5" max="5" step="0.1" value="1">
            </div>
            <div class="ctrl-row">
                <label>PARAM_β: <span id="labelB">0.0</span></label>
                <input type="range" id="inputB" min="-5" max="5" step="0.1" value="0">
            </div>
            <div style="font-size:0.5rem; color:#444; text-align:right;">TRACE_SYSTEM_ACTIVE</div>
        </div>
    </div>
</main>

<script>
const InfinityApp = {
    mode: 'q1', paramA: 1.0, paramB: 0.0,
    history: [], // 残像用

    init() {
        this.dom = {
            sidebar: document.getElementById('sidebar'),
            menuToggle: document.getElementById('menuToggle'),
            navBtns: document.querySelectorAll('.nav-btn'),
            qMath: document.getElementById('q-math'),
            qInst: document.getElementById('q-inst'),
            ansBox: document.getElementById('ans-box'),
            genBtn: document.getElementById('genBtn'),
            ansBtn: document.getElementById('ansBtn'),
            canvas: document.getElementById('mainCanvas'),
            inputA: document.getElementById('inputA'),
            inputB: document.getElementById('inputB'),
            labelA: document.getElementById('labelA'),
            labelB: document.getElementById('labelB')
        };
        this.ctx = this.dom.canvas.getContext('2d');
        this.bindEvents();
        this.gen();
    },

    bindEvents() {
        this.dom.menuToggle.onclick = () => this.dom.sidebar.classList.toggle('collapsed');
        this.dom.genBtn.onclick = () => { this.history = []; this.gen(); };
        this.dom.ansBtn.onclick = () => this.dom.ansBox.style.display = this.dom.ansBox.style.display === 'block' ? 'none' : 'block';
        
        this.dom.navBtns.forEach(btn => {
            btn.onclick = (e) => {
                this.dom.navBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                this.mode = e.target.dataset.mode;
                this.history = [];
                this.gen();
            };
        });

        const update = () => {
            this.paramA = parseFloat(this.dom.inputA.value);
            this.paramB = parseFloat(this.dom.inputB.value);
            this.dom.labelA.innerText = this.paramA.toFixed(1);
            this.dom.labelB.innerText = this.paramB.toFixed(1);
            this.render();
        };
        this.dom.inputA.oninput = update;
        this.dom.inputB.oninput = update;
        window.onresize = () => this.render();
    },

    engines: {
        q1: () => ({ q: "y = x² - 2ax + a² + 2a", i: "頂点の座標を a で表せ。", a: "頂点 (a, 2a)" }),
        q2: () => ({ q: "y = x² - 4x + 5 (a ≦ x ≦ a+2)", i: "最大値 M(a) が 10 となる a は？", a: "軸 x=2 と区間中央 a+1 の比較。" }),
        q3: () => ({ q: "x² - 2ax + 3a = 0 (1 < x < 3)", i: "異なる2解を持つ a の範囲？", a: "D>0, 1<軸<3, f(1)>0, f(3)>0" }),
        q4: () => ({ q: "y ≧ x², y ≦ ax + b", i: "領域内の格子点(整数点)の個数を算出せよ。", a: "Σ(floor(upper_y) - ceil(lower_y) + 1)" }),
        a1: () => ({ q: "y = 2ax - a² (0 ≦ a ≦ 1)", i: "通過領域の境界線を求めよ。", a: "y ≦ x² (0≦x≦1) 等。" }),
        a2: () => ({ q: "y = | |x² - a| - b |", i: "共有点が 6 個となる条件を追え。", a: "W型の極大・極小値の関係。" }),
        a3: () => ({ q: "y = a^x (指数関数)", i: "底 a が変化する時の変化率を追え。", a: "a > 1 で単調増加、0 < a < 1 で単調減少。" }),
        a4: () => ({ q: "y = log_a(x + b)", i: "漸近線の位置と a の関係を調べよ。", a: "x = -b が漸近線。" }),
        a5: () => ({ q: "y = a sin(bx)", i: "振幅 a と周期の関係を可視化せよ。", a: "周期 T = 2π/b" }),
        d1: () => ({ q: "x²/a² + y²/b² = 1", i: "楕円上の点における接線を求めよ。", a: "接公式: x1x/a² + y1y/b² = 1" }),
        d2: () => ({ q: "y = x² - 4, y = -x² + 4", i: "囲まれた面積の最小値を算出せよ。", a: "S = 1/6|a-a'|(β-α)³" }),
        d3: () => ({ q: "y = x² - 2ax + a² + a", i: "頂点の軌跡を求めよ。", a: "y = x" })
    },

    gen() {
        const res = this.engines[this.mode]();
        this.dom.qMath.innerHTML = res.q;
        this.dom.qInst.innerText = res.i;
        this.dom.ansBox.innerHTML = `[LOGIC_DECODED]: ${res.a}`;
        this.dom.ansBox.style.display = 'none';
        this.render();
    },

    render() {
        const { canvas, ctx } = this;
        const w = canvas.width = canvas.offsetWidth;
        const h = canvas.height = canvas.offsetHeight;
        const s = 45, ox = w/2, oy = h/2 + 50;

        // 描画設定を保存して残像を作る
        this.history.push({ a: this.paramA, b: this.paramB });
        if(this.history.length > 15) this.history.shift();

        ctx.clearRect(0, 0, w, h);
        
        // Neon Grid
        ctx.strokeStyle = '#111'; ctx.lineWidth = 1;
        for(let i=-20; i<=20; i++) {
            ctx.beginPath(); ctx.moveTo(ox+i*s, 0); ctx.lineTo(ox+i*s, h); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, oy-i*s); ctx.lineTo(w, oy-i*s); ctx.stroke();
        }
        ctx.strokeStyle = '#222'; ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(w, oy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, h); ctx.stroke();

        // Trace (残像)
        this.history.forEach((his, index) => {
            ctx.strokeStyle = `rgba(0, 242, 255, ${index * 0.05})`;
            ctx.lineWidth = 1;
            this.drawPlot(ctx, his.a, his.b, ox, oy, s, w);
        });

        // Active Plot
        ctx.strokeStyle = '#00f2ff';
        ctx.lineWidth = 3;
        ctx.shadowBlur = 15; ctx.shadowColor = '#00f2ff';
        this.drawPlot(ctx, this.paramA, this.paramB, ox, oy, s, w);
        ctx.shadowBlur = 0;
    },

    drawPlot(ctx, a, b, ox, oy, s, w) {
        ctx.beginPath();
        for(let i=0; i<w; i+=2) {
            let x = (i-ox)/s, y = 0;
            switch(this.mode) {
                case 'q1': case 'q2': case 'q3': case 'd3': y = x*x - 2*a*x + a*a; break;
                case 'q4': y = x*x; this.drawLat(ctx, ox, oy, s, a, b); break;
                case 'a1': y = 2*a*x - a*a; break;
                case 'a2': y = Math.abs(Math.abs(x*x - a) - Math.abs(b)); break;
                case 'a3': y = Math.pow(Math.abs(a)+0.1, x); break;
                case 'a4': y = (x+b > 0) ? Math.log(x+b)/Math.log(Math.abs(a)+1.1) : -10; break;
                case 'a5': y = a * Math.sin(b * x); break;
                case 'd1': // 楕円
                    ctx.save(); ctx.beginPath(); ctx.strokeStyle='rgba(255,0,255,0.5)';
                    for(let t=0; t<7; t+=0.1) {
                        let ex = ox + Math.cos(t)*Math.abs(a)*s;
                        let ey = oy - Math.sin(t)*Math.abs(b)*s;
                        if(t===0) ctx.moveTo(ex, ey); else ctx.lineTo(ex, ey);
                    }
                    ctx.stroke(); ctx.restore(); y=-10; break;
                case 'd2': y = x*x - 4; break;
                default: y = a*x*x + b;
            }
            let py = oy - y*s;
            if(i===0) ctx.moveTo(i, py); else ctx.lineTo(i, py);
        }
        ctx.stroke();
    },

    drawLat(ctx, ox, oy, s, a, b) {
        ctx.fillStyle = '#ff00ff';
        for(let x=-3; x<=3; x++) for(let y=-1; y<=5; y++) {
            if(y >= x*x - 0.1 && y <= a*x + b + 2) {
                ctx.beginPath(); ctx.arc(ox+x*s, oy-y*s, 2, 0, 7); ctx.fill();
            }
        }
    }
};

document.addEventListener('DOMContentLoaded', () => InfinityApp.init());
</script>
</body>
</html>
