<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>2次関数：Lv.100 Ultimate Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #020617; --card: #0f172a; --accent: #c026d3; --text: #f8fafc; --glass: rgba(255,255,255,0.05); }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; display: flex; height: 100vh; }
        
        /* サイドバー */
        aside { width: 340px; background: #020617; border-right: 1px solid #1e293b; padding: 25px; overflow-y: auto; }
        .lvl-tag { font-size: 0.7rem; background: var(--accent); color: white; padding: 2px 6px; border-radius: 4px; margin-right: 8px; }
        .lvl-h { color: #64748b; font-size: 0.75rem; letter-spacing: 2px; margin: 30px 0 10px; text-transform: uppercase; border-bottom: 1px solid #1e293b; }
        .q-btn { width: 100%; text-align: left; padding: 14px; background: var(--glass); border: 1px solid transparent; color: #94a3b8; cursor: pointer; border-radius: 10px; font-size: 0.85rem; margin-bottom: 6px; transition: 0.3s; }
        .q-btn:hover { background: #1e293b; color: white; border-color: var(--accent); }
        .q-btn.active { background: linear-gradient(135deg, #c026d3, #7c3aed); color: white; font-weight: bold; }

        /* メイン */
        main { flex: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .p-card { background: var(--card); border-radius: 20px; padding: 40px; border: 1px solid #1e293b; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .math-box { font-size: 2.2rem; text-align: center; margin: 30px 0; padding: 30px; background: rgba(0,0,0,0.4); border-radius: 15px; border: 1px solid #334155; }
        .instr { font-size: 1.2rem; line-height: 1.6; margin-bottom: 25px; border-left: 6px solid var(--accent); padding-left: 20px; }
        
        .ai-expl { background: #1e293b; border-radius: 15px; padding: 30px; display: none; margin-bottom: 20px; }
        .step-b { color: var(--accent); font-weight: bold; font-size: 1.1rem; border-bottom: 1px solid #334155; margin: 20px 0 10px; padding-bottom: 5px; }
        
        /* 実験室スライダー */
        .lab-panel { display: flex; gap: 20px; background: #0f172a; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px dashed var(--accent); }
        .lab-ctrl { flex: 1; }
        input[type=range] { width: 100%; accent-color: var(--accent); }

        .chart-box { flex: 1; min-height: 450px; background: #000; border-radius: 20px; border: 1px solid #1e293b; overflow: hidden; }
        .btn-row { display: flex; gap: 15px; }
        .btn-main { flex: 1; padding: 20px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .btn-p { background: var(--accent); color: white; }
        .btn-s { background: #334155; color: white; }
    </style>
</head>
<body>

<aside>
    <h2 style="background: linear-gradient(to right, #f472b6, #c026d3); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.8rem; margin: 0;">Lv.100 Studio</h2>
    
    <div class="lvl-h">Lv.1-20 基礎マスター</div>
    <button class="q-btn active" id="btn-v" onclick="app.select('v')"><span class="lvl-tag">01</span>頂点・軸の完全解析</button>
    <button class="q-btn" id="btn-m" onclick="app.select('m')"><span class="lvl-tag">15</span>移動・対称・回転の理</button>

    <div class="lvl-h">Lv.21-50 応用・最大最小</div>
    <button class="q-btn" id="btn-r" onclick="app.select('r')"><span class="lvl-tag">35</span>動く定義域と最大最小</button>
    <button class="q-btn" id="btn-l" onclick="app.select('l')"><span class="lvl-tag">45</span>x軸の切り取る線分</button>

    <div class="lvl-h">Lv.51-80 思考力・数式</div>
    <button class="q-btn" id="btn-abs" onclick="app.select('abs')"><span class="lvl-tag">65</span>絶対値関数の境界問題</button>
    <button class="q-btn" id="btn-p" onclick="app.select('p')"><span class="lvl-tag">78</span>主役交代 (xとpの双対性)</button>

    <div class="lvl-h">Lv.81-100 極致・融合</div>
    <button class="q-btn" id="btn-sign" onclick="app.select('sign')"><span class="lvl-tag">85</span>解の配置：3条件の連立</button>
    <button class="q-btn" id="btn-lab" onclick="app.select('lab')"><span class="lvl-tag">99</span>究極：Sandbox実験室</button>
</aside>

<main>
    <div id="lab-ui" class="lab-panel" style="display:none;">
        <div class="lab-ctrl">a: <input type="range" id="sl-a" min="-5" max="5" step="0.1" value="1" oninput="app.labUpdate()"> <span id="v-a">1</span></div>
        <div class="lab-ctrl">b: <input type="range" id="sl-b" min="-10" max="10" step="0.1" value="0" oninput="app.labUpdate()"> <span id="v-b">0</span></div>
        <div class="lab-ctrl">c: <input type="range" id="sl-c" min="-10" max="10" step="0.1" value="0" oninput="app.labUpdate()"> <span id="v-c">0</span></div>
    </div>

    <div class="p-card">
        <div id="q-instr" class="instr"></div>
        <div id="q-formula" class="math-box"></div>
        <div class="btn-row">
            <button class="btn-main btn-p" onclick="app.showExpl()">AI完全解説を表示</button>
            <button class="btn-main btn-s" onclick="app.reload()">新数値を生成</button>
        </div>
    </div>

    <div id="expl" class="ai-expl"></div>
    <div class="chart-box"><canvas id="mainChart"></canvas></div>
</main>

<script>
const app = {
    mode: 'v',
    current: {},
    chart: null,

    // 数式生成エンジン (1x, 0x を排除)
    fmt(a, b, c, var_x = 'x') {
        let s = "";
        const clean = (val, power) => {
            if (val === 0) return "";
            let res = val > 0 ? (s ? "+" : "") : "-";
            let v = Math.abs(val);
            if (v !== 1 || power === 0) res += v;
            if (power > 0) res += var_x;
            if (power > 1) res += "^" + power;
            return res;
        };
        s += clean(a, 2);
        s += clean(b, 1);
        s += clean(c, 0);
        return s || "0";
    },

    r(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; },

    select(m) {
        this.mode = m;
        document.querySelectorAll('.q-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + m).classList.add('active');
        document.getElementById('lab-ui').style.display = (m === 'lab') ? 'flex' : 'none';
        this.reload();
    },

    async reload() {
        document.getElementById('expl').style.display = 'none';
        let f = "", i = "", e = "", g = {a:1, b:0, c:0, abs:false};
        const a = (this.r(1, 2)) * (Math.random() > 0.5 ? 1 : -1);
        const p = this.r(-3, 3); const q = this.r(-3, 3);

        if (this.mode === 'lab') {
            i = "【サンドボックス】スライダーを動かして、グラフの形状・頂点の変化を観察しましょう。";
            this.labUpdate();
            return;
        }

        switch(this.mode) {
            case 'v':
                g = {a, b:-2*a*p, c:a*p*p+q};
                f = "f(x) = " + this.fmt(g.a, g.b, g.c);
                i = "頂点の座標、軸の方程式を求め、グラフを描け。";
                e = `<div class="step-b">Step 1: 平方完成</div> $f(x) = ${a}(x ${p>=0?'-':'+'}${Math.abs(p)})^2 ${q>=0?'+':'-'}${Math.abs(q)}$ <div class="step-b">Step 2: 解析</div> 頂点 $(${p}, ${q})$、軸 $x=${p}$。`;
                break;
            case 'abs':
                const av = [1, 4, 9][this.r(0,2)];
                f = "f(x) = |x^2 - " + av + "|";
                i = "このグラフと直線 y = k が異なる4個の共有点をもつとき、定数 k の値の範囲を求めよ。";
                e = `<div class="step-b">1. グラフの描画</div> $x$ 軸より下の部分を上に折り返します。<div class="step-b">2. 境界の発見</div> 直線が $x$ 軸 ($k=0$) より上で、山の頂点 ($k=${av}$) より下のとき、共有点は4個になります。結論： $0 < k < ${av}$。`;
                g = {a:1, b:0, c:-av, abs:true};
                break;
            case 'p':
                f = "f(x) = x^2 - 2px - p^2 + 2p - 1";
                i = "実数 p がどの値をとっても f(x) < 0 となる x の値の範囲を求めよ。(例題78)";
                e = `<div class="step-b">1. 主役の交代</div> $p$ について整理： $g(p) = -p^2 + 2(1-x)p + (x^2-1)$ <div class="step-b">2. 条件解析</div> $g(p)$ が常に負 ⇔ $p$ の 2次関数の判別式 $D < 0$ <div class="step-b">3. 計算</div> $D/4 = (1-x)^2 + (x^2-1) = 2x^2 - 2x < 0$ より $0 < x < 1$。`;
                g = {a:1, b:-2, c:0};
                break;
            case 'sign':
                const x1 = this.r(1, 3); const x2 = this.r(4, 6);
                f = "x^2 - " + (x1+x2) + "x + (m-1) = 0";
                i = "2つの解がともに 2 より大きいとき、定数 m の範囲を求めよ。";
                e = `<div class="step-b">思考の3本柱</div> 1. 判別式 $D \ge 0$<br>2. 軸 $x = \frac{k1+k2}{2} > 2$<br>3. 端点 $f(2) > 0$`;
                g = {a:1, b:-(x1+x2), c:x1*x2};
                break;
        }

        this.current = {f, i, e, g};
        this.updateUI();
    },

    labUpdate() {
        const a = parseFloat(document.getElementById('sl-a').value);
        const b = parseFloat(document.getElementById('sl-b').value);
        const c = parseFloat(document.getElementById('sl-c').value);
        document.getElementById('v-a').innerText = a;
        document.getElementById('v-b').innerText = b;
        document.getElementById('v-c').innerText = c;
        
        const f = "y = " + this.fmt(a, b, c);
        document.getElementById('q-formula').innerHTML = "\\[ " + f + " \\]";
        MathJax.typesetPromise();
        this.draw(a, b, c);
    },

    updateUI() {
        document.getElementById('q-instr').innerText = this.current.i;
        document.getElementById('q-formula').innerHTML = "\\[ " + this.current.f + " \\]";
        MathJax.typesetPromise();
        this.draw(this.current.g.a, this.current.g.b, this.current.g.c, this.current.g.abs);
    },

    showExpl() {
        const el = document.getElementById('expl');
        el.innerHTML = "<h3 style='margin:0; color:var(--accent)'>🤖 Lv.100 AI Analysis</h3>" + this.current.e;
        el.style.display = 'block';
        MathJax.typesetPromise([el]);
    },

    draw(a, b, c, abs = false) {
        const ctx = document.getElementById('mainChart').getContext('2d');
        if (this.chart) this.chart.destroy();
        const pts = [];
        for (let x = -10; x <= 10; x += 0.1) {
            let y = a * x * x + b * x + c;
            if (abs) y = Math.abs(y);
            pts.push({ x, y });
        }
        this.chart = new Chart(ctx, {
            type: 'scatter',
            data: { datasets: [{ data: pts, showLine: true, borderColor: '#c026d3', borderWidth: 3, pointRadius: 0, tension: 0.4 }] },
            options: { 
                responsive: true, maintainAspectRatio: false,
                scales: { 
                    x: { min: -8, max: 8, grid: { color: '#1e293b' } }, 
                    y: { min: -10, max: 15, grid: { color: '#1e293b' } } 
                },
                plugins: { legend: { display: false } }
            }
        });
    }
};

window.onload = () => app.reload();
</script>
</body>
</html>
