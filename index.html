<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>KYOTO GIGA-MAX: TEXT-BASED LOGIC</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #000; --card: #0a0a0a;
            --neon-blue: #00f2ff; --neon-green: #39ff14; --neon-mag: #ff00ff;
            --text: #fff; --ans: #ffcc00;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: var(--bg); color: var(--text); font-family: 'Avenir','Helvetica Neue','Hiragino Sans','Meiryo',sans-serif;
            height: 100vh; width: 100vw; overflow: hidden; display: flex; 
        }

        /* サイドバー：横幅を抑えてメインを最大化 */
        aside { 
            width: 200px; background: #050505; border-right: 2px solid var(--neon-blue);
            display: flex; flex-direction: column; padding: 10px; z-index: 100;
        }
        .cat { font-size: 0.7rem; color: #444; margin: 15px 0 5px; font-weight: bold; border-left: 3px solid var(--neon-blue); padding-left: 5px; }
        .nav-btn { 
            width: 100%; padding: 12px; background: transparent; border: 1px solid #222; 
            color: #555; text-align: left; cursor: pointer; margin-bottom: 5px; border-radius: 6px; font-size: 0.8rem;
        }
        .nav-btn.active { border-color: var(--neon-blue); background: rgba(0, 242, 255, 0.2); color: #fff; font-weight: bold; box-shadow: 0 0 10px var(--neon-blue); }

        /* メイン：完全一画面構成 */
        main { flex: 1; display: flex; flex-direction: column; padding: 10px; height: 100vh; gap: 10px; }

        /* 問題エリア：画面の約45%を使用 */
        .problem-zone { 
            height: 45%; background: var(--card); border: 1px solid #1a1a1a; border-radius: 15px;
            display: flex; flex-direction: column; padding: 25px; justify-content: center; position: relative;
        }
        .mode-indicator { position: absolute; top: 15px; left: 20px; font-size: 0.9rem; color: var(--neon-mag); letter-spacing: 2px; }
        
        .formula-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .math-text { font-size: 4.5rem; font-weight: 800; text-align: center; margin-bottom: 15px; }
        .sup { font-size: 0.5em; vertical-align: super; color: var(--neon-green); margin-left: 2px; }
        
        .instruction-text { 
            color: var(--neon-blue); font-size: 2.8rem; font-weight: 900;
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.6);
            border-top: 2px solid #222; padding-top: 10px;
        }

        .action-row { display: flex; gap: 15px; margin-top: 20px; }
        .btn { flex: 1; height: 60px; border: none; border-radius: 10px; font-weight: 900; cursor: pointer; font-size: 1.4rem; text-transform: uppercase; transition: 0.2s; }
        .btn-gen { background: var(--neon-blue); color: #000; box-shadow: 0 0 15px var(--neon-blue); }
        .btn-ans { background: #1a1a1a; color: #fff; border: 1px solid #333; }
        .btn:hover { opacity: 0.8; transform: scale(1.01); }

        .result-panel { 
            margin-top: 15px; padding: 15px; background: rgba(255, 204, 0, 0.1); 
            border: 1px dashed var(--ans); border-radius: 10px; display: none; 
            color: var(--ans); font-size: 1.8rem; text-align: center; font-weight: bold;
        }

        /* グラフエリア：残りの55%を使用 */
        .graph-zone { flex: 1; background: #000; border: 1px solid #111; border-radius: 15px; overflow: hidden; }
        canvas { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>

<aside>
    <div style="color:var(--neon-blue); font-weight:900; margin: 10px 0 20px; text-align:center; font-size:1.4rem; letter-spacing:3px;">GIGA CORE</div>
    
    <div class="cat">BASIC (基礎)</div>
    <button class="nav-btn active" onclick="app.set('k_square', this)">平方完成・頂点</button>
    <button class="nav-btn" onclick="app.set('k_move', this)">平行移動</button>
    <button class="nav-btn" onclick="app.set('k_ineq', this)">二次不等式</button>
    
    <div class="cat">ELITE (応用)</div>
    <button class="nav-btn" onclick="app.set('a_maxmin', this)">軸が動く最大最小</button>
    <button class="nav-btn" onclick="app.set('a_root_pos', this)">解の配置</button>
    <button class="nav-btn" onclick="app.set('a_abs', this)">絶対値と共有点</button>
    <button class="nav-btn" onclick="app.set('a_area', this)">通過領域</button>
</aside>

<main>
    <div class="problem-zone">
        <div class="mode-indicator" id="mode-text">PHASE: BASIC</div>
        <div class="formula-container">
            <div class="math-text" id="formula-display">y = x<span class="sup">2</span> + 4x + 3</div>
            <div class="instruction-text" id="inst-display">の頂点の座標を求めよ。</div>
        </div>
        <div class="action-row">
            <button class="btn btn-gen" onclick="app.generate()">GENERATE PROBLEM</button>
            <button class="btn btn-ans" onclick="app.toggleAns()">ANALYSIS</button>
        </div>
        <div id="ans-panel" class="result-panel"></div>
    </div>
    <div class="graph-zone">
        <canvas id="main-chart"></canvas>
    </div>
</main>

<script>
const app = {
    currentMode: 'k_square',
    chart: null,

    r: (min, max) => Math.floor(Math.random() * (max - min + 1)) + min,

    set(mode, btn) {
        this.currentMode = mode;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('mode-text').innerText = `PHASE: ${mode.startsWith('a_') ? 'ELITE' : 'BASIC'}`;
        this.generate();
    },

    toggleAns() {
        const p = document.getElementById('ans-panel');
        p.style.display = p.style.display === 'block' ? 'none' : 'block';
    },

    // 問題種別ごとの独立エンジン
    engines: {
        k_square: () => {
            const a = app.r(1, 2), b = app.r(-8, 8), c = app.r(-5, 5);
            return {
                f: `y = ${a==1?'':a}x<span class="sup">2</span>${b>=0?'+':''}${b}x${c>=0?'+':''}${c}`,
                i: "の頂点の座標を求めよ。",
                a: `頂点: (${-b/(2*a)}, ${(4*a*c-b*b)/(4*a)})`,
                cfg: { a, b, c }
            };
        },
        k_move: () => {
            const mx = app.r(-5, 5), my = app.r(-5, 5);
            return {
                f: `y = x<span class="sup">2</span> を x軸:${mx}, y軸:${my} 移動`,
                i: "した後のグラフの式を求めよ。",
                a: `y = (x ${-mx>=0?'+':''}${-mx})<span class="sup">2</span> ${my>=0?'+':''}${my}`,
                cfg: { a:1, b:-2*mx, c:mx*mx+my }
            };
        },
        k_ineq: () => {
            const x1 = app.r(-3, 0), x2 = x1 + app.r(2, 5);
            return {
                f: `x<span class="sup">2</span>${-(x1+x2)>=0?'+':''}${-(x1+x2)}x+${x1*x2} ≦ 0`,
                i: "を満たす x の範囲を求めよ。",
                a: `${x1} ≦ x ≦ ${x2}`,
                cfg: { a:1, b:-(x1+x2), c:x1*x2 }
            };
        },
        a_maxmin: () => {
            const c = app.r(2, 6);
            return {
                f: `y = x<span class="sup">2</span> - 2ax + ${c}`,
                i: "0 ≦ x ≦ 2 における最小値を求めよ。",
                a: `a<0: ${c} | 0≦a≦2: ${c}-a² | a>2: ${c+4}-4a`,
                cfg: { a:1, b:-2, c:c, isElite: true }
            };
        },
        a_root_pos: () => {
            const k = app.r(2, 6);
            return {
                f: `x<span class="sup">2</span> - 2ax + ${k} = 0`,
                i: "x > 1 で異なる2つの実数解をもつ a の範囲を求めよ。",
                a: `D>0, 軸>1, f(1)>0 より √${k} < a < ${(k+1)/2}`,
                cfg: { a:1, b:-4, c:k }
            };
        },
        a_abs: () => {
            const k = app.r(1, 2);
            return {
                f: `y = |x<span class="sup">2</span> - 4x + 3|`,
                i: `y = ${k} との共有点の個数を調べよ。`,
                a: `k=${k} のとき、共有点は ${k==1?3:2} 個です。`,
                cfg: { a:1, b:-4, c:3, isAbs: true, k_line: k }
            };
        },
        a_area: () => {
            return {
                f: `y = 2mx - m<span class="sup">2</span> (0 ≦ m ≦ 1)`,
                i: "この直線が動く範囲(通過領域)を求めよ。",
                a: `境界線 y = x² および y = 2x-1。図示参照。`,
                cfg: { isArea: true }
            };
        }
    },

    generate() {
        const engine = this.engines[this.currentMode];
        const res = engine();
        document.getElementById('formula-display').innerHTML = res.f;
        document.getElementById('inst-display').innerText = res.i;
        document.getElementById('ans-panel').innerHTML = `【ANALYSIS】 ${res.a}`;
        document.getElementById('ans-panel').style.display = 'none';
        this.draw(res.cfg);
    },

    draw(cfg) {
        const ctx = document.getElementById('main-chart').getContext('2d');
        if (this.chart) this.chart.destroy();
        
        let datasets = [];
        if (cfg.isArea) {
            for(let m=0; m<=1; m+=0.1) {
                let d = []; for(let x=-1; x<=3; x+=0.1) d.push({x, y: 2*m*x - m*m});
                datasets.push({ data: d, showLine: true, borderColor: `rgba(0, 242, 255, ${1.1-m})`, borderWidth: 2, pointRadius: 0 });
            }
        } else {
            let d = []; for(let x=-6; x<=8; x+=0.1) {
                let y = (cfg.a||1)*x*x + (cfg.b||0)*x + (cfg.c||0);
                if (cfg.isAbs) y = Math.abs(y);
                d.push({x, y});
            }
            datasets.push({ data: d, showLine: true, borderColor: '#39ff14', borderWidth: 8, pointRadius: 0 });
            if (cfg.k_line) datasets.push({ data: [{x:-10, y:cfg.k_line}, {x:10, y:cfg.k_line}], showLine: true, borderColor: '#ff00ff', borderDash: [10,10], borderWidth: 4, pointRadius: 0 });
        }

        this.chart = new Chart(ctx, {
            type: 'scatter',
            data: { datasets },
            options: {
                responsive: true, maintainAspectRatio: false, animation: false,
                scales: {
                    x: { min: -4, max: 6, position: 'center', grid: { color: '#222' }, ticks: { color: '#666', font: {size: 18} } },
                    y: { min: -3, max: 10, position: 'center', grid: { color: '#222' }, ticks: { color: '#666', font: {size: 18} } }
                },
                plugins: { legend: { display: false } }
            }
        });
    }
};

window.onload = () => app.generate();
</script>
</body>
</html>
