<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ポータブル教頭：FG完全網羅・究極版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root {
            --bg: #050505;
            --sidebar: #0a0a0a;
            --card: #111;
            --border: #333;
            --neon: #00f2ff;
            --neon-sub: #39ff14;
            --text: #eee;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Consolas', 'Hiragino Kaku Gothic ProN', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* サイドバー */
        aside { width: 320px; background: var(--sidebar); border-right: 2px solid var(--neon); padding: 20px; overflow-y: auto; scrollbar-width: thin; }
        .brand { border-bottom: 2px solid var(--neon); padding-bottom: 10px; margin-bottom: 20px; }
        .brand h1 { font-size: 1.2rem; color: var(--neon); margin: 0; }

        .category-label { font-size: 0.75rem; color: #666; text-transform: uppercase; margin: 15px 0 8px; display: block; border-left: 3px solid #444; padding-left: 8px; font-weight: bold; }
        
        .menu-btn { width: 100%; padding: 10px 12px; background: #111; border: 1px solid var(--border); color: #888; text-align: left; cursor: pointer; margin-bottom: 5px; border-radius: 4px; font-size: 0.85rem; transition: 0.2s; }
        .menu-btn:hover { border-color: var(--neon); color: #fff; }
        .menu-btn.active { border-color: var(--neon); background: rgba(0, 242, 255, 0.1); color: #fff; box-shadow: 0 0 10px rgba(0, 242, 255, 0.1); }
        .menu-btn.kiso-btn { border-left: 4px solid var(--neon-sub); }
        .menu-btn.nanmon-btn { border-left: 4px solid #ff00ff; }

        /* メイン講義エリア */
        main { flex: 1; padding: 25px; display: flex; flex-direction: column; gap: 15px; overflow: hidden; }
        .problem-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 25px; position: relative; flex-shrink: 0; }
        .math-display { background: #000; border: 1px solid #222; padding: 20px; margin: 15px 0; border-radius: 8px; min-height: 80px; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; color: #fff; }
        
        .btn-gen { width: 100%; padding: 18px; background: var(--neon); color: #000; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; font-size: 1.1rem; }
        .btn-gen:hover { box-shadow: 0 0 25px var(--neon); transform: translateY(-1px); }

        .graph-wrap { flex: 1; background: #000; border: 1px solid var(--border); border-radius: 12px; padding: 10px; position: relative; overflow: hidden; }
        canvas { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>

<aside>
    <div class="brand">
        <h1>PORTABLE KYOTO</h1>
        <p style="font-size: 0.6rem; color: #555; margin: 2px 0;">FOCUS GOLD ALL-IN-ONE ENGINE</p>
    </div>

    <span class="category-label">【基礎：星1〜2】</span>
    <button class="menu-btn kiso-btn active" onclick="app.setMode('k_square', this)">平方完成と頂点</button>
    <button class="menu-btn kiso-btn" onclick="app.setMode('k_move', this)">グラフの平行移動</button>
    <button class="menu-btn kiso-btn" onclick="app.setMode('k_axis', this)">3点から式を決定</button>
    <button class="menu-btn kiso-btn" onclick="app.setMode('k_maxmin', this)">最大・最小の基本</button>
    <button class="menu-btn kiso-btn" onclick="app.setMode('k_ineq', this)">2次不等式の解法</button>
    <button class="menu-btn kiso-btn" onclick="app.setMode('k_kouten', this)">x軸との共有点(D)</button>

    <span class="category-label">【応用：星3〜4】</span>
    <button class="menu-btn nanmon-btn" onclick="app.setMode('a_axis_move', this)">軸が動く最大最小</button>
    <button class="menu-btn nanmon-btn" onclick="app.setMode('a_root_pos', this)">解の配置（D・軸・境界）</button>
    <button class="menu-btn nanmon-btn" onclick="app.setMode('a_area', this)">通過領域（逆像法）</button>
    <button class="menu-btn nanmon-btn" onclick="app.setMode('a_abs', this)">絶対値関数の共有点</button>
    <button class="menu-btn nanmon-btn" onclick="app.setMode('a_int', this)">整数解の個数限定</button>
    <button class="menu-btn nanmon-btn" onclick="app.setMode('a_sym', this)">対称式の実数存在条件</button>
    <button class="menu-btn nanmon-btn" onclick="app.setMode('a_tri', this)">直角三角形の斜辺範囲</button>
</aside>

<main>
    <div class="problem-card">
        <div id="instr" style="font-size: 1rem; color: #aaa; margin-bottom: 5px;"></div>
        <div class="math-display"><div id="math-box"></div></div>
        <button class="btn-gen" onclick="app.generate()">類題を無限生成</button>
    </div>
    <div class="graph-wrap">
        <canvas id="mainChart"></canvas>
    </div>
</main>

<script>
const app = {
    mode: 'k_square', chart: null,
    r(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; },

    setMode(m, b) {
        this.mode = m;
        document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
        b.classList.add('active');
        this.generate();
    },

    generate() {
        const inst = document.getElementById('instr');
        const box = document.getElementById('math-box');
        let t = "", m = "", conf = {};
        const a = this.r(1, 2); const p = this.r(-3, 3); const q = this.r(-4, 4);
        const k = this.r(3, 10);

        switch(this.mode) {
            case 'k_square':
                t = "【基礎】次の2次関数を平方完成し、頂点の座標を答えよ。";
                m = `y = ${a}x^2 ${-2*a*p >= 0 ? '+' : ''} ${-2*a*p}x ${a*p*p+q >= 0 ? '+' : ''} ${a*p*p+q}`;
                conf = { type: 'p', a: a, p: p, q: q }; break;
            case 'k_move':
                const dx = this.r(-3, 3); const dy = this.r(-3, 3);
                t = `【基礎】$y = x^2$ を $x$ 軸方向に $ ${dx} $、$y$ 軸方向に $ ${dy} $ だけ平行移動した式。`;
                m = `y = (x - p)^2 + q`;
                conf = { type: 'p', a: 1, p: dx, q: dy }; break;
            case 'k_axis':
                t = "【基礎】3点 $(1, 0), (3, 0), (0, 6)$ を通る2次関数。";
                m = `y = a(x - \\alpha)(x - \\beta)`;
                conf = { type: 'std', a: 2, b: -8, c: 6 }; break;
            case 'k_maxmin':
                t = `【基礎】$0 \\leqq x \\leqq 4$ における $y = (x-2)^2 + ${q}$ の最大・最小。`;
                m = `y = (x - 2)^2 ${q >= 0 ? '+' : ''} ${q}`;
                conf = { type: 'p', a: 1, p: 2, q: q }; break;
            case 'k_ineq':
                t = "【基礎】次の2次不等式を解け。";
                m = `x^2 - 5x + 6 \\leqq 0`;
                conf = { type: 'std', a: 1, b: -5, c: 6 }; break;
            case 'k_kouten':
                t = "【基礎】放物線が $x$ 軸と接する条件。";
                m = `x^2 + kx + 1 = 0 \\quad (D=0)`;
                conf = { type: 'std', a: 1, b: 2, c: 1 }; break;
            case 'a_axis_move':
                t = "【応用】動く軸 $x=a$ における最小値の分類。";
                m = `y = x^2 - 2ax \\quad (0 \\leqq x \\leqq 2)`;
                conf = { type: 'p', a: 1, p: 1, q: -1 }; break;
            case 'a_root_pos':
                t = "【応用】$x > 1$ の範囲に異なる2つの実数解をもつ条件。";
                m = `x^2 - 2ax + ${k} = 0`;
                conf = { type: 'std', a: 1, b: -4, c: k }; break;
            case 'a_area':
                t = "【最難関】パラメータ $m$ が動くときの通過領域。";
                m = `y = x^2 - 2mx + m \\quad (0 \\leqq m \\leqq 1)`;
                conf = { type: 'area', range: 1, b: -2 }; break;
            case 'a_abs':
                t = "【応用】絶対値グラフと直線の共有点個数。";
                m = `y = |x^2 - 4x|`;
                conf = { type: 'abs', b: -4 }; break;
            case 'a_int':
                t = "【応用】整数解がちょうど3個となる範囲。";
                m = `x^2 - mx + m/4 - 1 \\leqq 0`;
                conf = { type: 'std', a: 1, b: -3, c: 0 }; break;
            case 'a_sym':
                t = "【応用】対称式と実数解条件 $D \\geqq 0$。";
                m = `x^2 + xy + y^2 = 12`;
                conf = { type: 'std', a: 1, b: 0, c: 0 }; break;
            case 'a_tri':
                t = "【応用】直角三角形の辺の長さの範囲。";
                m = `a^2 + b^2 = c^2, \\ a+b+c=12`;
                conf = { type: 'std', a: 1, b: 0, c: 0 }; break;
        }

        inst.innerHTML = t;
        box.innerHTML = `\\[ ${m} \\]`;
        if (window.MathJax) MathJax.typesetPromise();
        this.draw(conf);
    },

    draw(conf) {
        const ctx = document.getElementById('mainChart').getContext('2d');
        if (this.chart) this.chart.destroy();
        let ds = [];

        if (conf.type === 'p') {
            let d = []; for(let x=conf.p-5; x<=conf.p+5; x+=0.2) d.push({x: x, y: conf.a*(x-conf.p)**2 + conf.q});
            ds.push({ data: d, showLine: true, borderColor: '#00f2ff', borderWidth: 2, pointRadius: 0 });
            ds.push({ data: [{x: conf.p, y: conf.q}], pointRadius: 6, pointBackgroundColor: '#ff00ff' });
        } else if (conf.type === 'area') {
            for(let m=0; m<=1.1; m+=0.2) {
                let d = []; for(let x=-2; x<=4; x+=0.2) d.push({x: x, y: x*x + conf.b*m*x + m});
                ds.push({ data: d, showLine: true, borderColor: `rgba(0, 242, 255, ${1.1-m})`, borderWidth: 1, pointRadius: 0 });
            }
        } else if (conf.type === 'abs') {
            let d = []; for(let x=-1; x<=5; x+=0.1) d.push({x: x, y: Math.abs(x*x + conf.b*x)});
            ds.push({ data: d, showLine: true, borderColor: '#ff00ff', borderWidth: 2, pointRadius: 0 });
        } else {
            let d = []; for(let x=-5; x<=10; x+=0.2) d.push({x: x, y: conf.a*x*x + (conf.b||0)*x + (conf.c||0)});
            ds.push({ data: d, showLine: true, borderColor: '#39ff14', borderWidth: 2, pointRadius: 0 });
        }

        this.chart = new Chart(ctx, {
            type: 'scatter',
            data: { datasets: ds },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    x: { type: 'linear', position: 'center', grid: { color: '#222' } },
                    y: { type: 'linear', position: 'center', grid: { color: '#222' } }
                },
                plugins: { legend: { display: false } }
            }
        });
    }
};

window.onload = () => setTimeout(() => app.generate(), 500);
</script>
</body>
</html>
