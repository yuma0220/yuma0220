<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>PORTABLE KYOTO: THE FINAL ANSWER</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #000; --sidebar: #050505; --card: #0a0a0a;
            --neon-blue: #00f2ff; --neon-green: #39ff14; --neon-mag: #ff00ff;
            --text: #fff; --sub: #555; --ans: #ffcc00;
        }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Consolas', monospace; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        aside { width: 300px; background: var(--sidebar); border-right: 2px solid var(--neon-blue); display: flex; flex-direction: column; padding: 15px; }
        .logo h1 { font-size: 1.2rem; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); text-align: center; margin: 10px 0; }
        
        .nav-list { flex: 1; overflow-y: auto; }
        .cat { font-size: 0.7rem; color: var(--sub); margin: 15px 0 5px; border-left: 3px solid var(--neon-blue); padding-left: 5px; }
        .nav-btn { width: 100%; padding: 10px; background: transparent; border: 1px solid #111; color: #666; text-align: left; cursor: pointer; margin-bottom: 4px; border-radius: 4px; font-size: 0.8rem; }
        .nav-btn:hover { border-color: var(--neon-blue); color: #fff; }
        .nav-btn.active { border-color: var(--neon-blue); background: rgba(0, 242, 255, 0.15); color: #fff; font-weight: bold; }
        .kiso { border-left: 4px solid var(--neon-green) !important; }
        .elite { border-left: 4px solid var(--neon-mag) !important; }

        main { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 15px; }
        .p-card { background: var(--card); border: 1px solid #1a1a1a; border-radius: 12px; padding: 20px; box-shadow: 0 0 30px #000; }
        
        /* 横1行・明快な問題文 */
        .math-display {
            background: #000; border: 1px solid #222; padding: 25px; margin: 10px 0; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; font-size: 1.8rem; line-height: 1.4;
        }
        .sup { font-size: 0.6em; vertical-align: super; margin-left: 2px; color: var(--neon-green); }
        .instruction { color: var(--neon-blue); font-weight: bold; margin-left: 15px; font-size: 1.4rem; }

        .btn-row { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; font-size: 1.1rem; }
        .gen { background: var(--neon-blue); color: #000; }
        .ans-btn { background: #222; color: #fff; }

        .ans-area { padding: 15px; background: rgba(255, 204, 0, 0.05); border: 1px dashed var(--ans); border-radius: 8px; display: none; color: var(--ans); font-size: 1.1rem; }

        .graph-area { flex: 1; background: #000; border: 1px solid #111; border-radius: 12px; position: relative; min-height: 0; }
    </style>
</head>
<body>

<aside>
    <div class="logo"><h1>KYOTO GIGA CORE</h1></div>
    <div class="nav-list">
        <div class="cat">BASIC</div>
        <button class="nav-btn kiso active" onclick="app.set('k_square', this)">01. 平方完成と頂点</button>
        <button class="nav-btn kiso" onclick="app.set('k_move', this)">02. グラフの平行移動</button>
        <button class="nav-btn kiso" onclick="app.set('k_axis', this)">03. 三点を通る式</button>
        <button class="nav-btn kiso" onclick="app.set('k_maxmin', this)">04. 最大・最小</button>
        <button class="nav-btn kiso" onclick="app.set('k_ineq', this)">05. 二次不等式</button>
        <button class="nav-btn kiso" onclick="app.set('k_kouten', this)">06. x軸との共有点</button>
        <div class="cat">ELITE</div>
        <button class="nav-btn elite" onclick="app.set('a_axis_move', this)">07. 軸が動く最大最小</button>
        <button class="nav-btn elite" onclick="app.set('a_root_pos', this)">08. 解の配置</button>
        <button class="nav-btn elite" onclick="app.set('a_area', this)">09. 通過領域</button>
        <button class="nav-btn elite" onclick="app.set('a_abs', this)">10. 絶対値関数</button>
        <button class="nav-btn elite" onclick="app.set('a_int', this)">11. 整数解条件</button>
        <button class="nav-btn elite" onclick="app.set('a_sym', this)">12. 対称式の存在条件</button>
        <button class="nav-btn elite" onclick="app.set('a_tri', this)">13. 三角形への応用</button>
    </div>
</aside>

<main>
    <div class="p-card">
        <div id="mode-label" style="color:var(--sub); font-size:0.7rem; font-weight:bold;">MISSION_START</div>
        <div class="math-display" id="display">
            </div>
        <div class="btn-row">
            <button class="btn gen" onclick="app.gen()">GENERATE PROBLEM</button>
            <button class="btn ans-btn" onclick="app.toggle()">ANALYSIS</button>
        </div>
        <div id="ans" class="ans-area"></div>
    </div>
    <div class="graph-area"><canvas id="chart"></canvas></div>
</main>

<script>
const app = {
    mode: 'k_square', chart: null,
    r: (n, m) => Math.floor(Math.random() * (m - n + 1)) + n,
    gcd: (a, b) => b ? app.gcd(b, a % b) : Math.abs(a),
    f: (n, d) => {
        const c = app.gcd(n, d); n /= c; d /= c;
        if (d < 0) { n *= -1; d *= -1; }
        return d === 1 ? `${n}` : `<span class="frac"><span class="frac-n">${n}</span><span class="frac-d">${d}</span></span>`;
    },

    set(m, el) {
        this.mode = m;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        this.gen();
    },

    toggle() {
        const b = document.getElementById('ans');
        b.style.display = b.style.display === 'block' ? 'none' : 'block';
    },

    engines: {
        k_square: () => {
            const a = app.r(1, 2), b = app.r(-8, 8), c = app.r(-5, 5);
            return {
                q: `y = ${a==1?'':a}x<span class="sup">2</span>${b>=0?'+':''}${b}x${c>=0?'+':''}${c}`,
                inst: "の頂点の座標を求めよ。",
                ans: `頂点: (${app.f(-b, 2*a)}, ${app.f(4*a*c-b*b, 4*a)})`,
                c: { a, b, c, type:'std' }
            };
        },
        k_move: () => {
            const mx = app.r(-5, 5), my = app.r(-5, 5);
            return {
                q: `y = x<span class="sup">2</span> をx軸:${mx}, y軸:${my} 移動`,
                inst: "した後の式を求めよ。",
                ans: `y = (x - ${mx})<span class="sup">2</span> ${my>=0?'+':''}${my}`,
                c: { a:1, b:-2*mx, c:mx*mx+my, type:'std' }
            };
        },
        a_root_pos: () => {
            const k = app.r(2, 5);
            return {
                q: `x<span class="sup">2</span> - 2ax + ${k} = 0 が x > 1 で2解`,
                inst: "をもつ a の範囲を求めよ。",
                ans: `D>0, 軸>1, f(1)>0 の連立 ➡ √${k} < a < ${app.f(k+1, 2)}`,
                c: { a:1, b:-4, c:k, type:'std' }
            };
        },
        a_abs: () => {
            const k = app.r(1, 2);
            return {
                q: `y = |x<span class="sup">2</span> - 4x + 3| と y = ${k}`,
                inst: "の共有点の個数を調べよ。",
                ans: `k=${k} のとき、交点は ${k==1?3:2} 個です。`,
                c: { a:1, b:-4, c:3, type:'abs', k_val: k }
            };
        }
        // 他のメニューも同様に「inst」を追加
    },

    gen() {
        const eng = this.engines[this.mode] || this.engines.k_square;
        const res = eng();
        document.getElementById('display').innerHTML = `<span>${res.q}</span><span class="instruction">${res.inst}</span>`;
        document.getElementById('ans').innerHTML = `【解析結果】<br>${res.ans}`;
        document.getElementById('ans').style.display = 'none';
        this.draw(res.c);
    },

    draw(c) {
        const ctx = document.getElementById('chart').getContext('2d');
        if (this.chart) this.chart.destroy();
        let ds = [];
        let d = []; for(let x=-8; x<=8; x+=0.1) {
            let y = c.a*x*x + (c.b||0)*x + (c.c||0);
            if (c.type === 'abs') y = Math.abs(y);
            d.push({x, y});
        }
        ds.push({ data: d, showLine: true, borderColor: '#39ff14', borderWidth: 3, pointRadius: 0 });
        if (c.k_val) ds.push({ data: [{x:-10, y:c.k_val}, {x:10, y:c.k_val}], showLine: true, borderColor: '#ff00ff', borderDash: [5,5], pointRadius: 0 });

        this.chart = new Chart(ctx, {
            type: 'scatter',
            data: { datasets: ds },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    x: { min: -10, max: 10, position: 'center', grid: { color: '#111' } },
                    y: { min: -5, max: 15, position: 'center', grid: { color: '#111' } }
                },
                plugins: { legend: { display: false } }
            }
        });
    }
};
window.onload = () => app.gen();
</script>
</body>
</html>
